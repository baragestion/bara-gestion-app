<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdoulaye Shop</title>
<meta name="description" content="Baskets, jeans, maillots et tenues tendance à Bèguédo. Commandez sur WhatsApp.">
<meta property="og:title" content="Abdoulaye Shop">
<meta property="og:description" content="Baskets, jeans, maillots. Commandez sur WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700;800&family=Space+Mono:wght@700&display=swap">
<style>
/* Style « rue » : béton clair, encre noire, orange signalisation. Gros titres serrés, étiquettes de prix façon sticker. */
:root{
  --concrete:#E7E3DC; --slab:#F4F1EB; --ink:#121212; --soft:#5B5750; --line:#CFC9BF;
  --signal:#FF5A1F; --signal-ink:#FFFFFF; --wa:#1E8E4E;
  --f-head:'Anton','Impact','Arial Narrow',sans-serif; --f-body:'Manrope','Segoe UI',Arial,sans-serif; --f-tag:'Space Mono','Courier New',monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box} [hidden]{display:none!important} img{max-width:100%;display:block}
body{margin:0;background:var(--concrete);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.ticker{background:var(--ink);color:var(--slab);overflow:hidden;white-space:nowrap;font:700 13px var(--f-tag);letter-spacing:1px;text-transform:uppercase}
.ticker span{display:inline-block;padding:9px 0;animation:roll 28s linear infinite}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none}}

header .wrap{padding-block:26px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.brand{font-family:var(--f-head);font-size:clamp(48px,14.5vw,168px);overflow-wrap:anywhere;line-height:.86;text-transform:uppercase;margin:0;letter-spacing:-.5px}
.brand em{font-style:normal;color:var(--signal)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font:700 12px var(--f-tag);text-transform:uppercase;letter-spacing:1px;border:2px solid var(--ink);padding:6px 10px;border-radius:999px}
.tag{margin:0;font-size:18px;font-weight:700;max-width:38ch}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border-radius:14px;
  background:var(--wa);color:#fff;font:800 17px var(--f-body);text-decoration:none;border:0;cursor:pointer;justify-self:start}
.cta svg{width:22px;height:22px}
a:focus-visible,button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:14px;margin-block:6px 28px}
.hero .big{position:relative;border-radius:22px;overflow:hidden;background:var(--slab);aspect-ratio:4/5;max-width:100%}
.hero .big img{width:100%;height:100%;object-fit:cover}
.hero .side{display:grid;gap:14px;grid-template-rows:1fr 1fr;min-width:0}
.hero .big,.grid>*{min-width:0}
.hero .side .big{aspect-ratio:auto}
.label{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:space-between;align-items:end;gap:8px}
.label b{background:var(--slab);padding:6px 10px;border-radius:10px;font-size:15px;line-height:1.2}
.sticker{font:700 15px var(--f-tag);background:var(--signal);color:var(--signal-ink);padding:8px 10px;border-radius:10px;transform:rotate(-4deg);white-space:nowrap}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}.hero .side{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:none}.hero .side .big{aspect-ratio:4/5}
  .hero .side .label{flex-direction:column;align-items:flex-start}.hero .side .label b{font-size:13px}}

.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--concrete);border-block:2px solid var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--concrete)}
.cats .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chip{flex:none;border:2px solid var(--ink);background:transparent;color:var(--ink);font:400 20px var(--f-head);text-transform:uppercase;letter-spacing:.5px;padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--slab)}

main .wrap{padding-block:22px 150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(165px,45%),1fr));gap:14px}
.card{background:var(--slab);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/5;background:var(--line);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .sticker{position:absolute;right:10px;bottom:10px}
.ph .out{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,18,18,.55);color:#fff;font:400 30px var(--f-head);text-transform:uppercase;letter-spacing:1px}
.info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.name{font-weight:800;font-size:16px;line-height:1.25}
.det{font-size:13px;color:var(--soft);margin:-4px 0 0}
.add{margin-top:auto;min-height:46px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:800 15px var(--f-body);cursor:pointer;text-decoration:none;display:grid;place-items:center}
.add.ask{border-style:dashed}
.qty{margin-top:auto;display:flex;align-items:center;justify-content:space-between;min-height:46px;border-radius:12px;background:var(--ink);color:var(--slab)}
.qty button{width:46px;height:46px;border:0;background:transparent;color:inherit;font:800 22px var(--f-body);cursor:pointer}
.qty span{font:700 16px var(--f-tag)}

.info-band{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.box{border:2px solid var(--ink);border-radius:18px;padding:18px;display:grid;gap:6px}
.box h2{font:400 26px var(--f-head);text-transform:uppercase;margin:0 0 4px}
.box p{margin:0}
.num{font:700 22px var(--f-tag);user-select:all}
.foot{text-align:center;color:var(--soft);font-size:13px;margin-top:30px}
.empty{padding:50px 0;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h2{font:400 34px var(--f-head);text-transform:uppercase;margin:0}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--ink);color:var(--slab);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;min-width:0}
.bar .sum b{display:block;font:700 22px var(--f-tag)}
.bar .sum small{opacity:.75}
.bar .cta{background:var(--signal)}
</style>
</head>
<body>
<div class="ticker" aria-hidden="true"><span id="tick"></span></div>
<div id="root"><div class="wrap empty"><p>Chargement…</p></div></div>

<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div class="sum"><b id="bar-total">0 F</b><small id="bar-count">0 article</small></div>
    <a class="cta" id="wa-order" target="_blank" rel="noopener">Commander</a>
  </div>
</div>

<script>
/* Site d'Abdoulaye Shop. Les produits viennent de sa vitrine (il les gère dans « Ma vitrine »). */
const SLUG = 'abdoulaye-shop';
const SB_URL = 'https://uqnucmgsgkwalxodqmjr.supabase.co';
const SB_KEY = 'sb_publishable_3vrJsQkSN2QlL_MMwBPGgQ_rC-IvhNo';
const WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F = n => Number(n).toLocaleString('fr-FR').replace(/ | /g, ' ') + ' F';
const img = p => SB_URL + '/storage/v1/object/public/vitrine/' + p.split('/').map(encodeURIComponent).join('/');
let V = null, cat = 'Tout'; const cart = {};
const wa = t => 'https://wa.me/' + V.whatsapp + '?text=' + encodeURIComponent(t);

function ticker(city) {
  const t = ['Nouveaux arrivages', 'Baskets', 'Jeans', 'Maillots', city || 'Bèguédo', 'Commande sur WhatsApp'].join('  ✦  ') + '  ✦  ';
  $('tick').textContent = t.repeat(6);
}
ticker();

async function load() {
  try {
    const r = await fetch(SB_URL + '/rest/v1/rpc/vitrine_publique', { method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_slug: SLUG }) });
    if (!r.ok) throw new Error(r.status);
    V = await r.json();
  } catch (e) { return empty('Pas de connexion', 'Vérifiez internet puis rechargez.', true); }
  if (V.etat !== 'ok') return empty('Abdoulaye Shop', V.etat === 'pause' ? 'La boutique en ligne est en pause.' : 'La boutique en ligne arrive bientôt.');
  ticker(V.ville && V.ville.split(',')[0]);
  draw();
}
function empty(t, m, retry) {
  $('root').innerHTML = `<div class="wrap empty"><h2>${esc(t)}</h2><p>${esc(m)}</p>${retry ? '<button class="add" style="padding:0 20px" onclick="location.reload()">Recharger</button>' : ''}</div>`;
}
function sticker(p) { return p.prix == null ? '' : `<span class="sticker">${F(p.prix)}</span>`; }

function draw() {
  document.title = V.nom;
  const words = V.nom.trim().split(/\s+/);
  const brand = words.length > 1 ? esc(words.slice(0, -1).join(' ')) + ' <em>' + esc(words.at(-1)) + '</em>' : esc(V.nom);
  const top = V.produits.filter(p => p.photo && !p.epuise).slice(0, 3);
  const cats = ['Tout', ...new Set(V.produits.map(p => p.cat || 'Autres'))];
  const big = (p) => `<div class="big"><img src="${esc(img(p.photo))}" alt="${esc(p.nom)}"><div class="label"><b>${esc(p.nom)}</b>${sticker(p)}</div></div>`;
  $('root').innerHTML = `
  <header><div class="wrap">
    <h1 class="brand">${brand}</h1>
    <div class="meta"><span class="pill">${esc(V.ville || 'Bèguédo')}</span>${V.horaires ? `<span class="pill">${esc(V.horaires)}</span>` : ''}</div>
    ${V.slogan ? `<p class="tag">${esc(V.slogan)}</p>` : ''}
    <a class="cta" target="_blank" rel="noopener" href="${esc(wa('Salut ' + V.nom + ' ! J\'ai vu ta boutique en ligne. '))}">${WA} Écrire sur WhatsApp</a>
  </div></header>
  ${top.length >= 3 ? `<div class="wrap"><section class="hero" aria-label="À la une">${big(top[0])}<div class="side">${big(top[1])}${big(top[2])}</div></section></div>` : ''}
  ${cats.length > 2 ? `<nav class="cats" aria-label="Catégories"><div class="wrap" id="cats"></div></nav>` : ''}
  <main><div class="wrap">
    <div class="grid" id="grid"></div>
    ${V.produits.length ? '' : '<div class="empty"><h2>Bientôt</h2><p>Les produits arrivent.</p></div>'}
    <section class="info-band">
      <div class="box"><h2>Commander</h2><p>Ajoute tes articles, touche « Commander » : ta commande part sur WhatsApp. Dis ta taille ou ta pointure.</p></div>
      <div class="box"><h2>Nous trouver</h2>${V.adresse ? `<p>${esc(V.adresse)}</p>` : ''}<p class="num">+${esc(V.whatsapp.replace(/^(\d{3})(\d{2})(\d{2})(\d{2})(\d{2})$/, '$1 $2 $3 $4 $5'))}</p></div>
    </section>
    <p class="foot">© ${new Date().getFullYear()} ${esc(V.nom)} · Site réalisé par Bara</p>
  </div></main>`;
  if ($('cats')) {
    $('cats').innerHTML = cats.map((c, i) => `<button class="chip" data-c="${i}" aria-pressed="${c === cat}">${esc(c)}</button>`).join('');
    $('cats').querySelectorAll('.chip').forEach(b => b.onclick = () => { cat = cats[+b.dataset.c]; draw(); });
  }
  grid(); bar();
}
function grid() {
  $('grid').innerHTML = V.produits.map((p, i) => {
    if (cat !== 'Tout' && (p.cat || 'Autres') !== cat) return '';
    const q = cart[i] || 0;
    let act;
    if (p.epuise) act = '';
    else if (p.prix == null) act = `<a class="add ask" target="_blank" rel="noopener" href="${esc(wa('Salut ' + V.nom + ', c\'est combien : ' + p.nom + ' ?'))}">Demander le prix</a>`;
    else act = q ? `<div class="qty"><button aria-label="Retirer" data-m="${i}">−</button><span>${q}</span><button aria-label="Ajouter" data-p="${i}">+</button></div>`
                 : `<button class="add" data-p="${i}">Ajouter au panier</button>`;
    return `<article class="card"><div class="ph">${p.photo ? `<img src="${esc(img(p.photo))}" alt="${esc(p.nom)}" loading="lazy">` : ''}
      ${p.epuise ? '<span class="out">Épuisé</span>' : sticker(p)}</div>
      <div class="info"><div class="name">${esc(p.nom)}</div>${p.details ? `<p class="det">${esc(p.details)}</p>` : ''}${act}</div></article>`;
  }).join('');
  $('grid').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const i = +b.dataset.p; cart[i] = (cart[i] || 0) + 1; grid(); bar(); });
  $('grid').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const i = +b.dataset.m; if (!--cart[i]) delete cart[i]; grid(); bar(); });
}
function bar() {
  const ids = Object.keys(cart), n = ids.reduce((s, i) => s + cart[i], 0), t = ids.reduce((s, i) => s + cart[i] * V.produits[i].prix, 0);
  $('bar').hidden = !n; $('bar-total').textContent = F(t); $('bar-count').textContent = n + (n > 1 ? ' articles' : ' article');
  const lines = ids.map(i => `- ${cart[i]} × ${V.produits[i].nom} (${F(V.produits[i].prix * cart[i])})`).join('\n');
  $('wa-order').href = wa(`Salut ${V.nom}, je veux commander :\n${lines}\nTotal : ${F(t)}\n\nMa taille / pointure :\nMon nom :\nMon quartier :`);
}
load();
</script>
</body>
</html>
