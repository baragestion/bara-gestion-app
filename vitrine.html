<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitrine</title>
<meta name="description" content="Nos produits et nos prix. Commandez sur WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout : bande d'en-tête rayée façon Faso Dan Fani, puis grille de produits 2 colonnes sur téléphone, barre panier collée en bas */
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --ink:#1D1A2B; --muted:#6A6475; --line:#E3DDD3;
  --indigo:#2C3C8F; --ochre:#D58A26; --red:#B23A2E; --wa:#1C8C4C; --wa-ink:#FFFFFF;
  --chip:#ECE6DC;
  --f-display:'Bricolage Grotesque', 'Arial Narrow', Arial, sans-serif;
  --f-body:'Figtree', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131E; --card:#201D2C; --ink:#F2EEE6; --muted:#ABA4B6; --line:#332F40;
  --indigo:#8E9BEA; --ochre:#E9A74C; --red:#E07062; --wa:#25A55C; --wa-ink:#FFFFFF; --chip:#2A2638; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131E; --card:#201D2C; --ink:#F2EEE6; --muted:#ABA4B6; --line:#332F40;
  --indigo:#8E9BEA; --ochre:#E9A74C; --red:#E07062; --wa:#25A55C; --wa-ink:#FFFFFF; --chip:#2A2638; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.demo{background:var(--ink);color:var(--bg);font-size:13px;text-align:center;padding-block:6px}

.stripes{height:14px;background:repeating-linear-gradient(90deg,var(--indigo) 0 22px,var(--ochre) 22px 30px,var(--red) 30px 44px,var(--bg) 44px 48px,var(--indigo) 48px 56px,var(--line) 56px 60px)}

header .wrap{padding-block:28px 22px;display:flex;flex-direction:column;gap:14px}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;align-self:flex-start;padding:6px 12px;border-radius:999px;background:var(--chip)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.open .dot{background:var(--wa)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,9vw,64px);line-height:.98;margin:0;letter-spacing:-.5px;text-wrap:balance}
.tag{margin:0;color:var(--muted);font-size:18px;max-width:46ch}
.where{font-size:15px;color:var(--muted);margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:14px;font-weight:700;font-size:17px;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
.btn-wa{background:var(--wa);color:var(--wa-ink)}
.btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,.add:focus-visible,.qty button:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.btn svg{width:22px;height:22px;flex:none}

.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--ink);font:600 15px var(--f-body);padding:10px 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

main .wrap{padding-block:20px 140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.ph{aspect-ratio:4/5;background:var(--chip);max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .ini{font-family:var(--f-display);font-weight:800;font-size:46px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.ph .hint{position:absolute;bottom:8px;left:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.35);color:#fff;padding:3px 8px;border-radius:999px}
.badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.name{font-weight:700;font-size:16px;line-height:1.25}
.desc{font-size:13px;color:var(--muted);margin:0}
.ask{font-size:15px;font-weight:700;color:var(--muted);margin-top:auto}
.out{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.card.is-out img{opacity:.55}
.state{padding-block:80px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.state h1{font-size:34px}
a.add{display:grid;place-items:center;text-decoration:none}
.price{font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;margin-top:auto}
.price s{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.add{min-height:44px;border-radius:12px;border:2px solid var(--wa);background:transparent;color:var(--wa);font:700 15px var(--f-body);cursor:pointer}
.qty{display:flex;align-items:center;justify-content:space-between;min-height:44px;border-radius:12px;background:var(--wa);color:var(--wa-ink)}
.qty button{width:44px;height:44px;border:0;background:transparent;color:inherit;font:700 22px var(--f-body);cursor:pointer}
.qty span{font-weight:700;font-variant-numeric:tabular-nums}

.about{margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.box h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 10px}
.hours{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.hours td{padding:5px 0;border-bottom:1px dashed var(--line)}
.hours td:last-child{text-align:right}
.hours tr.today td{font-weight:700;color:var(--indigo)}
.phone{font-family:var(--f-display);font-weight:800;font-size:24px;user-select:all;margin:2px 0 10px}
.credit{text-align:center;color:var(--muted);font-size:14px;margin-top:28px}
.credit b{color:var(--ink)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.bar .wrap{display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;min-width:0}
.bar .sum b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.bar .sum small{color:var(--muted)}
.bar .btn{flex:none}
@media (prefers-reduced-motion:no-preference){.bar{transition:transform .2s ease}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} [hidden]{display:none!important} img{max-width:100%}</style>
</head>
<body>
<div class="stripes" aria-hidden="true"></div>
<div id="root"><div class="wrap state"><p class="desc">Chargement…</p></div></div>

<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div class="sum"><b id="bar-total">0 F</b><small id="bar-count">0 article</small></div>
    <a class="btn btn-wa" id="wa-order" target="_blank" rel="noopener">Envoyer la commande</a>
  </div>
</div>

<script>
/* Vitrine publique : vitrine.html?b=<adresse>. Données lues avec la clé publique (fonction vitrine_publique). */
const SB_URL = 'https://uqnucmgsgkwalxodqmjr.supabase.co';
const SB_KEY = 'sb_publishable_3vrJsQkSN2QlL_MMwBPGgQ_rC-IvhNo';
const WA_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F = n => Number(n).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g, ' ') + ' F';
const photoUrl = p => SB_URL + '/storage/v1/object/public/vitrine/' + p.split('/').map(encodeURIComponent).join('/');
let V = null, cat = 'Tout'; const cart = {};

const slug = (new URLSearchParams(location.search).get('b') || location.hash.slice(1) || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
const waLink = t => 'https://wa.me/' + V.whatsapp + '?text=' + encodeURIComponent(t);

async function load() {
  if (!slug) return state('Page introuvable', 'Le lien est incomplet. Demandez le bon lien à la boutique.');
  try {
    const r = await fetch(SB_URL + '/rest/v1/rpc/vitrine_publique', { method: 'POST',
      headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_slug: slug }) });
    if (!r.ok) throw new Error(r.status);
    V = await r.json();
  } catch (e) { return state('Pas de connexion', 'Vérifiez internet puis rechargez la page.', true); }
  if (V.etat === 'introuvable') return state('Page introuvable', 'Cette boutique n\'existe pas ou a changé d\'adresse.');
  if (V.etat === 'pause') return state(V.nom, 'Cette page est en pause pour le moment.');
  draw();
}
function state(t, m, retry) {
  $('root').innerHTML = `<div class="wrap state"><h1>${esc(t)}</h1><p class="desc">${esc(m)}</p>${retry ? '<button class="btn btn-ghost" onclick="location.reload()">Recharger</button>' : ''}</div>`;
}
function draw() {
  document.title = V.nom;
  const cats = ['Tout', ...new Set(V.produits.map(p => p.cat || 'Autres'))];
  $('root').innerHTML = `
  <header><div class="wrap">
    <h1>${esc(V.nom)}</h1>
    ${V.slogan ? `<p class="tag">${esc(V.slogan)}</p>` : ''}
    ${V.ville ? `<p class="where">${esc(V.ville)}</p>` : ''}
    <div class="actions">
      <a class="btn btn-wa" target="_blank" rel="noopener" href="${esc(waLink('Bonjour ' + V.nom + ', j\'ai vu votre page. '))}">${WA_ICON} Écrire sur WhatsApp</a>
    </div>
  </div></header>
  ${cats.length > 2 ? `<nav class="cats" aria-label="Catégories"><div class="wrap" id="cats"></div></nav>` : ''}
  <main><div class="wrap">
    <div class="grid" id="grid"></div>
    ${V.produits.length ? '' : '<p class="desc" style="text-align:center;padding:40px 0">Les produits arrivent bientôt.</p>'}
    <section class="about">
      ${V.horaires ? `<div class="box"><h2>Horaires</h2><p class="desc" style="font-size:16px;color:var(--ink)">${esc(V.horaires)}</p></div>` : ''}
      <div class="box"><h2>Nous contacter</h2>
        <div class="phone">+${esc(V.whatsapp.replace(/^(\d{3})(\d{2})(\d{2})(\d{2})(\d{2})$/, '$1 $2 $3 $4 $5'))}</div>
        ${V.adresse ? `<p class="desc">${esc(V.adresse)}</p>` : ''}
      </div>
    </section>
    <p class="credit">Page faite avec <b>Bara Vitrine</b></p>
  </div></main>`;
  if ($('cats')) {
    $('cats').innerHTML = cats.map((c, i) => `<button class="chip" data-c="${i}" aria-pressed="${c === cat}">${esc(c)}</button>`).join('');
    $('cats').querySelectorAll('.chip').forEach(b => b.onclick = () => { cat = cats[+b.dataset.c]; draw(); });
  }
  grid(); bar();
}
function grid() {
  $('grid').innerHTML = V.produits.map((p, i) => {
    if (cat !== 'Tout' && (p.cat || 'Autres') !== cat) return '';
    const q = cart[i] || 0;
    const ph = p.photo ? `<img src="${esc(photoUrl(p.photo))}" alt="${esc(p.nom)}" loading="lazy">` : `<span class="ini">${esc(p.nom.split(' ').slice(0, 2).map(w => w[0]).join(''))}</span>`;
    let act;
    if (p.epuise) act = `<div class="ask">Épuisé pour le moment</div>`;
    else if (p.prix == null) act = `<div class="ask">Prix sur demande</div><a class="add" target="_blank" rel="noopener" href="${esc(waLink('Bonjour ' + V.nom + ', quel est le prix de : ' + p.nom + ' ?'))}">Demander le prix</a>`;
    else act = `<div class="price">${F(p.prix)}</div>` + (q
      ? `<div class="qty"><button aria-label="Retirer" data-m="${i}">−</button><span>${q}</span><button aria-label="Ajouter" data-p="${i}">+</button></div>`
      : `<button class="add" data-p="${i}">Ajouter</button>`);
    return `<article class="card${p.epuise ? ' is-out' : ''}"><div class="ph">${ph}${p.epuise ? '<span class="out">Épuisé</span>' : ''}</div>
      <div class="info"><div class="name">${esc(p.nom)}</div>${p.details ? `<p class="desc">${esc(p.details)}</p>` : ''}${act}</div></article>`;
  }).join('');
  $('grid').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const i = +b.dataset.p; cart[i] = (cart[i] || 0) + 1; grid(); bar(); });
  $('grid').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const i = +b.dataset.m; if (!--cart[i]) delete cart[i]; grid(); bar(); });
}
function bar() {
  const ids = Object.keys(cart), n = ids.reduce((s, i) => s + cart[i], 0), t = ids.reduce((s, i) => s + cart[i] * V.produits[i].prix, 0);
  $('bar').hidden = !n; $('bar-total').textContent = F(t); $('bar-count').textContent = n + (n > 1 ? ' articles' : ' article');
  const lines = ids.map(i => `- ${cart[i]} × ${V.produits[i].nom} (${F(V.produits[i].prix * cart[i])})`).join('\n');
  $('wa-order').href = waLink(`Bonjour ${V.nom}, je voudrais commander :\n${lines}\nTotal : ${F(t)}\n\nMa taille / pointure :\nMon nom :\nMon quartier :`);
}
load();
</script>
</body>
</html>
