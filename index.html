// Reçu (dépôt ou avance rendue) : à l'écran, en PDF ou par WhatsApp.
const balLine = b => b > 0 ? `Reste à payer : ${plainMoney(b)} FCFA` : b < 0 ? `Avance disponible : ${plainMoney(-b)} FCFA` : 'Tout est réglé. Merci !';
function receiptText(r) {
  const ref = r.kind === 'refund';
  return [r.shop.name, `Reçu du ${dtFull(r.date)}`, `Client : ${r.customer.name}`,
    ref ? `Avance rendue au client : ${plainMoney(r.amount)} FCFA (${PAY[r.method] || ''})` : `Montant reçu : ${plainMoney(r.amount)} FCFA (${PAY[r.method] || ''})`,
    ...(!ref && r.toDebt && r.toAdv ? [`Dont dette payée : ${plainMoney(r.toDebt)} FCFA, avance : ${plainMoney(r.toAdv)} FCFA`] : []),
    balLine(r.balance), ...(r.shop.footer ? ['', r.shop.footer] : [])].join('\n');
}
function receiptPdf(r) {
  const pdf = newPdf(), L = 40, R = 555, ref = r.kind === 'refund';
  pdf.page();
  pdf.text(L, 62, r.shop.name, { size: 20, bold: true, color: GREEN });
  let y = 80;
  if (r.shop.address) { pdf.text(L, y, r.shop.address, { size: 10, color: GREY }); y += 14; }
  if (r.shop.phone) { pdf.text(L, y, 'Tél. : ' + r.shop.phone, { size: 10, color: GREY }); y += 14; }
  pdf.text(R, 62, 'REÇU', { size: 20, bold: true, align: 'right' });
  pdf.text(R, 80, dtFull(r.date), { size: 10, align: 'right', color: GREY });
  y = Math.max(y, 100) + 4; pdf.line(L, R, y, GREEN, 1.2); y += 26;
  pdf.text(L, y, 'Client : ' + r.customer.name + (r.customer.phone ? '  (' + r.customer.phone + ')' : ''), { size: 11, bold: true }); y += 30;
  pdf.text(L, y, ref ? 'Avance rendue au client' : 'Montant reçu', { size: 12 }); pdf.text(R, y, plainMoney(r.amount) + ' FCFA', { size: 14, bold: true, align: 'right' }); y += 20;
  pdf.text(L, y, 'Paiement : ' + (PAY[r.method] || ''), { size: 10, color: GREY }); y += 20;
  if (!ref && r.toDebt && r.toAdv) {
    pdf.text(L, y, 'Dette payée : ' + plainMoney(r.toDebt) + ' FCFA · Avance : ' + plainMoney(r.toAdv) + ' FCFA', { size: 10 }); y += 20;
  }
  y += 6;
  const owes = r.balance > 0, col = owes ? RED : GREEN;
  pdf.text(L, y, owes ? 'Reste à payer' : r.balance < 0 ? 'Avance disponible' : 'Solde', { size: 12, bold: true, color: col });
  pdf.text(R, y, r.balance ? plainMoney(Math.abs(r.balance)) + ' FCFA' : 'Tout est réglé', { size: 12, bold: true, align: 'right', color: col }); y += 30;
  pdf.text(L, y, (ref ? 'Rendu par : ' : 'Reçu par : ') + (r.who || ''), { size: 10 });
  if (r.shop.footer) pdf.text(pdf.W / 2, 790, r.shop.footer, { size: 10, align: 'center', color: GREY });
  pdf.text(pdf.W / 2, 815, 'Établi avec Bara Gestion', { size: 7.5, align: 'center', color: [0.6, 0.64, 0.61] });
  return pdf.build('Reçu ' + r.customer.name);
}
function receiptSheet(r) {
  const ref = r.kind === 'refund';
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-label="Reçu">
    <h2>${ref ? 'Avance rendue' : 'Dépôt enregistré'}</h2>
    <div class="card" style="display:grid;gap:4px"><div><b>${esc(r.customer.name)}</b></div>
      <div>${ref ? 'Rendu' : 'Reçu'} : <b>${esc(money(r.amount))}</b> (${esc(PAY[r.method] || '')})</div>
      ${!ref && r.toDebt && r.toAdv ? `<div class="muted">Dette payée ${esc(money(r.toDebt))} · avance ${esc(money(r.toAdv))}</div>` : ''}
      <div style="color:${r.balance > 0 ? 'var(--bad)' : r.balance < 0 ? 'var(--accent)' : 'inherit'};font-weight:600">${r.balance > 0 ? 'Reste à payer : ' + esc(money(r.balance)) : r.balance < 0 ? 'Avance disponible : ' + esc(money(-r.balance)) : 'Tout est réglé ✓'}</div></div>
    <div class="row"><button class="btn" id="rc-wa">Envoyer par WhatsApp</button><button class="btn ghost" id="rc-dl">Télécharger le PDF</button></div>
    <button class="btn ghost" id="rc-close">Fermer</button></div></div>`;
  const name = 'Recu-' + r.customer.name.replace(/[^A-Za-z0-9]+/g, '-') + '.pdf';
  $('#rc-close').onclick = () => { closeSheet(); viewStatement(r.customer.id); };
  $('#rc-dl').onclick = () => {
    const url = URL.createObjectURL(new Blob([receiptPdf(r)], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  };
  $('#rc-wa').onclick = async () => {
    try {
      const file = new File([receiptPdf(r)], name, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Reçu' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    window.open('https://wa.me/' + waNumber(r.customer.phone) + '?text=' + encodeURIComponent(receiptText(r)), '_blank', 'noopener');
  };
}

/* ===== Devis =====
   Proposition de prix numérotée (D-0001). Ne touche ni au stock ni à la caisse. Valable 15 jours.
   Transformé en vente (en une ou plusieurs fois) : prix du devis s'il est encore valable. En ligne uniquement. */
const quoteNo = n => 'D-' + String(n).padStart(4, '0');
const dDay = s => { const [y, m, d] = String(s).slice(0, 10).split('-'); return `${d}/${m}/${y}`; };

async function saveQuote(qid) {
  if (S.busy) return;
  if (!S.cart.size) return toast('Ajoutez des produits.', true);
  const sub = cartTotal(), disc = S.disc || 0;
  const dErr = discError(sub, disc); if (dErr) return toast(dErr, true);
  S.busy = true;
  const { data, error } = await sb.rpc('save_quote', { p_shop: S.shop.id,
    p_items: [...S.cart].map(([product_id, quantity]) => ({ product_id, quantity })), p_discount: disc,
    p_customer_id: S.custSel ? S.custSel.id : null, p_quote: qid });
  S.busy = false;
  if (error) return toast(cleanErr(error), true);
  resetSale(); S.editQuote = null; S.quotes = null;
  if (S.tab === 'sale') viewSale();
  toast(`Devis ${quoteNo(data.quote_no)} enregistré : ${money(data.total)}.`);
  quoteSheet(data.id);
}

async function viewQuotes() {
  $('#view').innerHTML = '<p class="empty">Chargement…</p>';
  if (!S.quotes) {
    const { data, error } = await sb.rpc('quote_list', { p_shop: S.shop.id });
    if (error) { $('#view').innerHTML = ''; return toast(cleanErr(error), true); }
    S.quotes = data || [];
  }
  const tag = q => q.status === 'converted' ? '<span class="tag">Livré</span>' : q.status === 'cancelled' ? '<span class="tag bad">Annulé</span>'
    : q.expired ? '<span class="tag warn">Expiré</span>' : q.partial ? '<span class="tag warn">En partie livré</span>' : '<span class="tag">Valable</span>';
  $('#view').innerHTML = `${histSeg()}<section class="stack">
    <p class="muted" style="margin:0;font-size:13.5px">Pour faire un devis : remplissez le panier dans « Vendre », puis « Faire un devis ».</p>
    ${S.quotes.map(q => `<button class="prod" data-q="${esc(q.id)}" style="${q.status !== 'open' ? 'opacity:.65' : ''}">
      <span><span class="nm">${esc(quoteNo(q.quote_no))} · ${esc(q.customer_name || 'sans client')}</span><br>
      <span class="sub">${q.status === 'open' ? 'jusqu\'au ' + dDay(q.valid_until) : dt(q.created_at)} ${tag(q)}</span></span>
      <span class="pr">${money(q.total)}</span></button>`).join('') || '<p class="empty">Aucun devis pour le moment.</p>'}</section>`;
  bindHistSeg();
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => quoteSheet(b.dataset.q));
}

function histSeg() {
  return `<div class="seg" style="margin-bottom:10px"><button class="btn small ${S.histMode === 'quotes' ? 'ghost' : ''}" id="hs-s">Ventes</button>
    <button class="btn small ${S.histMode === 'quotes' ? '' : 'ghost'}" id="hs-q">Devis</button></div>`;
}
function bindHistSeg() {
  const a = $('#hs-s'), b = $('#hs-q');
  if (a) a.onclick = () => { S.histMode = 'sales'; viewHistory(); };
  if (b) b.onclick = () => { S.histMode = 'quotes'; viewQuotes(); };
}

async function quoteSheet(id) {
  const { data: g, error } = await sb.rpc('quote_get', { p_quote: id });
  if (error) return toast(cleanErr(error), true);
  const q = g.quote, open = q.status === 'open', partial = g.lines.some(l => Number(l.qty_taken) > 0);
  const mine = q.created_by === S.user.id || isManager();
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-label="Devis">
    <h2>Devis ${esc(quoteNo(q.quote_no))}</h2>
    ${open && q.expired ? '<div class="banner">Devis expiré : à la vente, les prix du jour seront appliqués.</div>' : ''}
    ${q.status === 'cancelled' ? '<div class="banner bad">Devis annulé.</div>' : q.status === 'converted' ? '<div class="banner ok">Devis entièrement livré.</div>' : ''}
    <div class="card" style="display:grid;gap:4px">
      <div class="muted">${esc(dtFull(q.created_at))}${open ? ' · valable jusqu\'au <b>' + dDay(q.valid_until) + '</b>' : ''}</div>
      ${q.customer_name ? `<div>Client : <b>${esc(q.customer_name)}</b>${q.phone ? ' <span class="muted">' + esc(q.phone) + '</span>' : ''}</div>` : ''}
      <ul style="margin:6px 0 0;padding-left:18px">${g.lines.map(l => `<li>${esc(plainQty(l.quantity))} ${esc(UNITS[l.unit] || '')} ${esc(l.name)} · ${esc(money(l.line_total))}
        ${Number(l.qty_taken) > 0 ? `<span class="muted"> (déjà livré ${esc(plainQty(l.qty_taken))})</span>` : ''}
        ${open && !q.expired && Number(l.current_price) !== Number(l.unit_price) ? `<span class="muted"> · prix du jour ${esc(money(l.current_price))}</span>` : ''}</li>`).join('')}</ul>
      ${q.discount > 0 ? `<div class="muted">Remise : − ${esc(money(q.discount))}</div>` : ''}
      <div class="total" style="margin-top:6px"><span>Total</span><span class="num">${esc(money(q.total))}</span></div>
      ${g.sales.length ? `<div class="muted" style="font-size:13px">Ventes : ${g.sales.map(x => esc(invNo(x.invoice_no))).join(', ')}</div>` : ''}
    </div>
    <div class="row"><button class="btn ghost" id="qt-wa">Envoyer par WhatsApp</button><button class="btn ghost" id="qt-dl">PDF</button></div>
    ${open ? `<button class="btn" id="qt-sell" ${canWrite() ? '' : 'disabled'}>Transformer en vente</button>` : ''}
    ${open && mine ? `<div class="row">${partial ? '' : `<button class="btn ghost small" id="qt-edit" ${canWrite() ? '' : 'disabled'}>Modifier</button>`}
      <button class="btn ghost small" id="qt-cancel" ${canWrite() ? '' : 'disabled'}>Annuler le devis</button></div>` : ''}
    <button class="btn ghost" id="qt-close">Fermer</button></div></div>`;
  const doc = quoteDoc(g);
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#qt-close').onclick = closeSheet;
  $('#qt-dl').onclick = () => downloadInvoice(doc);
  $('#qt-wa').onclick = () => shareInvoice(doc, q.phone);
  const se = $('#qt-sell'); if (se) se.onclick = () => convertSheet(g);
  const ed = $('#qt-edit'); if (ed) ed.onclick = async () => {
    const missing = g.lines.filter(l => !l.active || !S.products.find(p => p.id === l.product_id));
    if (missing.length) return toast('Produit retiré : ' + missing.map(l => l.name).join(', ') + '. Faites un nouveau devis.', true);
    S.cart = new Map(g.lines.map(l => [l.product_id, Number(l.quantity)]));
    S.disc = q.discount || 0;
    S.custSel = null;
    if (q.customer_id) { const c = (await loadCustomers()).find(x => x.id === q.customer_id); if (c) S.custSel = { id: c.id, name: c.name, phone: c.phone, balance: c.balance }; }
    S.editQuote = { id: q.id, no: q.quote_no }; S.payOpen = true;
    closeSheet(); S.tab = 'sale'; draw();
    toast(q.expired ? 'Devis expiré : les prix du jour seront repris et il sera valable 15 jours de plus.' : 'Les prix du devis sont gardés. Modifiez puis enregistrez.');
  };
  const ca = $('#qt-cancel'); if (ca) ca.onclick = async () => {
    if (!ca.dataset.sure) { ca.dataset.sure = '1'; ca.textContent = 'Confirmer l\'annulation'; return; }
    const { error: e2 } = await sb.rpc('cancel_quote', { p_quote: q.id });
    if (e2) return toast(cleanErr(e2), true);
    closeSheet(); toast('Devis annulé.'); S.quotes = null; if (S.tab === 'history') viewQuotes();
  };
}

// Document du devis : même mise en page que la facture.
function quoteDoc(g) {
  const q = g.quote;
  return { kind: 'quote', shop: { name: S.shop.name, phone: S.shop.phone || '', address: S.shop.address || '', footer: S.shop.footer || '' },
    num: quoteNo(q.quote_no), date: q.created_at, valid: q.valid_until, customer: q.customer_name || '', seller: '', pay: '', ref2: '',
    lines: g.lines.map(l => ({ name: l.name, unit: UNITS[l.unit] || '', qty: l.quantity, price: l.unit_price, total: l.line_total })),
    total: q.total, paid: q.total, discount: q.discount || 0, advance: 0 };
}

// Transformer en vente : tout ce qui reste, ou une partie (livraison en plusieurs fois).
async function convertSheet(g) {
  const q = g.quote, ref = uuid();
  const rest = g.lines.filter(l => Number(l.quantity) > Number(l.qty_taken));
  let cust = null;
  if (q.customer_id) cust = (await loadCustomers(true)).find(x => x.id === q.customer_id) || null;
  const adv = advOf(cust);
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="Transformer en vente">
    <h2>Vente du devis ${esc(quoteNo(q.quote_no))}</h2>
    <p class="muted" style="margin:0;font-size:13.5px">${q.expired ? 'Devis expiré : prix du jour.' : 'Prix du devis.'} Le client peut prendre une partie maintenant et le reste plus tard.</p>
    ${rest.map(l => { const tp = S.products.find(p => p.id === l.product_id && isTracked(p));
      // Appareil à numéro : on coche (ou on scanne) les boîtes remises au client.
      if (tp) return `<fieldset style="border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;min-width:0"><legend style="font-weight:600;padding:0 4px">${esc(l.name)} (reste ${esc(plainQty(Number(l.quantity) - Number(l.qty_taken)))})</legend>
        <input type="hidden" data-cq="${esc(l.product_id)}" data-max="${esc(Number(l.quantity) - Number(l.qty_taken))}" value="0">
        ${unitsOf(tp.id).map(u => `<label style="display:flex;align-items:center;gap:10px;font-size:14px"><input type="checkbox" data-cu="${esc(tp.id)}" value="${esc(u.serial)}" style="width:22px;height:22px;margin:0;flex:0 0 auto">
          <span>${esc(u.color || 'Couleur ?')} · <span class="muted">${esc(codeName(tp.track_kind))} ${esc(shortCode(u.serial))}</span></span></label>`).join('') || '<span class="muted">Aucun appareil en stock.</span>'}
        ${canScan() && unitsOf(tp.id).length ? `<button class="btn ghost small" type="button" data-cus="${esc(tp.id)}">📷 Scanner les boîtes</button>` : ''}</fieldset>`;
      return `<label>${esc(l.name)} (reste ${esc(plainQty(Number(l.quantity) - Number(l.qty_taken)))} ${esc(UNITS[l.unit] || '')})
      <input type="number" inputmode="decimal" min="0" step="${WHOLE.includes(l.unit) ? 1 : 0.001}" max="${esc(Number(l.quantity) - Number(l.qty_taken))}"
        value="${esc(Number(l.quantity) - Number(l.qty_taken))}" data-cq="${esc(l.product_id)}"></label>`; }).join('')}
    <div class="total"><span>Total estimé</span><span class="num" id="cq-total"></span></div>
    ${adv ? `<label style="display:flex;align-items:center;gap:10px;font-size:14.5px"><input id="cq-adv" type="checkbox" checked style="width:22px;height:22px;margin:0">
      Prendre sur l'avance de ${esc(cust.name)} (${money(adv)})</label>` : ''}
    <div class="row"><label>Montant encaissé (FCFA)<input id="cq-paid" type="number" inputmode="numeric" min="0" step="1"></label>
      <label>Paiement<select id="cq-pay">${Object.entries(PAY).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label></div>
    <div class="row"><button class="btn" type="submit">Valider la vente</button><button class="btn ghost" type="button" id="cancel">Retour</button></div></form></div>`;
  const price = l => q.expired ? Number((S.products.find(p => p.id === l.product_id) || {}).sell_price || l.current_price) : Number(l.unit_price);
  const serialsOf = pid => [...document.querySelectorAll(`[data-cu="${pid}"]:checked`)].map(c => c.value);
  const pick = () => [...document.querySelectorAll('[data-cq]')].map(i => i.type === 'hidden'
    ? { product_id: i.dataset.cq, quantity: serialsOf(i.dataset.cq).length, serials: serialsOf(i.dataset.cq) }
    : { product_id: i.dataset.cq, quantity: Number(i.value) || 0 }).filter(x => x.quantity > 0);
  const est = () => {
    const items = pick(), all = items.length === rest.length && items.every(x => { const l = rest.find(r => r.product_id === x.product_id); return x.quantity >= Number(l.quantity) - Number(l.qty_taken); });
    let sub = 0, part = 0;
    items.forEach(x => { const l = g.lines.find(r => r.product_id === x.product_id); sub += Math.round(x.quantity * price(l)); part += Math.round(x.quantity * Number(l.unit_price)); });
    const used = q.discount_used || 0, subQ = q.subtotal || 0;
    const d = all ? q.discount - used : (subQ ? Math.min(Math.floor(q.discount * part / subQ), q.discount - used) : 0);
    return Math.max(0, sub - d);
  };
  const upd = () => {
    const t = est(); $('#cq-total').textContent = money(t);
    const useAdv = $('#cq-adv') && $('#cq-adv').checked;
    $('#cq-paid').value = useAdv ? Math.max(0, t - adv) : t;
  };
  upd();
  document.querySelectorAll('[data-cq]').forEach(i => i.oninput = upd);
  document.querySelectorAll('[data-cu]').forEach(c => c.onchange = () => {
    const h = document.querySelector(`[data-cq="${c.dataset.cu}"]`);
    if (serialsOf(c.dataset.cu).length > Number(h.dataset.max)) { c.checked = false; toast('Le devis n\'en prévoit pas plus.', true); }
    h.value = serialsOf(c.dataset.cu).length; upd(); });
  document.querySelectorAll('[data-cus]').forEach(b => b.onclick = () => openScanner('Scanner les boîtes', code => {
    const u = unitByCode(normCode(code)), c = u && document.querySelector(`[data-cu="${b.dataset.cus}"][value="${u.serial}"]`);
    if (!c) { toast('Cet appareil n\'est pas un ' + (S.products.find(p => p.id === b.dataset.cus) || {}).name + ' en stock.', true); return true; }
    if (!c.checked) { c.checked = true; c.onchange(); }
    return true; }, { pick: cs => cs.find(c => unitByCode(normCode(c))) || devPick(cs), hint: DEV_HINT, zoom: true }));
  const ca = $('#cq-adv'); if (ca) ca.onchange = upd;
  $('#cancel').onclick = () => quoteSheet(q.id);
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const items = pick();
    if (!items.length) return toast('Choisissez au moins une quantité.', true);
    const t = est(), paid = Math.round(Number($('#cq-paid').value));
    if (!(paid >= 0)) return toast('Montant invalide.', true);
    if (paid < t && !canCredit() && t - paid > adv) return toast(adv ? `Avance insuffisante : il manque ${money(t - paid - adv)}.` : 'Vente à crédit non autorisée pour vous.', true);
    const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
    const all = items.length === rest.length && items.every(x => { const l = rest.find(r => r.product_id === x.product_id); return x.quantity >= Number(l.quantity) - Number(l.qty_taken); });
    const { data, error } = await sb.rpc('convert_quote', { p_quote: q.id, p_items: all && !items.some(x => x.serials) ? null : items,
      p_paid: paid >= t ? null : paid, p_payment_method: $('#cq-pay').value, p_client_ref: ref });
    if (error) { btn.disabled = false; return toast(cleanErr(error), true); }
    S.quotes = null; S.sales = null; S.summary = null; S.customers = null;
    await loadProducts();
    toast(`Vente enregistrée : ${money(data.total)}${data.advance_used ? ` (dont ${money(data.advance_used)} pris sur l'avance)` : ''}.`);
    openInvoice(data.sale_id);
  };
}

/* ===== Onglet Historique ===== */
const SALE_COLS = 'id,invoice_no,discount,advance_used,quote_id,offline,offline_ref,client_created_at,created_at,created_by,total,paid,status,customer_name,payment_method,cancel_reason,sale_items(product_id,quantity,unit_price,line_total,products(name,unit,track_kind))';
async function viewHistory() {
  if (S.histMode === 'quotes' && !S.offline) return viewQuotes();
  $('#view').innerHTML = '<p class="empty">Chargement…</p>';
  if (!S.sales) {
    const { data, error } = await sb.from('sales')
      .select(SALE_COLS)
      .eq('shop_id', S.shop.id).order('created_at', { ascending: false }).limit(50);
    if (error) { $('#view').innerHTML = ''; return toast(cleanErr(error), true); }
    S.sales = data || [];
  }
  await ensureNames();   // propriétaire / gérant : noms des vendeurs (la base ne les leur donne qu'à eux)
  const waiting = myQueue();
  // Ventes rangées par jour, avec le total du jour.
  const dayKey = x => new Date(x.created_at).toDateString();
  const today = new Date().toDateString(), yest = new Date(Date.now() - 86400000).toDateString();
  const days = [];
  S.sales.forEach(x => { const k = dayKey(x); let d = days.find(y => y.k === k); if (!d) days.push(d = { k, at: x.created_at, list: [] }); d.list.push(x); });
  const dayName = d => d.k === today ? 'Aujourd\'hui' : d.k === yest ? 'Hier' : new Date(d.at).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const what = x => { const it = x.sale_items || [], n = it.map(i => i.products?.name || '').filter(Boolean);
    return n.length > 2 ? `${n.slice(0, 2).join(', ')} +${n.length - 2}` : n.join(', '); };
  const row = x => { const cancelled = x.status === 'cancelled', rest = x.total - x.paid - (x.advance_used || 0);
    const ic = cancelled ? '↩️' : rest > 0 ? '📒' : x.payment_method === 'mobile_money' ? '📱' : '💵';
    return `<button class="prow" data-sale="${esc(x.id)}" style="${cancelled ? 'opacity:.55' : ''}">
      <span style="font-size:24px;flex:0 0 auto" aria-hidden="true">${ic}</span>
      <span style="min-width:0;flex:1 1 auto"><span class="nm" style="font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.customer_name || what(x) || 'Vente')}</span>
        <span class="sub">${new Date(x.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}${x.offline ? ' · hors ligne' : ''}${cancelled ? ' · <b style="color:var(--bad)">annulée</b>' : rest > 0 ? ` · <b style="color:var(--bad)">reste ${esc(fmtNum.format(rest))}</b>` : ''}</span></span>
      <b class="num" style="flex:0 0 auto;font:800 17px var(--f-display);${cancelled ? 'text-decoration:line-through' : ''}">${esc(money(x.total))}</b></button>`; };
  $('#view').innerHTML = `${waiting.length ? `<section class="card stack"><h2>⏳ En attente d'envoi (${waiting.length})</h2>
      ${waiting.map(r => `<div class="row" style="align-items:baseline"><b class="num">${money(r.total)}</b><span class="muted" style="text-align:right">${dt(r.created_at)}</span></div>${r.error ? `<div class="muted" style="color:var(--bad)">${esc(r.error)}</div>` : ''}`).join('')}
      <button class="btn ghost small" id="sync-now">Envoyer maintenant</button></section>` : ''}
    ${S.offline ? '' : histSeg()}
    ${days.map(d => `<section class="stack" style="gap:8px"><div class="row" style="align-items:baseline;flex-wrap:nowrap"><h3 style="margin:0;flex:1 1 auto;text-transform:capitalize">${esc(dayName(d))}</h3>
      <span class="muted num" style="flex:0 0 auto">${esc(money(d.list.filter(x => x.status !== 'cancelled').reduce((a, x) => a + x.total, 0)))}</span></div>
      ${d.list.map(row).join('')}</section>`).join('') || '<p class="empty">Aucune vente pour le moment.</p>'}
    <p class="muted" style="text-align:center;font-size:12.5px">Touchez une vente pour voir le détail, la facture ou l'annuler.</p>`;
  bindHistSeg();
  const sn = $('#sync-now'); if (sn) sn.onclick = async () => { await syncQueue(true); S.sales = null; viewHistory(); };
  document.querySelectorAll('[data-sale]').forEach(b => b.onclick = () => openInvoice(S.sales.find(x => x.id === b.dataset.sale), { fromHistory: true }));
}

function cancelDialog(id) {
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="Annuler la vente">
    <h2>Annuler la vente</h2><p class="muted">Le stock est remis. La vente reste visible dans l'historique.</p>

   Les comptes sont créés par la fonction sécurisée « manage-team » : la clé secrète
   de Supabase ne quitte jamais le serveur. */
async function callTeam(body) {
  const { data, error } = await sb.functions.invoke('manage-team', { body: { shop_id: S.shop.id, ...body } });
  if (error) {
    let msg = cleanErr(error);
    try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (e) {}
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

function randomPassword() {
  const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // sans caractères ambigus (0/O, 1/l/I)
  const a = new Uint32Array(10); crypto.getRandomValues(a);
  return [...a].map(n => chars[n % chars.length]).join('');
}

const CP1252 = { 0x20AC:0x80, 0x201A:0x82, 0x0192:0x83, 0x201E:0x84, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x02C6:0x88,

function pdfBytes(str) {
  const out = [];
  for (const ch of String(str ?? '').normalize('NFC').replace(/[   ]/g, ' ')) {
    const c = ch.codePointAt(0);
    if (c === 9 || c === 10 || c === 13) out.push(32);
    else if (c >= 32 && c <= 126) out.push(c);
    else if (c >= 160 && c <= 255) out.push(c);
    else if (CP1252[c]) out.push(CP1252[c]);
    else out.push(63);                      // caractère non géré : « ? »
  }
  return out;
}
function pdfStr(bytes) {
  return bytes.map(b => (b === 40 || b === 41 || b === 92) ? '\\' + String.fromCharCode(b) : String.fromCharCode(b)).join('');
}
function pdfWidth(str, bold, size) {
  let w = 0; const t = bold ? HW.b : HW.r;
  for (const b of pdfBytes(str)) w += t[b - 32] || 0;
  return w * size / 1000;
}
function pdfWrap(str, bold, size, maxW) {
  const lines = []; let cur = '';
  for (let w of String(str ?? '').split(/\s+/).filter(Boolean)) {
    while (pdfWidth(w, bold, size) > maxW && w.length > 1) {          // mot plus long que la ligne : on le coupe
      let i = w.length - 1;
      while (i > 1 && pdfWidth(w.slice(0, i), bold, size) > maxW) i--;
      if (cur) { lines.push(cur); cur = ''; }
      lines.push(w.slice(0, i)); w = w.slice(i);
    }
    const t = cur ? cur + ' ' + w : w;
    if (pdfWidth(t, bold, size) <= maxW) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

function newPdf() {
  const W = 595, H = 842, pages = [];
  let ops = null;
  const f2 = n => String(Math.round(n * 100) / 100);
  return {
    W, H,
    page() { ops = []; pages.push(ops); },
    text(x, top, s, o = {}) {
      const size = o.size || 10, bold = !!o.bold, color = o.color || [0.1, 0.13, 0.11];
      const w = pdfWidth(s, bold, size);
      const xx = o.align === 'right' ? x - w : o.align === 'center' ? x - w / 2 : x;
      ops.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${color.map(f2).join(' ')} rg ${f2(xx)} ${f2(H - top)} Td (${pdfStr(pdfBytes(s))}) Tj ET`);
    },
    rect(x, top, w, h, color) { ops.push(`${color.map(f2).join(' ')} rg ${f2(x)} ${f2(H - top - h)} ${f2(w)} ${f2(h)} re f`); },
    line(x1, x2, top, color, lw) { ops.push(`${lw || 0.7} w ${(color || [0.8, 0.82, 0.8]).map(f2).join(' ')} RG ${f2(x1)} ${f2(H - top)} m ${f2(x2)} ${f2(H - top)} l S`); },
    build(title) {
      const objs = [];
      objs[0] = '<< /Type /Catalog /Pages 2 0 R >>';
      objs[1] = `<< /Type /Pages /Kids [${pages.map((_, i) => `${5 + i * 2} 0 R`).join(' ')}] /Count ${pages.length} >>`;
      objs[2] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      pages.forEach((p, i) => {
        const content = p.join('\n');
        objs[4 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >>`;
        objs[5 + i * 2] = `<< /Length ${content.length} >>\nstream\n${content}\nendstream`;
      });
      const infoNo = objs.length + 1;
      objs.push(`<< /Title (${pdfStr(pdfBytes(title))}) /Producer (Bara Gestion) >>`);
      let out = '%PDF-1.4\n%' + String.fromCharCode(226, 227, 207, 211) + '\n';
      const offs = [];
      objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
      const xref = out.length;
      out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
      out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R /Info ${infoNo} 0 R >>\nstartxref\n${xref}\n%%EOF`;
      const bytes = new Uint8Array(out.length);
      for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
      return bytes;
    }
  };
}

/* ===== Factures ===== */
const plainMoney = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');   // espace ordinaire : lisible partout
const plainQty = n => String(Number(n)).replace('.', ',');
const p2 = n => String(n).padStart(2, '0');
const dtFull = s => { const d = new Date(s); return `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const invNo = n => 'F-' + String(n).padStart(4, '0');
const GREEN = [0.12, 0.42, 0.29], GREY = [0.36, 0.4, 0.37], RED = [0.66, 0.2, 0.12];

// Une ligne par appareil vendu : « IMEI 3512… · Noir · garantie jusqu'au 20/04/2027 ».
const unitLine = u => [`${u.kind === 'serial' ? 'N° de série' : 'IMEI'} ${u.serial}`, u.color || '',
  u.until ? 'garantie jusqu\'au ' + dDay(u.until) : u.months ? `garantie ${u.months} mois` : 'sans garantie'].filter(Boolean).join(' · ');
const hasUnits = inv => inv.lines.some(l => l.units && l.units.length);

function invoicePdf(inv) {
  const pdf = newPdf(), L = 40, R = 555, X_QTY = 372, X_PU = 462, X_AMT = R - 6;
  let top;
  const header = (first) => {
    pdf.page();
    if (first) {
      pdf.text(L, 62, inv.shop.name, { size: 20, bold: true, color: GREEN });
      let y = 80;
      if (inv.shop.address) { pdf.text(L, y, inv.shop.address, { size: 10, color: GREY }); y += 14; }
      if (inv.shop.phone) { pdf.text(L, y, 'Tél. : ' + inv.shop.phone, { size: 10, color: GREY }); y += 14; }
      pdf.text(R, 62, inv.kind === 'quote' ? 'DEVIS' : 'FACTURE', { size: 20, bold: true, align: 'right' });
      pdf.text(R, 80, 'N° ' + inv.num, { size: 11, bold: true, align: 'right' });
      pdf.text(R, 94, dtFull(inv.date), { size: 10, align: 'right', color: GREY });
      if (inv.ref2) pdf.text(R, 108, 'Réf. hors ligne : ' + inv.ref2, { size: 9, align: 'right', color: GREY });
      const ly = Math.max(y, 108) + 4;
      pdf.line(L, R, ly, GREEN, 1.2);
      let iy = ly + 22;
      if (inv.seller) { pdf.text(L, iy, 'Vendeur : ' + inv.seller, { size: 10 }); iy += 15; }
      if (inv.customer) { pdf.text(L, iy, 'Client : ' + inv.customer, { size: 10, bold: true }); iy += 15; }
      if (inv.kind === 'quote') pdf.text(L, iy, 'Valable jusqu\'au ' + dDay(inv.valid) + ' (prix garantis jusqu\'à cette date)', { size: 10, bold: true });
      else pdf.text(L, iy, 'Paiement : ' + inv.pay, { size: 10 });
      top = iy + 26;
    } else {
      pdf.text(L, 50, inv.shop.name + (inv.kind === 'quote' ? ' : devis ' : ' : facture ') + inv.num + ' (suite)', { size: 10, bold: true, color: GREY });
      top = 80;
    }
    pdf.rect(L, top, R - L, 22, [0.92, 0.95, 0.93]);
    pdf.text(L + 8, top + 15, 'Désignation', { size: 9.5, bold: true });
    pdf.text(X_QTY, top + 15, 'Quantité', { size: 9.5, bold: true, align: 'right' });
    pdf.text(X_PU, top + 15, 'Prix unitaire', { size: 9.5, bold: true, align: 'right' });
    pdf.text(X_AMT, top + 15, 'Montant', { size: 9.5, bold: true, align: 'right' });
    top += 22;
  };
  header(true);
  for (const l of inv.lines) {
    const wrapped = pdfWrap(l.name, false, 10, X_QTY - L - 8 - 70);
    const sub = (l.units || []).flatMap(u => pdfWrap(unitLine(u), false, 8.5, R - L - 20));
    const h = wrapped.length * 13 + sub.length * 11 + 9;
    if (top + h > 740) header(false);
    wrapped.forEach((t, i) => pdf.text(L + 8, top + 15 + i * 13, t, { size: 10 }));
    sub.forEach((t, i) => pdf.text(L + 14, top + 15 + wrapped.length * 13 + i * 11, t, { size: 8.5, color: GREY }));
    pdf.text(X_QTY, top + 15, plainQty(l.qty) + (l.unit ? ' ' + l.unit : ''), { size: 10, align: 'right' });
    pdf.text(X_PU, top + 15, plainMoney(l.price), { size: 10, align: 'right' });
    pdf.text(X_AMT, top + 15, plainMoney(l.total), { size: 10, align: 'right' });
    top += h;
    pdf.line(L, R, top, [0.86, 0.88, 0.86], 0.6);
  }
  if (top > 660) { header(false); }
  top += 24;
  const credit = inv.paid + (inv.advance || 0) < inv.total;
  if (inv.discount > 0) {
    pdf.text(X_QTY - 20, top, 'Sous-total', { size: 10.5 });
    pdf.text(X_AMT, top, plainMoney(inv.total + inv.discount) + ' FCFA', { size: 10.5, align: 'right' });
    top += 17;
    pdf.text(X_QTY - 20, top, 'Remise', { size: 10.5 });
    pdf.text(X_AMT, top, '- ' + plainMoney(inv.discount) + ' FCFA', { size: 10.5, align: 'right' });
    top += 21;
  }
  pdf.text(X_QTY - 20, top, 'TOTAL', { size: 13, bold: true });
  pdf.text(X_AMT, top, plainMoney(inv.total) + ' FCFA', { size: 13, bold: true, align: 'right' });
  top += 20;
  if (inv.kind === 'quote') {
    pdf.text(L, top + 10, 'Ce devis n\'est pas une facture. Le stock n\'est pas réservé.', { size: 9.5, color: GREY });
  } else {
    pdf.text(X_QTY - 20, top, 'Payé', { size: 10.5 });
    pdf.text(X_AMT, top, plainMoney(inv.paid) + ' FCFA', { size: 10.5, align: 'right' });
    if (inv.advance > 0) {
      top += 17;
      pdf.text(X_QTY - 20, top, 'Pris sur l\'avance', { size: 10.5 });
      pdf.text(X_AMT, top, plainMoney(inv.advance) + ' FCFA', { size: 10.5, align: 'right' });
    }
    if (credit) {
      top += 18;
      pdf.text(X_QTY - 20, top, 'Reste à payer', { size: 11, bold: true, color: RED });
      pdf.text(X_AMT, top, plainMoney(inv.total - inv.paid - (inv.advance || 0)) + ' FCFA', { size: 11, bold: true, align: 'right', color: RED });
    }
  }
  if (inv.kind !== 'quote' && hasUnits(inv)) {
    pdf.text(L, 768, 'Gardez cette facture : elle prouve votre achat (garantie, vol). Activez « Localiser mon appareil » sur votre téléphone.', { size: 8.5, color: GREY });
  }
  if (inv.shop.footer) pdf.text(pdf.W / 2, 790, inv.shop.footer, { size: 10, align: 'center', color: GREY });
  pdf.text(pdf.W / 2, 815, 'Établi avec Bara Gestion', { size: 7.5, align: 'center', color: [0.6, 0.64, 0.61] });
  return pdf.build((inv.kind === 'quote' ? 'Devis ' : 'Facture ') + inv.num);
}

function invoiceText(inv) {
  const rows = inv.lines.flatMap(l => [`- ${plainQty(l.qty)}${l.unit ? ' ' + l.unit : ''} ${l.name} : ${plainMoney(l.total)} FCFA`,
    ...(l.units || []).map(u => `   ${unitLine(u)}`)]);
  const q = inv.kind === 'quote', rest = inv.total - inv.paid - (inv.advance || 0);
  return [`${inv.shop.name}`, `${q ? 'Devis' : 'Facture'} ${inv.num} du ${dtFull(inv.date)}`, ...(inv.ref2 ? [`Réf. hors ligne : ${inv.ref2}`] : []), ...rows, ...(inv.discount > 0 ? [`Remise : -${plainMoney(inv.discount)} FCFA`] : []), `Total : ${plainMoney(inv.total)} FCFA`,
    ...(q ? [`Valable jusqu'au ${dDay(inv.valid)}`] : []),
    ...(!q && inv.advance > 0 ? [`Pris sur l'avance : ${plainMoney(inv.advance)} FCFA`] : []),
    ...(!q && rest > 0 ? [`Reste à payer : ${plainMoney(rest)} FCFA`] : []),
    ...(!q && hasUnits(inv) ? ['', 'Gardez cette facture : elle prouve votre achat (garantie, vol).'] : []),
    ...(inv.shop.footer ? ['', inv.shop.footer] : [])].join('\n');
}

/* ===== Scan par la caméra =====
   Utilise le lecteur de codes intégré au navigateur (Chrome sur Android) : rien n'est envoyé sur
   internet, les images restent dans le téléphone, et le scan marche aussi hors ligne.
   La caméra est coupée dès la fermeture du scanner. */
const SCAN_FORMATS = ['code_128', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_39', 'itf', 'qr_code'];
// Le lecteur intégré au navigateur (Chrome Android) s'il existe, sinon le lecteur de secours de l'application.
const canScan = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
let SCAN = null;

function stopScan() {
  if (!SCAN) return;
  SCAN.stopped = true;
  clearTimeout(SCAN.timer);
  try { SCAN.stream && SCAN.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  const h = document.getElementById('scan-host'); if (h) h.remove();
  SCAN = null;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') stopScan(); });

// onCode(code) renvoie true pour continuer à scanner (mode caisse), false pour fermer.
// opts.pick(codes) : parmi les codes vus en même temps (une boîte de téléphone en a plusieurs :
// code du modèle, IMEI 1, IMEI 2, numéro de série), choisit le bon, ou null pour continuer à chercher.
async function openScanner(title, onCode, opts = {}) {
  if (!canScan()) {
    return toast('Le scan par la caméra n\'est pas disponible sur ce navigateur. Tapez le code.', true);
  }
  stopScan();
  const host = document.createElement('div');
  host.id = 'scan-host';
  host.innerHTML = `<div class="sheet-bg" style="z-index:60"><div class="sheet" role="dialog" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2>
    <div style="position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3">
      <video id="scan-v" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover"></video>
      <div style="position:absolute;left:8%;right:8%;top:38%;height:24%;border:2px solid #6fcf97;border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.25)"></div>
    </div>
    <p class="muted" id="scan-msg" style="margin:0;text-align:center">${esc(opts.hint || 'Placez le code-barres dans le cadre.')}</p>
    <p class="muted" style="margin:0;text-align:center;font-size:12.5px">Code bien droit dans le cadre vert. Image floue ? Touchez l'image, ou reculez un peu et touchez « Zoom ».</p>
    <div class="row"><button class="btn ghost" type="button" id="scan-zoom" hidden>🔍 Zoom</button><button class="btn ghost" type="button" id="scan-light" hidden>🔦 Lumière</button></div>
    ${opts.panel || ''}
    <button class="btn ghost" type="button" id="scan-x">Terminer</button></div></div>`;
  document.body.appendChild(host);
  $('#scan-x').onclick = () => { stopScan(); if (opts.onClose) opts.onClose(); };
  if (opts.onReady) opts.onReady(host);
  const me = SCAN = { stopped: false, last: '', lastAt: 0 };
  try {
    // Lecteur intégré (s'il existe) ; le lecteur de secours de l'application tourne de toute façon.
    if ('BarcodeDetector' in window) {
      try { const supported = await BarcodeDetector.getSupportedFormats();
        const formats = SCAN_FORMATS.filter(f => supported.includes(f));
        if (formats.length) me.det = new BarcodeDetector({ formats }); } catch (e0) {}
    }
    // Image nette et grande : les codes IMEI sont longs et fins (mauvaise lecture en petite image).
    try {
      me.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'environment',
        width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: 'continuous' }] } });
    } catch (e1) {
      if (e1 && e1.name === 'NotAllowedError') throw e1;
      me.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    }
    if (me.stopped) { me.stream.getTracks().forEach(t => t.stop()); return; }
    const v = $('#scan-v'); v.srcObject = me.stream; await v.play().catch(() => {});
    // Lampe du téléphone (si elle existe) : utile dans une boutique sombre.
    try {
      const tr = me.stream.getVideoTracks()[0], cap = tr.getCapabilities ? tr.getCapabilities() : {};
      // Mise au point continue, et zoom : un petit code (IMEI) se lit mieux de 20 cm avec le zoom que de
      // trop près (l'image devient floue, le téléphone n'arrive pas à faire la mise au point).
      try { if ((cap.focusMode || []).includes('continuous')) await tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e4) {}
      if (cap.zoom && cap.zoom.max > 1) {
        const zb = $('#scan-zoom'), steps = [...new Set([1, 2, 3].map(z => Math.min(z, cap.zoom.max)))];
        let zi = opts.zoom ? Math.min(1, steps.length - 1) : 0;
        const setZ = async () => { try { await tr.applyConstraints({ advanced: [{ zoom: Math.max(cap.zoom.min || 1, steps[zi]) }] }); } catch (e5) {}
          zb.textContent = '🔍 Zoom ×' + steps[(zi + 1) % steps.length]; };
        zb.hidden = false; zb.onclick = () => { zi = (zi + 1) % steps.length; setZ(); }; setZ();
      }
      // Toucher l'image : le téléphone refait la mise au point à cet endroit (si la caméra le permet).
      v.onclick = async ev => {
        const r = v.getBoundingClientRect(), pt = { x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height };
        const m = $('#scan-msg'); if (m) m.textContent = 'Mise au point…';
        try { await tr.applyConstraints({ advanced: [{ pointsOfInterest: [pt], focusMode: 'single-shot' }] }); } catch (e6) {}
        setTimeout(async () => { try { if ((cap.focusMode || []).includes('continuous')) await tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e7) {} }, 1500);
      };
      if (cap.torch) { const b = $('#scan-light'); b.hidden = false; let on = false;
        b.onclick = async () => { on = !on; try { await tr.applyConstraints({ advanced: [{ torch: on }] }); b.textContent = on ? '🔦 Éteindre' : '🔦 Lumière'; } catch (e2) {} }; }
    } catch (e1) {}
  } catch (e) {
    stopScan();
    if (opts.onFail) opts.onFail();
    return toast(e && e.name === 'NotAllowedError'
      ? 'Accès à la caméra refusé. Autorisez la caméra pour ce site dans les réglages du navigateur.'
      : 'Caméra indisponible sur ce téléphone. Tapez le code à la main.', true);
  }
  const tick = async () => {
    if (me.stopped) return;
    const v = document.getElementById('scan-v');
    try {
      if (v && v.readyState >= 2) {
        let all = [];
        if (me.det) { try { all = ((await me.det.detect(v)) || []).map(x => String(x.rawValue || '').trim()).filter(Boolean); } catch (e3) {} }
        // Rien de lu, ou seulement des codes inutiles (ex. code du modèle) : le lecteur de secours regarde aussi.
        if (!all.length || (opts.pick && !opts.pick(all))) all = all.concat(softScan(v));
        const code = opts.pick ? (all.length ? opts.pick(all) : null) : all[0];
        if (!code && all.length && opts.miss) { const m = document.getElementById('scan-msg'); if (m) m.textContent = opts.miss; }
        // Le même code lu plusieurs fois de suite n'est compté qu'une fois (1,5 s d'écart minimum).
        if (code && !(code === me.last && Date.now() - me.lastAt < 1500)) {
          me.last = code; me.lastAt = Date.now();
          try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
          const more = onCode(code);
          if (!more) return stopScan();
        }
      }
    } catch (e) {}
    if (!me.stopped) me.timer = setTimeout(tick, 200);
  };
  tick();
}

const findByCode = code => S.products.find(p => p.barcode && p.barcode.toUpperCase() === String(code).toUpperCase());

// Caisse : chaque produit scanné s'ajoute au panier, on peut enchaîner.
function scanToCart() {
  openScanner('Scanner les produits', code => {
    const m = $('#scan-msg'), u = unitByCode(normCode(code)), p = u ? S.products.find(x => x.id === u.product_id) : findByCode(code);
    if (p && isTracked(p) && !u) { toast(p.name + ' : scannez le code IMEI de la boîte (pas le code-barres du modèle).', true); return true; }
    if (sellByCode(code) && m && p) m.textContent = `Ajouté : ${p.name}${u && u.color ? ' · ' + u.color : ''} (${qty(S.cart.get(p.id))} dans le panier)`;
    else if (m) m.textContent = 'Code non ajouté : ' + code;
    return true;
  }, { pick: salePick });
}

/* ===== Étiquettes code-barres (Code 128) =====
   Dessinées directement dans le PDF (aucun outil extérieur). Code 128 est lu par tous les
   téléphones et toutes les douchettes de caisse. Codes uniquement chiffres et de longueur paire :
   jeu C (plus court) ; sinon jeu B (lettres et chiffres). */
const C128 = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213',
  '221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212',
  '223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323',
  '131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123',
  '113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113',
  '312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214',
  '112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142',
  '121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341',
  '131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232',
  '2331112'];

/* ===== Lecteur de codes-barres de secours (fait pour Bara Gestion, sans bibliothèque extérieure) =====
   Certains téléphones ont le lecteur intégré au navigateur mais il ne lit rien (ou ne l'ont pas du
   tout, comme l'iPhone). Ce lecteur-ci lit lui-même l'image de la caméra, ligne par ligne :
   Code 128 (IMEI des boîtes, numéros de série, étiquettes Bara Gestion) et EAN-13 (code du fabricant).
   Chaque lecture est vérifiée par le chiffre de contrôle du code : une lecture fausse est rejetée. */
const SOFT = { cv: null };
const C128_W = C128.map(p => p.split('').map(Number));
const EAN_L = ['3211', '2221', '2122', '1411', '1132', '1231', '1114', '1312', '1213', '3112'].map(p => p.split('').map(Number));
const EAN_G = EAN_L.map(p => [...p].reverse());
const EAN_PAR = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLL', 'LGLGGL', 'LGGLGL'];

// Meilleur motif pour n barres/espaces (largeurs en pixels) parmi une liste de motifs (en modules).
function softMatch(r, i, pats, modules) {
  let t = 0; for (let k = 0; k < pats[0].length; k++) t += r[i + k];
  // Erreur mesurée surtout sur les paires barre+espace : une encre qui « bave » (barres trop grosses,
  // espaces trop fins) ne change pas ces paires.
  const m = t / modules, n = pats[0].length; let best = -1, err = 1e9;
  for (let p = 0; p < pats.length; p++) {
    const P = pats[p]; if (P.length !== n) continue;
    let e = 0;
    for (let k = 0; k < n - 1; k++) e += Math.abs((r[i + k] + r[i + k + 1]) / m - P[k] - P[k + 1]);
    for (let k = 0; k < n; k++) e += 0.3 * Math.abs(r[i + k] / m - P[k]);
    if (e < err) { err = e; best = p; }
  }
  return [best, err, m];
}

// Code 128 : départ (103-105), symboles de 6 barres/espaces (11 modules), contrôle modulo 103, arrêt.
const C6 = C128_W.slice(0, 106);
function c128At(r, i) {
  if (i + 19 > r.length) return null;
  const [st, e0, m0] = softMatch(r, i, C6, 11);
  if (st < 103 || e0 > 2.2) return null;

// Une ligne de pixels (niveaux de gris) -> largeurs des barres et espaces, la 1re étant une barre.

function softRunsT(gray, w) {

      const a = d[x - 1], b = d[x]; let t = a === b ? 0.5 : a / (a - b); t = Math.min(1, Math.max(0, t));

// Méthode 2 (image un peu floue) : les bords sont pris au maximum de la pente (là où la couleur change le plus vite), placés au

    const L = edges[edges.length - 1];

    else edges.push({ p: pos, s: sg, m: av });
  }

  for (let i = k; i + 1 < edges.length; i++) runs.push(edges[i + 1].p - edges[i].p);
  if (runs.length % 2 === 0) runs.pop();                       // finir sur une barre

// Image floue : on « rend net » la ligne (on renforce l'écart avec les pixels voisins), puis on relit.
function softSharp(gray, w, sig, amt) {

// Une ligne : telle quelle, puis rendue nette (force différente à chaque image de la caméra, pour rester

const SHARP = [[1.5, 1.5], [2.5, 2.5]];

function softTry(R, out) {

function softScan(src) {

// Renvoie la suite des largeurs (barre, espace, barre…) en modules, ou null si le code n'est pas encodable.
function code128(text) {
  const s = String(text || '');
  if (!s.length || s.length > 40) return null;
  let vals;
  if (/^\d+$/.test(s) && s.length >= 2) {
    // Chiffres : jeu C (2 chiffres par barre, plus court). Nombre impair (IMEI = 15) : le dernier en jeu B.
    vals = [105];
    for (let i = 0; i + 1 < s.length; i += 2) vals.push(Number(s.slice(i, i + 2)));
    if (s.length % 2) vals.push(100, s.charCodeAt(s.length - 1) - 32);
  } else {
    if (!/^[\x20-\x7e]+$/.test(s)) return null;
    vals = [104, ...[...s].map(c => c.charCodeAt(0) - 32)];
  }
  let sum = vals[0];
  for (let i = 1; i < vals.length; i++) sum += i * vals[i];
  vals.push(sum % 103, 106);
  return vals.map(v => C128[v]).join('').split('').map(Number);
}

// Planche A4 : 3 colonnes x 8 lignes. items = [{ name, code, price, copies }]
function labelsPdf(items, showPrice) {
  const pdf = newPdf(), COLS = 3, ROWS = 8, MX = 18, MY = 24;
  const CW = (pdf.W - 2 * MX) / COLS, RH = (pdf.H - 2 * MY) / ROWS;
  const list = [];
  items.forEach(it => { for (let i = 0; i < Math.max(1, Math.min(200, it.copies || 1)); i++) list.push(it); });
  list.forEach((it, n) => {
    const k = n % (COLS * ROWS);
    if (k === 0) pdf.page();
    const x = MX + (k % COLS) * CW, y = MY + Math.floor(k / COLS) * RH;
    // Repères de découpe discrets
    pdf.line(x + 4, x + CW - 4, y + RH - 1, [0.88, 0.9, 0.88], 0.4);
    const name = pdfWrap(it.name, true, 9, CW - 16)[0] || '';
    pdf.text(x + CW / 2, y + 15, name, { size: 9, bold: true, align: 'center' });
    const mods = code128(it.code);
    if (mods) {
      const total = mods.reduce((a, b) => a + b, 0) + 20;          // + zones blanches de 10 modules
      const mw = Math.min(1.25, (CW - 12) / total);
      const bw = (total - 20) * mw;
      let bx = x + (CW - bw) / 2;
      mods.forEach((m, i) => { if (i % 2 === 0) pdf.rect(bx, y + 22, m * mw, 40, [0, 0, 0]); bx += m * mw; });
    }
    pdf.text(x + CW / 2, y + 74, it.code, { size: 8, align: 'center', color: [0.25, 0.28, 0.26] });
    if (showPrice) pdf.text(x + CW / 2, y + 88, plainMoney(it.price) + ' FCFA', { size: 9.5, bold: true, align: 'center' });
  });
  return pdf.build('Étiquettes ' + S.shop.name);
}

// Étiquettes des appareils : grandes (2 x 6 par page A4), avec l'IMEI en gros code-barres, faciles à
// scanner à la vente (le code d'origine sur la boîte est souvent tout petit). units = [{ serial, color, product_id }]
function unitLabelsPdf(units) {
  const pdf = newPdf(), COLS = 2, ROWS = 6, MX = 24, MY = 30;
  const CW = (pdf.W - 2 * MX) / COLS, RH = (pdf.H - 2 * MY) / ROWS;
  units.forEach((u, n) => {
    const k = n % (COLS * ROWS);
    if (k === 0) pdf.page();
    const x = MX + (k % COLS) * CW, y = MY + Math.floor(k / COLS) * RH, p = S.products.find(q => q.id === u.product_id) || {};
    pdf.line(x + 6, x + CW - 6, y + RH - 1, [0.85, 0.87, 0.85], 0.5);
    pdf.text(x + CW / 2, y + 18, pdfWrap(u.name || p.name || '', true, 11, CW - 20)[0] || '', { size: 11, bold: true, align: 'center' });
    const sub = [u.color, Number(u.warranty_months) ? 'garantie ' + u.warranty_months + ' mois' : ''].filter(Boolean).join(' · ');
    if (sub) pdf.text(x + CW / 2, y + 32, sub, { size: 9, align: 'center', color: [0.3, 0.33, 0.31] });
    const mods = code128(u.serial);
    if (mods) {
      const total = mods.reduce((a, b) => a + b, 0) + 20, mw = Math.min(2, (CW - 24) / total), bw = (total - 20) * mw;
      let bx = x + (CW - bw) / 2;
      mods.forEach((m, i) => { if (i % 2 === 0) pdf.rect(bx, y + 40, m * mw, 52, [0, 0, 0]); bx += m * mw; });
    }
    pdf.text(x + CW / 2, y + 108, (imeiOk(u.serial) ? 'IMEI ' : 'S/N ') + u.serial, { size: 11, bold: true, align: 'center' });
  });
  return pdf.build('Étiquettes appareils ' + S.shop.name);
}
function downloadPdf(bytes, name) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

    <h2>Imprimer des étiquettes</h2>
    ${canTrack() ? `<button class="btn" type="button" id="lb-free" style="height:auto;padding:12px">✍️ Créer des étiquettes IMEI<br><small style="font:400 12.5px var(--f-body);opacity:.85">je tape les IMEI, j'imprime, je colle sur les boîtes</small></button>
      ${S.products.some(isTracked) ? `<button class="btn ghost" type="button" id="lb-units" style="height:auto;padding:12px">📱 Étiquettes des appareils en stock<br><small style="font:400 12.5px var(--f-body);opacity:.85">appareils déjà enregistrés</small></button>` : ''}` : ''}
    <p class="muted" style="margin:0;font-size:13px">Choisissez le nombre d'étiquettes par produit (0 = aucune). Planche A4 de 24 étiquettes, à imprimer puis découper. Collez-les sur l'article, son emballage ou l'étagère (produits en vrac).</p>
    ${missing ? `<div class="banner">${missing} produit(s) n'ont pas encore de code : ils en recevront un après la mise à jour de la base.</div>` : ''}
    <div class="row"><button class="btn ghost small" type="button" id="lb-all">1 pour tous</button><button class="btn ghost small" type="button" id="lb-none">Aucun</button></div>
    <div class="plist" style="max-height:45vh;overflow:auto">${prods.map(p => `<div class="row" style="align-items:center;flex-wrap:nowrap">
      <div style="flex:1 1 auto;min-width:0"><div class="nm" style="overflow-wrap:anywhere">${esc(p.name)}</div><div class="sub muted">${esc(p.barcode)}</div></div>
      <input type="number" min="0" max="200" step="1" value="0" data-lb="${esc(p.id)}" style="width:70px;flex:0 0 auto" aria-label="Étiquettes pour ${esc(p.name)}"></div>`).join('') || '<p class="empty">Aucun produit avec code.</p>'}</div>
    <div style="display:flex;align-items:center;gap:10px"><input id="lb-price" type="checkbox" style="width:22px;height:22px;flex:0 0 auto;margin:0"><span style="font-size:14px" onclick="document.getElementById('lb-price').click()">Afficher le prix (à réimprimer si le prix change)</span></div>
    <div class="row"><button class="btn" type="submit">Créer le PDF</button><button class="btn ghost" type="button" id="cancel">Fermer</button></div></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  const lu = $('#lb-units'); if (lu) lu.onclick = () => unitLabelsSheet();
  const lf = $('#lb-free'); if (lf) lf.onclick = () => freeLabelsSheet();
  $('#lb-all').onclick = () => document.querySelectorAll('[data-lb]').forEach(i => { i.value = 1; });
  $('#lb-none').onclick = () => document.querySelectorAll('[data-lb]').forEach(i => { i.value = 0; });
  $('#sheet').onsubmit = ev => {
    ev.preventDefault();
    const items = [];
    document.querySelectorAll('[data-lb]').forEach(i => {
      const n = Math.round(Number(i.value) || 0), p = prods.find(x => x.id === i.dataset.lb);
      if (n > 0 && p) items.push({ name: p.name, code: p.barcode, price: p.sell_price, copies: n });
    });
    if (!items.length) return toast('Choisissez au moins une étiquette.', true);
    const url = URL.createObjectURL(new Blob([labelsPdf(items, $('#lb-price').checked)], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'Etiquettes-' + new Date().toISOString().slice(0, 10) + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
    toast('Étiquettes créées : ouvrez le PDF pour l\'imprimer.');
  };
}

/* ===== Facture : écran, partage, téléchargement ===== */
async function ensureNames() {
  if (!isManager() || S.names) return;
  const { data } = await sb.from('shop_members').select('user_id, display_name').eq('shop_id', S.shop.id);
  S.names = {};
  (data || []).forEach(m => { S.names[m.user_id] = m.display_name; });
}

async function loadSale(id) {
  const { data, error } = await sb.from('sales').select(SALE_COLS).eq('id', id).eq('shop_id', S.shop.id).maybeSingle();
  if (error || !data) throw new Error(error ? cleanErr(error) : 'Vente introuvable');
  return data;
}

async function buildInvoice(s) {
  await ensureNames();
  const seller = s.created_by === S.user.id ? S.shop.who : ((S.names && S.names[s.created_by]) || '');
  // Appareils vendus : numéro, couleur, fin de garantie (sur la facture du client).
  let units = {};
  if (s.id && !S.offline && (s.sale_items || []).some(i => i.products && i.products.track_kind)) {
    const { data } = await sb.from('product_units').select('product_id,serial,color,warranty_until').eq('sale_id', s.id).order('serial');
    (data || []).forEach(u => { (units[u.product_id] = units[u.product_id] || []).push({ serial: u.serial, color: u.color, until: u.warranty_until,
      kind: ((s.sale_items || []).find(i => i.product_id === u.product_id) || {}).products?.track_kind }); });
  }
  return {
    shop: { name: S.shop.name, phone: S.shop.phone || '', address: S.shop.address || '', footer: S.shop.footer || '' },
    no: s.invoice_no, num: s.invoice_no ? invNo(s.invoice_no) : s.offline_ref, ref2: s.invoice_no && s.offline_ref ? s.offline_ref : '',
    date: s.client_created_at || s.created_at, seller, customer: s.customer_name || '', pay: PAY[s.payment_method] || '',
    lines: (s.sale_items || []).map(i => ({ name: i.products?.name || 'Produit', unit: UNITS[i.products?.unit] || '',
      qty: i.quantity, price: i.unit_price, total: i.line_total, units: i.units || units[i.product_id] || [] })),
    total: s.total, paid: s.paid, discount: s.discount || 0, advance: s.advance_used || 0
  };
}

function downloadInvoice(inv) {
  const url = URL.createObjectURL(new Blob([invoicePdf(inv)], { type: 'application/pdf' }));
  const a = document.createElement('a');
  a.href = url; a.download = `${inv.kind === 'quote' ? 'Devis' : 'Facture'}-${inv.num}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

async function shareInvoice(inv, phone) {
  const word = inv.kind === 'quote' ? 'Devis' : 'Facture';
  const name = `${word}-${inv.num}.pdf`;
  const text = invoiceText(inv);
  try {
    const file = new File([invoicePdf(inv)], name, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: `${word} ${inv.num}`, text: `${inv.shop.name} : ${word.toLowerCase()} ${inv.num}` });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;            // l'utilisateur a fermé le menu de partage
  }
  // Ordinateur ou navigateur sans partage de fichier : message WhatsApp avec le détail.
  window.open('https://wa.me/' + (phone ? waNumber(phone) : '') + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
  toast('Message WhatsApp préparé. Pour envoyer le PDF, utilisez « Télécharger ».');
}

async function openInvoice(saleOrId, opts = {}) {
  let inv, sale;
  try { sale = typeof saleOrId === 'string' ? await loadSale(saleOrId) : saleOrId; inv = await buildInvoice(sale); }
  catch (e) { return toast(e.message, true); }
  const incomplete = !inv.shop.phone && !inv.shop.address;
  const cancelled = sale && sale.status === 'cancelled', rest = inv.total - inv.paid - inv.advance;
  const chip = (t, c) => `<span class="tag ${c || ''}" style="font-size:12.5px;padding:4px 9px">${t}</span>`;
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-label="Facture">
    <div class="row" style="align-items:baseline;flex-wrap:nowrap"><h2 style="flex:1 1 auto">🧾 ${esc(inv.num)}</h2><span class="muted" style="flex:0 0 auto">${esc(dtFull(inv.date))}</span></div>
    <div class="bigtotal" style="${cancelled ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(money(inv.total))}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
      ${cancelled ? chip('Annulée', 'bad') : ''}${chip((sale && sale.payment_method === 'mobile_money' ? '📱 ' : '💵 ') + esc(inv.pay))}
      ${inv.customer ? chip('👤 ' + esc(inv.customer)) : ''}${inv.advance > 0 ? chip('Avance : ' + esc(money(inv.advance))) : ''}
      ${rest > 0 && !cancelled ? chip('Reste : ' + esc(money(rest)), 'bad') : ''}${inv.discount > 0 ? chip('Remise : ' + esc(money(inv.discount)), 'warn') : ''}</div>
    <div class="card" style="padding:4px 12px">${inv.lines.map(l => `<div class="row" style="flex-wrap:nowrap;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px">
      <span style="flex:1 1 auto;min-width:0"><b>${esc(plainQty(l.qty))}</b> × ${esc(l.name)}${(l.units || []).map(u => `<br><span class="muted" style="font-size:12.5px">${esc(unitLine(u))}</span>`).join('')}</span><span class="num" style="flex:0 0 auto">${esc(money(l.total))}</span></div>`).join('')}</div>
    ${inv.seller || inv.ref2 ? `<div class="muted" style="font-size:12.5px;text-align:center">${inv.seller ? 'Vendu par ' + esc(inv.seller) : ''}${inv.ref2 ? ' · réf. ' + esc(inv.ref2) : ''}</div>` : ''}
    ${cancelled && sale.cancel_reason ? `<div class="banner bad" style="margin:0">Annulée : ${esc(sale.cancel_reason)}</div>` : ''}
    ${incomplete && S.role === 'owner' ? `<div class="banner" style="margin:0">Ajoutez l'adresse et le téléphone de la boutique (Plus › Équipe, « Fiche de la boutique ») pour la facture.</div>` : ''}
    ${cancelled ? '' : `<div class="row"><button class="btn" id="inv-share">💬 WhatsApp</button><button class="btn ghost" id="inv-dl">📄 PDF</button></div>`}
    ${opts.fromHistory && !cancelled && isManager() && sale && sale.id ? `<button class="btn ghost" id="inv-cancel" ${canWrite() ? '' : 'disabled'} style="color:var(--bad)">Annuler cette vente</button>` : ''}
    <button class="btn ghost" id="inv-close">Fermer</button></div></div>`;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#inv-close').onclick = closeSheet;
  const dl = $('#inv-dl'); if (dl) dl.onclick = () => downloadInvoice(inv);
  const sh = $('#inv-share'); if (sh) sh.onclick = () => shareInvoice(inv);
  const ca = $('#inv-cancel'); if (ca) ca.onclick = () => cancelDialog(sale.id);
}

/* ===== Fiche de la boutique (propriétaire) ===== */
function openShopProfile() {
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="Fiche de la boutique">
    <h2>Fiche de la boutique</h2>
    <p class="muted" style="margin:0">Ces informations sont imprimées sur chaque facture.</p>
    <label>Nom de la boutique<input id="s-name" maxlength="100" required value="${esc(S.shop.name)}"></label>
    <label>Téléphone<input id="s-phone" maxlength="30" inputmode="tel" value="${esc(S.shop.phone || '')}" placeholder="ex. +226 70 00 00 00"></label>
    <label>Adresse ou ville<input id="s-addr" maxlength="200" value="${esc(S.shop.address || '')}" placeholder="ex. Bèguédo, Boulgou"></label>
    <label>Phrase de bas de page<input id="s-foot" maxlength="200" value="${esc(S.shop.footer || '')}" placeholder="ex. Merci de votre confiance"></label>
    <div class="row"><button class="btn" type="submit">Enregistrer</button><button class="btn ghost" type="button" id="cancel">Annuler</button></div></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
    const v = { name: $('#s-name').value.trim(), phone: $('#s-phone').value.trim(), address: $('#s-addr').value.trim(), footer: $('#s-foot').value.trim() };
    const { error } = await sb.rpc('update_shop_profile', { p_shop: S.shop.id, p_name: v.name, p_phone: v.phone, p_address: v.address, p_footer: v.footer });
    if (error) { btn.disabled = false; return toast(cleanErr(error), true); }
    S.shop.name = v.name; S.shop.phone = v.phone; S.shop.address = v.address; S.shop.footer = v.footer;
    const m = S.memberships.find(x => x.shop_id === S.shop.id);
    if (m) m.shops = { ...m.shops, name: v.name, phone: v.phone || null, address: v.address || null, invoice_footer: v.footer || null };
    closeSheet(); toast('Fiche enregistrée.'); draw();
  };
  $('#s-name').focus();
}

boot().catch(e => fatal(e));
