        ${canScan() ? '<button class="btn ghost small" type="button" id="f-scan" style="flex:0 0 auto;margin-bottom:2px">📷</button>' : ''}</div>
      <p class="muted" style="margin:0;font-size:13px">Le nouveau prix s'applique aux prochaines ventes. Les ventes déjà faites gardent leur prix. Chaque changement de prix est noté dans le journal. Pour changer la quantité, utilisez « Réception » ou « Ajuster ».</p>
      <div style="display:flex;align-items:center;gap:10px"><input id="f-off" type="checkbox" style="width:22px;height:22px;flex:0 0 auto;margin:0"><span style="font-size:14px" onclick="document.getElementById('f-off').click()">Retirer ce produit de la vente (il reste dans l'historique)</span></div>`;
  } else if (kind === 'recv') {
    title = 'Réception : ' + p.name;
    body = `<div class="row"><label>Quantité reçue<input id="f-qty" type="number" inputmode="decimal" min="0" step="any" required></label>
      <label>Prix d'achat unitaire (FCFA)<input id="f-cost" type="number" inputmode="numeric" min="0" step="1" value="${esc(S.costs[p.id] ?? 0)}" required></label></div>
      <div class="row"><label>Transport (FCFA)<input id="f-tr" type="number" inputmode="numeric" min="0" step="1" value="0"></label>
        <label>Fournisseur<input id="f-sup" maxlength="100"></label></div>`;
  } else {
    title = 'Ajuster le stock : ' + p.name;
    body = `<label>Type<select id="f-kind"><option value="loss">Perte (retire du stock)</option><option value="return">Retour (ajoute au stock)</option><option value="correction">Correction d'inventaire (+ ou −)</option></select></label>
      <label>Quantité<input id="f-qty" type="number" inputmode="decimal" step="any" required></label>
      <label>Motif (obligatoire)<input id="f-reason" maxlength="200" required></label>`;
  }
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2>${body}
    <div class="row"><button class="btn" type="submit">Enregistrer</button><button class="btn ghost" type="button" id="cancel">Annuler</button></div></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  let lossOk = false;
  // Prix de vente sous le prix d'achat (ou à 0) : souvent une erreur de saisie. On avertit sans interdire.
  if (kind === 'new' || kind === 'edit') {
    $('#sheet').addEventListener('input', ev => {
      if (!lossOk || !['f-buy', 'f-sell'].includes(ev.target.id)) return;
      lossOk = false; const w = $('#loss-warn'); if (w) w.remove();
      $('#sheet [type=submit]').textContent = 'Enregistrer';
    });
  }
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
    const num = id => Number($('#' + id).value);
    if ((kind === 'new' || kind === 'edit') && !lossOk) {
      const buy = Math.round(num('f-buy')), sell = Math.round(num('f-sell'));
      if (sell < buy || sell === 0) {
        lossOk = true; btn.disabled = false; btn.textContent = 'Confirmer quand même';
        btn.closest('.row').insertAdjacentHTML('beforebegin', `<div class="banner bad" id="loss-warn">${sell === 0
          ? 'Attention : le prix de vente est à 0 FCFA. Le produit serait donné gratuitement.'
          : `Attention : vous vendrez à perte (vente ${esc(money(sell))} &lt; achat ${esc(money(buy))}). Vérifiez que les deux prix ne sont pas inversés.`}
          Corrigez les prix, ou touchez « Confirmer quand même ».</div>`);
        return;
      }
    }
    let res;
    if (kind === 'new') {
      res = await sb.rpc('create_product', {
        p_shop: S.shop.id, p_name: $('#f-name').value, p_category: $('#f-cat').value, p_unit: $('#f-unit').value,
        p_buy_price: Math.round(num('f-buy')), p_sell_price: Math.round(num('f-sell')),
        p_initial_qty: num('f-qty'), p_alert: num('f-alert'), p_barcode: $('#f-code').value.trim() || null });
    } else if (kind === 'edit') {
      const sell = Math.round(num('f-sell')), buy = Math.round(num('f-buy'));
      if (!($('#f-sell').value !== '' && sell >= 0) || !($('#f-buy').value !== '' && buy >= 0)) {
        btn.disabled = false; return toast('Prix invalide.', true);
      }
      res = await sb.rpc('update_product', {
        p_product: pid, p_name: $('#f-name').value.trim(), p_category: $('#f-cat').value, p_sell_price: sell,
        p_buy_price: buy, p_alert: num('f-alert'), p_active: $('#f-off').checked ? false : null,
        p_barcode: $('#f-code').value.trim() || null });
    } else if (kind === 'recv') {
      res = await sb.rpc('receive_stock', {
        p_shop: S.shop.id, p_product: pid, p_qty: num('f-qty'), p_unit_cost: Math.round(num('f-cost')),
        p_transport: Math.round(num('f-tr')), p_supplier: $('#f-sup').value });
    } else {
      res = await sb.rpc('adjust_stock', {
        p_shop: S.shop.id, p_product: pid, p_kind: $('#f-kind').value, p_qty: num('f-qty'), p_reason: $('#f-reason').value });
    }
    if (res.error) { btn.disabled = false; return toast(cleanErr(res.error), true); }
    closeSheet(); toast('Enregistré.');
    await loadProducts(); S.summary = null; draw();
  };
  const fs = $('#f-scan');
  if (fs) fs.onclick = () => openScanner('Scanner le code du fabricant', code => {
    const other = findByCode(code);
    if (other && other.id !== pid) { toast('Ce code est déjà utilisé par : ' + other.name, true); return true; }
    $('#f-code').value = code; toast('Code lu : ' + code); return false;
  });
  const first = $('#sheet input'); if (first) first.focus();
}
function closeSheet() { $('#sheet-host').innerHTML = ''; stopScan(); }

/* ===== Comptage de stock (propriétaire et gérant, en ligne uniquement) =====
   Chaque quantité saisie est enregistrée tout de suite dans la base, avec le stock attendu à
   ce moment-là. Le gérant ne voit pas la quantité attendue (comptage « à l'aveugle ») et
   envoie son comptage au propriétaire, qui valide. */
async function loadCountState() {
  S.countPending = false;
  if (!isManager() || S.offline) return;
  try {
    const { data } = await sb.from('stock_counts').select('id,status').eq('shop_id', S.shop.id).in('status', ['open', 'submitted']).limit(1);
    S.countPending = !!(data && data[0] && (data[0].status === 'submitted' ? S.role === 'owner' : true)) && data[0].status;
  } catch (e) {}
}

async function viewCount() {
  stopScan();
  if (S.offline) { $('#view').innerHTML = '<div class="banner bad">Le comptage demande une connexion internet.</div>'; return; }
  $('#view').innerHTML = '<p class="empty">Chargement…</p>';
  const [act, past] = await Promise.all([
    sb.from('stock_counts').select('*').eq('shop_id', S.shop.id).in('status', ['open', 'submitted']).limit(1),
    sb.from('stock_counts').select('*').eq('shop_id', S.shop.id).in('status', ['applied', 'cancelled']).order('created_at', { ascending: false }).limit(8)]);
  if (act.error || past.error) { $('#view').innerHTML = ''; return toast(cleanErr(act.error || past.error), true); }
  await ensureNames();
  const c = (act.data || [])[0];
  if (!c) return countStartScreen(past.data || []);
  const { data: lines, error } = await sb.from('stock_count_lines').select('product_id,expected,counted').eq('count_id', c.id);
  if (error) { $('#view').innerHTML = ''; return toast(cleanErr(error), true); }
  S.count = { c, lines: {} };
  (lines || []).forEach(l => { S.count.lines[l.product_id] = { counted: Number(l.counted), expected: Number(l.expected) }; });
  if (c.status === 'submitted') return S.role === 'owner' ? countReview() : countWaiting();
  countEntryScreen();
}

function countStartScreen(past) {
  const cats = [...new Set(S.products.map(p => p.category))].sort();
  const who = id => esc((S.names && S.names[id]) || '');
  $('#view').innerHTML = `
    <section class="card stack">
      <h2>Comptage de stock</h2>
      <p class="muted" style="margin:0;font-size:13.5px">Comptez ce qu'il y a vraiment en rayon. L'application compare avec son stock et montre les écarts. ${S.role === 'owner' ? '' : 'Votre comptage sera validé par le propriétaire.'}</p>
      <label>Que compter ?<select id="ct-cat"><option value="">Toute la boutique (${S.products.length} produits)</option>
        ${cats.map(k => `<option value="${esc(k)}">${esc(k)} (${S.products.filter(p => p.category === k).length})</option>`).join('')}</select></label>
      <button class="btn" id="ct-start" ${canWrite() ? '' : 'disabled'}>Démarrer le comptage</button>
      <button class="btn ghost" id="ct-back">Retour aux produits</button>
    </section>
    ${S.role === 'owner' ? `<section class="card stack"><h3 style="margin:0">Alerte de grand écart</h3>
      <form id="ct-thr" class="row" style="align-items:flex-end"><label>Prévenir si un écart dépasse (FCFA)<input id="ct-thr-v" type="number" min="0" step="500" value="10000"></label>
      <button class="btn ghost small" type="submit" style="flex:0 0 auto">Enregistrer</button></form></section>` : ''}
    <section class="card stack"><h3 style="margin:0">Comptages précédents</h3>
      ${past.length ? past.map(x => `<div class="row muted" style="font-size:13.5px"><span>${dt(x.created_at)} · ${esc(x.category || 'toute la boutique')} · ${who(x.created_by)}</span>
        <span style="text-align:right">${x.status === 'cancelled' ? 'annulé' : `${x.loss_value ? `<b style="color:var(--bad)">−${money(x.loss_value)}</b>` : ''} ${x.gain_value ? `+${money(x.gain_value)}` : ''}${!x.loss_value && !x.gain_value ? 'aucun écart' : ''}`}</span></div>`).join('')
        : '<p class="muted" style="margin:0">Aucun comptage pour le moment.</p>'}</section>`;
  $('#ct-back').onclick = () => { S.tab = 'products'; draw(); };
  $('#ct-start').onclick = async () => {
    const { error } = await sb.rpc('start_stock_count', { p_shop: S.shop.id, p_category: $('#ct-cat').value || null });
    if (error) return toast(cleanErr(error), true);
    viewCount();
  };
  const thr = $('#ct-thr');
  if (thr) thr.onsubmit = async ev => {
    ev.preventDefault();
    const { error } = await sb.rpc('set_count_alert_threshold', { p_shop: S.shop.id, p_amount: Math.round(Number($('#ct-thr-v').value) || 0) });
    if (error) return toast(cleanErr(error), true);
    toast('Seuil enregistré.');
  };
}

function countProducts() {
  const cat = S.count.c.category;
  return S.products.filter(p => !cat || p.category === cat);
}

function countEntryScreen() {
  const c = S.count.c, list = countProducts();
  const done = list.filter(p => S.count.lines[p.id]).length;
  const owner = S.role === 'owner';
  $('#view').innerHTML = `
    <section class="card stack">
      <h2>Comptage en cours</h2>
      <div class="muted" style="font-size:13.5px">${esc(c.category || 'Toute la boutique')} · démarré le ${dt(c.created_at)} · <b id="ct-done">${done}</b> / ${list.length} produits comptés</div>
      ${owner ? '' : '<div class="muted" style="font-size:13px">Comptez sans regarder l\'écran du stock : tapez seulement ce que vous voyez.</div>'}
      <div class="row" style="align-items:flex-end;flex-wrap:nowrap">
        <label style="flex:1 1 auto">Chercher un produit<input id="ct-q" type="search" autocomplete="off" placeholder="Nom ou code"></label>
        ${canScan() ? '<button class="btn small" type="button" id="ct-scan" style="flex:0 0 auto;margin-bottom:2px">📷 Scanner</button>' : ''}</div>
    </section>
    <section class="card stack"><div class="plist" id="ct-list"></div></section>
    <section class="card stack">
      ${owner ? `<button class="btn" id="ct-review">Voir les écarts et valider</button>` : `<button class="btn" id="ct-submit">Terminer et envoyer au propriétaire</button>`}
      <div class="row"><button class="btn ghost" id="ct-back">Retour aux produits</button>
        <button class="btn ghost" id="ct-cancel" style="color:var(--bad)">Annuler le comptage</button></div>
    </section>`;
  const drawList = () => {
    const t = ($('#ct-q').value || '').trim().toLowerCase();
    const rows = list.filter(p => !t || p.name.toLowerCase().includes(t) || (p.barcode || '').toLowerCase() === t);
    $('#ct-list').innerHTML = rows.map(p => {
      const l = S.count.lines[p.id];
      return `<div class="row" style="align-items:center;flex-wrap:nowrap" id="ct-row-${esc(p.id)}">
        <div style="flex:1 1 auto;min-width:0"><div class="nm" style="overflow-wrap:anywhere">${esc(p.name)}</div>
          <div class="sub muted">${esc(UNITS[p.unit])}${owner ? ` · attendu ${qty(p.stock_qty)}` : ''} <span data-st="${esc(p.id)}">${l ? '✓ compté' : ''}</span></div></div>
        <input type="number" inputmode="decimal" min="0" step="${WHOLE.includes(p.unit) ? 1 : 0.001}" data-ct="${esc(p.id)}"
          value="${l ? esc(l.counted) : ''}" placeholder="?" style="width:90px;flex:0 0 auto" aria-label="Quantité comptée ${esc(p.name)}"></div>`;
    }).join('') || '<p class="empty">Aucun produit.</p>';
    document.querySelectorAll('[data-ct]').forEach(i => i.onchange = () => saveCountLine(i));
  };
  drawList();
  $('#ct-q').oninput = drawList;
  const sc = $('#ct-scan');
  if (sc) sc.onclick = () => openScanner('Scanner un produit à compter', code => {
    const p = findByCode(code);
    if (!p) { toast('Aucun produit avec le code ' + code + '.', true); return true; }
    if (!list.includes(p)) { toast(p.name + ' ne fait pas partie de ce comptage (' + (c.category || '') + ').', true); return true; }
    $('#ct-q').value = ''; drawList();
    setTimeout(() => { const i = document.querySelector(`[data-ct="${p.id}"]`); if (i) { i.scrollIntoView({ block: 'center' }); i.focus(); } }, 50);
    toast(p.name + ' : tapez la quantité comptée.');
    return false;
  });
  $('#ct-back').onclick = () => { S.tab = 'products'; draw(); };
  $('#ct-cancel').onclick = cancelCount;
  const rv = $('#ct-review'); if (rv) rv.onclick = countReview;
  const sb2 = $('#ct-submit');
  if (sb2) sb2.onclick = async () => {
    if (!Object.keys(S.count.lines).length) return toast('Aucun produit compté.', true);
    const left = list.length - list.filter(p => S.count.lines[p.id]).length;
    if (left && !sb2.dataset.sure) { sb2.dataset.sure = '1'; sb2.textContent = `Envoyer quand même (${left} non comptés)`; return; }
    const { error } = await sb.rpc('submit_stock_count', { p_count: c.id });
    if (error) return toast(cleanErr(error), true);
    toast('Comptage envoyé au propriétaire pour validation.'); await loadCountState(); viewCount();
  };
}

async function saveCountLine(i) {
  const pid = i.dataset.ct, st = document.querySelector(`[data-st="${pid}"]`);
  if (i.value.trim() === '') return;
  const v = Number(i.value);
  if (st) st.textContent = 'enregistrement…';
  const { error } = await sb.rpc('record_count_line', { p_count: S.count.c.id, p_product: pid, p_counted: v });
  if (error) {
    if (st) st.innerHTML = '<b style="color:var(--bad)">✗ non enregistré</b>';
    return toast(cleanErr(error), true);
  }
  const p = S.products.find(x => x.id === pid);
  S.count.lines[pid] = { counted: v, expected: p ? Number(p.stock_qty) : 0 };
  if (st) st.textContent = '✓ compté';
  const d = $('#ct-done'); if (d) d.textContent = countProducts().filter(x => S.count.lines[x.id]).length;
}

async function cancelCount() {
  const b = $('#ct-cancel');
  if (b && !b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Confirmer l\'annulation'; return; }
  const { error } = await sb.rpc('cancel_stock_count', { p_count: S.count.c.id });
  if (error) return toast(cleanErr(error), true);
  toast('Comptage annulé : le stock n\'a pas été modifié.'); await loadCountState(); viewCount();
}

function countWaiting() {
  $('#view').innerHTML = `<section class="card stack"><h2>Comptage envoyé</h2>
    <p>Votre comptage du ${dt(S.count.c.created_at)} attend la validation du propriétaire. Le stock sera corrigé quand il l'aura validé.</p>
    <button class="btn ghost" id="ct-back">Retour aux produits</button></section>`;
  $('#ct-back').onclick = () => { S.tab = 'products'; draw(); };
}

// Propriétaire : écarts (stock attendu au moment de la saisie, valeur au prix d'achat), puis validation.
async function countReview() {
  const { data, error } = await sb.from('stock_count_lines').select('product_id,expected,counted,counted_by').eq('count_id', S.count.c.id);
  if (error) return toast(cleanErr(error), true);
  const c = S.count.c, list = countProducts();
  const rows = (data || []).map(l => {
    const p = S.products.find(x => x.id === l.product_id) || { name: 'Produit retiré', unit: 'piece' };
    const diff = Number(l.counted) - Number(l.expected), cost = Number(S.costs[l.product_id] || 0);
    return { p, exp: Number(l.expected), cnt: Number(l.counted), diff, val: Math.round(diff * cost) };
  }).sort((a, b) => Math.abs(b.val) - Math.abs(a.val));
  const loss = rows.filter(r => r.val < 0).reduce((s, r) => s - r.val, 0), gain = rows.filter(r => r.val > 0).reduce((s, r) => s + r.val, 0);
  const left = list.length - list.filter(p => rows.some(r => r.p.id === p.id)).length;
  const gaps = rows.filter(r => r.diff !== 0);
  $('#view').innerHTML = `
    <section class="card stack">
      <h2>Écarts du comptage</h2>
      <div class="muted" style="font-size:13.5px">${esc(c.category || 'Toute la boutique')} · ${dt(c.created_at)} · par ${esc((S.names && S.names[c.created_by]) || '')}${c.status === 'submitted' ? ' · envoyé pour validation' : ''}</div>
      <div class="grid2"><div class="metric"><span>Manquants (valeur d'achat)</span><b style="color:var(--bad)">${money(loss)}</b></div>
        <div class="metric"><span>En trop (valeur d'achat)</span><b>${money(gain)}</b></div></div>
      ${left ? `<div class="banner">${left} produit(s) non compté(s) : leur stock ne sera pas modifié.</div>` : ''}
      ${gaps.length ? gaps.map(r => `<div class="row" style="font-size:14px;align-items:baseline">
          <span style="flex:1 1 auto"><b>${esc(r.p.name)}</b><br><span class="muted">attendu ${qty(r.exp)} · compté ${qty(r.cnt)}</span></span>
          <span style="text-align:right;flex:0 0 auto"><b style="color:${r.diff < 0 ? 'var(--bad)' : 'inherit'}">${r.diff > 0 ? '+' : ''}${qty(r.diff)} ${esc(UNITS[r.p.unit] || '')}</b><br>
          <span class="muted">${r.val > 0 ? '+' : ''}${money(r.val)}</span></span></div>`).join('')
        : '<div class="banner ok">Aucun écart : le stock de l\'application correspond au comptage.</div>'}
      <p class="muted" style="margin:0;font-size:12.5px">Les écarts sont calculés avec le stock au moment où chaque produit a été compté : les ventes faites pendant le comptage sont prises en compte.</p>
      <button class="btn" id="ct-apply" ${canWrite() && rows.length ? '' : 'disabled'}>Valider et corriger le stock</button>
      <div class="row">${c.status === 'open' ? '<button class="btn ghost" id="ct-edit">Revenir à la saisie</button>' : ''}
        <button class="btn ghost" id="ct-cancel" style="color:var(--bad)">Annuler le comptage</button></div>
    </section>`;
  const ed = $('#ct-edit'); if (ed) ed.onclick = countEntryScreen;
  $('#ct-cancel').onclick = cancelCount;
  $('#ct-apply').onclick = async () => {
    const b = $('#ct-apply'); b.disabled = true; b.textContent = 'Correction du stock…';
    const { data: res, error: e2 } = await sb.rpc('apply_stock_count', { p_count: c.id });
    if (e2) { b.disabled = false; b.textContent = 'Valider et corriger le stock'; return toast(cleanErr(e2), true); }
    toast(`Stock corrigé : ${res.corrections} produit(s). Manquants ${money(res.loss_value)}, en trop ${money(res.gain_value)}.`);
    await Promise.all([loadProducts(), loadCountState(), loadAlertCount()]);
    S.summary = null; draw();
  };
}

/* ===== Caisse (ouverture, opérations, fermeture) =====
   Fermeture « à l'aveugle » : le vendeur tape ce qu'il compte ; seuls le propriétaire et le
   gérant voient le montant attendu et l'écart. Les calculs sont faits par la base. */
const DENOMS = [10000, 5000, 2000, 1000, 500, 250, 200, 100, 50, 25, 10, 5];

async function loadCash() {
  S.cash = null;
  if (S.offline) return;
  try { const { data, error } = await sb.rpc('cash_status', { p_shop: S.shop.id }); if (!error) S.cash = data; } catch (e) {}
}

async function viewCash() {
  $('#view').innerHTML = '<p class="empty">Chargement…</p>';
  await loadCash();
  if (!S.cash) { $('#view').innerHTML = '<div class="banner bad">La caisse demande une connexion internet.</div>'; return; }
  await ensureNames();
  const mgr = isManager(), who = id => esc((S.names && S.names[id]) || '');
  let cur = null, past = [];
  if (mgr) {
    const [c, p] = await Promise.all([sb.rpc('cash_current', { p_shop: S.shop.id }),
      sb.from('cash_sessions').select('*').eq('shop_id', S.shop.id).eq('status', 'closed').order('closed_at', { ascending: false }).limit(10)]);
    cur = c.data || null; past = p.data || [];
  }
  const L = (label, v, strong, neg) => `<div class="row" style="font-size:14.5px"><span>${label}</span><span class="num" style="text-align:right${strong ? ';font-weight:700' : ''}">${neg && v ? '− ' : ''}${money(v)}</span></div>`;
  const hist = mgr ? `<section class="card stack"><h3 style="margin:0">Dernières fermetures</h3>
    ${past.length ? past.map(x => `<div class="row" style="font-size:13.5px;align-items:baseline">
      <span class="muted">${dt(x.closed_at)} · ${who(x.closed_by)}</span>
      <span style="text-align:right">compté ${money(x.counted)}<br><b style="color:${x.gap < 0 ? 'var(--bad)' : x.gap > 0 ? 'inherit' : 'var(--ok, inherit)'}">${x.gap === 0 ? '✓ juste' : (x.gap > 0 ? '+' : '−') + ' ' + money(Math.abs(x.gap))}</b>${x.mobile_money ? `<br><span class="muted">Mobile Money ${money(x.mobile_money)}</span>` : ''}</span></div>`).join('')
      : '<p class="muted" style="margin:0">Aucune fermeture pour le moment.</p>'}</section>` : '';
  if (!S.cash.open) {
    $('#view').innerHTML = `<section class="card stack"><h2>Caisse fermée</h2>
      <p class="muted" style="margin:0">Le matin, comptez la monnaie de départ dans le tiroir, puis ouvrez la caisse.</p>

        ${cur.repayments ? L('Dépôts des clients (dettes et avances)', cur.repayments) : ''}${cur.advance_refunds ? L('Avances rendues', cur.advance_refunds, false, true) : ''}
        ${cur.cash_refunds ? L('Ventes annulées (argent rendu)', cur.cash_refunds, false, true) : ''}${cur.deposits ? L('Dépôts', cur.deposits) : ''}
        ${cur.expenses_cash ? L('Dépenses payées en caisse', cur.expenses_cash, false, true) : ''}${cur.withdrawals ? L('Retraits', cur.withdrawals, false, true) : ''}
        <div class="total"><span>Attendu dans la caisse</span><span class="num">${money(cur.expected)}</span></div>
        ${L('Mobile Money (à vérifier sur le compte)', cur.mobile_money)}</div>` : ''}
      <div class="row"><button class="btn ghost small" id="cs-exp" ${canWrite() ? '' : 'disabled'}>Dépense payée en caisse</button>
        ${mgr ? `<button class="btn ghost small" id="cs-wd" ${canWrite() ? '' : 'disabled'}>Retrait</button><button class="btn ghost small" id="cs-dep" ${canWrite() ? '' : 'disabled'}>Dépôt</button>` : ''}</div>
      <button class="btn" id="cs-close" ${canWrite() ? '' : 'disabled'}>Fermer la caisse (comptage du soir)</button></section>${hist}`;

function cashMoveSheet(kind) {
  const T = { expense: 'Dépense payée en caisse', withdrawal: 'Retrait d\'argent', deposit: 'Dépôt d\'argent (monnaie ajoutée)' }[kind];
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="${esc(T)}">
    <h2>${esc(T)}</h2>
    <label>Montant (FCFA)<input id="m-amt" type="number" inputmode="numeric" min="1" step="1" required></label>
    ${kind === 'expense' ? `<label>Catégorie<select id="m-cat">${Object.entries(EXP).map(([k, v]) => `<option value="${k}" ${k === 'other' ? 'selected' : ''}>${v}</option>`).join('')}</select></label>` : ''}
    <label>Motif (obligatoire)<input id="m-why" maxlength="200" required placeholder="${kind === 'withdrawal' ? 'ex. versé à la banque' : kind === 'deposit' ? 'ex. monnaie apportée' : 'ex. achat de sachets'}"></label>
    <div class="row"><button class="btn" type="submit">Enregistrer</button><button class="btn ghost" type="button" id="cancel">Annuler</button></div></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
    const { error } = await sb.rpc('cash_movement', { p_shop: S.shop.id, p_kind: kind, p_amount: Math.round(Number($('#m-amt').value)),
      p_reason: $('#m-why').value, p_category: kind === 'expense' ? $('#m-cat').value : 'other' });
    if (error) { btn.disabled = false; return toast(cleanErr(error), true); }
    closeSheet(); toast('Enregistré.'); S.summary = null; viewCash();
  };
}

function cashCloseSheet() {
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="Fermer la caisse">
    <h2>Fermer la caisse</h2>
    <p class="muted" style="margin:0;font-size:13.5px">Comptez l'argent du tiroir. Tapez le nombre de billets et de pièces, ou seulement le total.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px">${DENOMS.map(d => `<label style="font-size:13.5px">${plainMoney(d)}<input type="number" inputmode="numeric" min="0" step="1" data-dn="${d}" placeholder="0"></label>`).join('')}</div>
    <label>Total compté (FCFA)<input id="c-total" type="number" inputmode="numeric" min="0" step="5" required></label>
    <label>Remarque (facultatif)<input id="c-note" maxlength="300"></label>
    <div class="row"><button class="btn" type="submit">Fermer la caisse</button><button class="btn ghost" type="button" id="cancel">Annuler</button></div></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  let byDenoms = false;
  const sum = () => {
    let t = 0, any = false;
    document.querySelectorAll('[data-dn]').forEach(i => { const n = Math.round(Number(i.value) || 0); if (i.value !== '') any = true; t += n * Number(i.dataset.dn); });
    byDenoms = any; if (any) $('#c-total').value = t;
  };
  document.querySelectorAll('[data-dn]').forEach(i => i.oninput = sum);
  $('#c-total').oninput = () => { if (byDenoms) { document.querySelectorAll('[data-dn]').forEach(i => { i.value = ''; }); byDenoms = false; } };
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('[type=submit]');
    const total = Math.round(Number($('#c-total').value));
    if (!(total >= 0)) return toast('Total invalide.', true);
    if (!btn.dataset.sure) { btn.dataset.sure = '1'; btn.textContent = `Confirmer : ${plainMoney(total)} FCFA`; return; }
    btn.disabled = true;
    let denoms = null;
    if (byDenoms) { denoms = {}; document.querySelectorAll('[data-dn]').forEach(i => { const n = Math.round(Number(i.value) || 0); if (n) denoms[i.dataset.dn] = n; }); }
    const { data, error } = await sb.rpc('close_cash', { p_shop: S.shop.id, p_counted: total, p_denoms: denoms, p_note: $('#c-note').value || null });
    if (error) { btn.disabled = false; btn.dataset.sure = ''; btn.textContent = 'Fermer la caisse'; return toast(cleanErr(error), true); }
    closeSheet();
    if (data && data.gap !== undefined) {
      toast(data.gap === 0 ? 'Caisse fermée : le compte est juste.' : `Caisse fermée. Écart : ${data.gap > 0 ? '+' : '−'} ${money(Math.abs(data.gap))} (attendu ${money(data.expected)}).`, data.gap < 0);
    } else toast('Caisse fermée. Merci, le propriétaire verra le résultat.');
    await loadAlertCount(); draw();
  };
}

/* ===== Clients, crédit et remboursements =====
   Une vente à crédit exige une fiche client (avec téléphone). Les soldes sont calculés par la base.
   Remboursement : tout membre ; en espèces, il entre dans la caisse du jour. */
const canCredit = () => S.role === 'owner' || S.role === 'manager' || !!(S.shop && S.shop.creditAllowed);

async function loadCustomers(force) {
  if (S.offline) { if (!S.customers) S.customers = (readCache() || {}).customers || []; return S.customers; }
  if (S.customers && !force) return S.customers;
  const { data, error } = await sb.rpc('customer_list', { p_shop: S.shop.id });
  if (error) { toast(cleanErr(error), true); return S.customers || []; }
  S.customers = data || [];
  if (canCredit()) saveCache();      // gardés sur le téléphone pour le crédit hors ligne (clients connus seulement)
  return S.customers;
}

// Lien WhatsApp vers le client : numéro à 8 chiffres = Burkina Faso (+226).
function waNumber(phone) {
  const d = String(phone || '').replace(/[^0-9]/g, '');
  if (!d) return '';
  return String(phone).trim().startsWith('+') ? d : (d.length === 8 ? '226' + d : d);
}

// Choix du client dans le panier (vente à crédit ou client nommé).
async function pickCustomer() {
  const list = await loadCustomers();
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-label="Choisir le client">
    <h2>Choisir le client</h2>
    <input id="pk-q" type="search" placeholder="Nom ou téléphone" autocomplete="off">
    <div class="plist" id="pk-list" style="max-height:45vh;overflow:auto"></div>
    ${!S.offline ? '<button class="btn ghost" id="pk-new">+ Nouveau client</button>' : ''}
    ${S.offline ? '<p class="muted" style="margin:0;font-size:13px">Hors ligne : seulement les clients déjà enregistrés.</p>' : ''}
    <div class="row"><button class="btn ghost" id="pk-none">Sans client</button><button class="btn ghost" id="cancel">Fermer</button></div></div></div>`;
  const draw1 = () => {
    const t = ($('#pk-q').value || '').trim().toLowerCase(), td = t.replace(/[^0-9]/g, '');
    const rows = list.filter(c => c.active !== false && (!t || c.name.toLowerCase().includes(t) || (td && (c.phone || '').includes(td)))).slice(0, 50);
    $('#pk-list').innerHTML = rows.map(c => `<button class="prod" data-pk="${esc(c.id)}"><span><span class="nm">${esc(c.name)}</span><br>
      <span class="sub">${esc(c.phone || 'sans téléphone')}</span></span>${balTag(c.balance)}</button>`).join('')
      || '<p class="empty">Aucun client trouvé.</p>';
    document.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => {
      const c = list.find(x => x.id === b.dataset.pk);
      if (!c.phone) return toast('Ajoutez d\'abord le téléphone de ce client (onglet Clients, Modifier).', true);
      S.custSel = { id: c.id, name: c.name, phone: c.phone, balance: c.balance }; closeSheet(); drawCart();
    });
  };
  draw1();
  $('#pk-q').oninput = draw1;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#pk-none').onclick = () => { S.custSel = null; closeSheet(); drawCart(); };
  const nw = $('#pk-new'); if (nw) nw.onclick = () => customerForm(null, c => { S.custSel = { id: c.id, name: c.name, phone: c.phone, balance: c.balance }; drawCart(); });
}

// Solde d'un client : positif = il doit (rouge) ; négatif = avance qu'on garde pour lui (vert).
function balTag(b) {
  if (b > 0) return `<span class="pr" style="color:var(--bad)">doit ${money(b)}</span>`;
  if (b < 0) return `<span class="pr" style="color:var(--accent)">avance ${money(-b)}</span>`;
  return '<span class="pr">✓</span>';
}
const advOf = c => (c && c.balance < 0 ? -c.balance : 0);

// Nouveau client (ou modification par le propriétaire / gérant).
function customerForm(c, after) {
  const mgr = isManager();
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="Client">
    <h2>${c ? 'Modifier le client' : 'Nouveau client'}</h2>
    <label>Nom<input id="cu-name" maxlength="100" required value="${esc(c ? c.name : '')}"></label>
    <label>Téléphone (obligatoire)<input id="cu-phone" type="tel" inputmode="tel" required placeholder="ex. 70 11 22 33" value="${esc(c ? c.phone || '' : '')}"></label>
    <label>Remarque (facultatif)<input id="cu-note" maxlength="200" value="${esc(c ? c.note || '' : '')}"></label>
    ${mgr ? `<label>Plafond de crédit en FCFA (vide = sans plafond)<input id="cu-limit" type="number" inputmode="numeric" min="0" step="500" value="${esc(c && c.credit_limit != null ? c.credit_limit : '')}"></label>` : ''}
    ${c && mgr ? `<div style="display:flex;align-items:center;gap:10px"><input id="cu-off" type="checkbox" ${c.active === false ? 'checked' : ''} style="width:22px;height:22px;flex:0 0 auto;margin:0"><span style="font-size:14px">Client retiré (n'apparaît plus dans les choix)</span></div>` : ''}
    <div class="row"><button class="btn" type="submit">Enregistrer</button><button class="btn ghost" type="button" id="cancel">Annuler</button></div></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
    const lim = mgr && $('#cu-limit').value !== '' ? Math.round(Number($('#cu-limit').value)) : null;
    const res = c
      ? await sb.rpc('update_customer', { p_customer: c.id, p_name: $('#cu-name').value, p_phone: $('#cu-phone').value,
          p_note: $('#cu-note').value || null, p_limit: lim, p_active: !($('#cu-off') && $('#cu-off').checked) })
      : await sb.rpc('create_customer', { p_shop: S.shop.id, p_name: $('#cu-name').value, p_phone: $('#cu-phone').value,
          p_note: $('#cu-note').value || null, p_limit: lim });
    if (res.error) { btn.disabled = false; return toast(cleanErr(res.error), true); }
    closeSheet(); toast('Client enregistré.');
    const list = await loadCustomers(true);
    const saved = list.find(x => x.id === (c ? c.id : res.data));
    if (after && saved) after(saved);
  };
}

async function viewClients() {
  $('#view').innerHTML = '<p class="empty">Chargement…</p>';
  const list = await loadCustomers(true);
  const debt = list.reduce((a, c) => a + Math.max(0, c.balance), 0);
  const held = list.reduce((a, c) => a + Math.max(0, -c.balance), 0);
  if (!['debt', 'adv', 'all'].includes(S.cFilter)) S.cFilter = 'debt';
  const F = [['debt', 'Ils doivent'], ['adv', 'Avances'], ['all', 'Tous']];
  $('#view').innerHTML = `<section class="card stack">
      <div class="row"><h2 style="flex:1 1 auto">Clients</h2><button class="btn small" id="cl-new" style="flex:0 0 auto" ${canWrite() ? '' : 'disabled'}>Nouveau client</button></div>
      <div class="grid2"><div class="metric"><span>Ils doivent</span><b style="color:${debt ? 'var(--bad)' : 'inherit'}">${money(debt)}</b></div>
        <div class="metric"><span>Avances gardées</span><b style="color:${held ? 'var(--accent)' : 'inherit'}">${money(held)}</b></div></div>
      <input id="cl-q" type="search" placeholder="Nom ou téléphone" autocomplete="off">
      <div class="seg">${F.map(([k, l]) => `<button class="btn small ${S.cFilter === k ? '' : 'ghost'}" data-cf="${k}">${l}</button>`).join('')}</div>
      <div class="plist" id="cl-list"></div></section>`;
  const draw1 = () => {
    const t = ($('#cl-q').value || '').trim().toLowerCase(), td = t.replace(/[^0-9]/g, '');
    const keep = c => S.cFilter === 'all' || (S.cFilter === 'debt' ? c.balance > 0 : c.balance < 0);
    const rows = list.filter(c => keep(c) && (!t || c.name.toLowerCase().includes(t) || (td && (c.phone || '').includes(td))));
    $('#cl-list').innerHTML = rows.map(c => `<button class="prod" data-cl="${esc(c.id)}" style="${c.active === false ? 'opacity:.6' : ''}">
      <span><span class="nm">${esc(c.name)}</span><br><span class="sub">${esc(c.phone || '⚠ téléphone manquant')}${c.credit_limit != null ? ' · plafond ' + money(c.credit_limit) : ''}</span></span>
      ${balTag(c.balance)}</button>`).join('')
      || `<p class="empty">${S.cFilter === 'debt' ? 'Personne ne doit d\'argent.' : S.cFilter === 'adv' ? 'Aucune avance.' : 'Aucun client.'}</p>`;
    document.querySelectorAll('[data-cl]').forEach(b => b.onclick = () => viewStatement(b.dataset.cl));
  };
  draw1();
  $('#cl-q').oninput = draw1;
  document.querySelectorAll('[data-cf]').forEach(b => b.onclick = () => { S.cFilter = b.dataset.cf; viewClients(); });
  $('#cl-new').onclick = () => customerForm(null, () => viewClients());
}

async function viewStatement(id) {
  const { data: st, error } = await sb.rpc('customer_statement', { p_customer: id });
  if (error) return toast(cleanErr(error), true);
  await ensureNames();
  const c = st.customer, mgr = isManager(), b = st.balance;
  // Ventes non payées comptant, dépôts et avances rendues, du plus récent au plus ancien.
  const ev = [
    ...st.sales.filter(s => s.paid < s.total)
      .map(s => ({ at: s.created_at, html: `<div class="row" style="font-size:14px${s.status === 'cancelled' ? ';opacity:.55;text-decoration:line-through' : ''}"><span>${dt(s.created_at)} · Facture ${esc(invNo(s.invoice_no))}<br><span class="muted">total ${money(s.total)}, payé ${money(s.paid)}${s.advance_used ? ', sur l\'avance ' + money(s.advance_used) : ''}</span></span><b style="color:var(--bad)">+ ${money(s.total - s.paid)}</b></div>` })),
    ...st.payments.map(p => ({ at: p.created_at, html: `<div class="row" style="font-size:14px${p.cancelled_at ? ';opacity:.55' : ''}"><span>${dt(p.created_at)} · ${p.kind === 'refund' ? 'avance rendue' : 'dépôt'} ${esc(PAY[p.method] || '')}${p.kind === 'refund' && p.note ? `<br><span class="muted">${esc(p.note)}</span>` : ''}${p.cancelled_at ? `<br><span class="muted">annulé : ${esc(p.cancel_reason || '')}</span>` : ''}</span>
      <span style="text-align:right"><b style="color:${p.kind === 'refund' ? 'var(--bad)' : 'var(--accent)'}">${p.kind === 'refund' ? '+' : '−'} ${money(p.amount)}</b>${mgr && !p.cancelled_at ? `<br><button class="btn ghost small" data-pc="${esc(p.id)}" data-pk="${esc(p.kind)}">Annuler</button>` : ''}</span></div>` }))
  ].sort((x, y) => y.at.localeCompare(x.at));
  const openQ = (st.quotes || []).filter(q => q.status === 'open');
  $('#view').innerHTML = `<section class="card stack">
      <h2>${esc(c.name)}</h2>
      <div class="muted">${c.phone ? `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : '⚠ téléphone manquant'}${c.credit_limit != null ? ' · plafond ' + money(c.credit_limit) : ''}${c.note ? ' · ' + esc(c.note) : ''}</div>
      ${b < 0 ? `<div class="metric"><span>Avance disponible</span><b style="color:var(--accent)">${money(-b)}</b></div>`
              : `<div class="metric"><span>Reste à payer</span><b style="color:${b > 0 ? 'var(--bad)' : 'inherit'}">${money(Math.max(0, b))}</b></div>`}
      <div class="row"><button class="btn" id="st-pay" ${canWrite() ? '' : 'disabled'}>Dépôt d'argent</button>
        ${b > 0 && c.phone ? '<button class="btn ghost" id="st-wa">Rappel WhatsApp</button>' : ''}
        ${b < 0 && mgr ? `<button class="btn ghost" id="st-ref" ${canWrite() ? '' : 'disabled'}>Rendre l'avance</button>` : ''}</div>
      ${openQ.length ? `<div class="stack" style="gap:6px">${openQ.map(q => `<button class="btn ghost small" data-sq="${esc(q.id)}">Devis ${esc(quoteNo(q.quote_no))} · ${money(q.total)} · jusqu'au ${dDay(q.valid_until)}</button>`).join('')}</div>` : ''}
      ${mgr ? '<button class="btn ghost small" id="st-edit">Modifier le client</button>' : ''}
      <button class="btn ghost" id="st-back">Retour aux clients</button></section>
    <section class="card stack"><h3 style="margin:0">Crédits, dépôts et avances</h3>${ev.map(e => e.html).join('') || '<p class="muted" style="margin:0">Rien pour le moment.</p>'}</section>`;
  $('#st-back').onclick = viewClients;
  $('#st-pay').onclick = () => paymentForm(c, b);
  const rf = $('#st-ref'); if (rf) rf.onclick = () => refundForm(c, -b);
  const wa = $('#st-wa');
  if (wa) wa.onclick = () => window.open('https://wa.me/' + waNumber(c.phone) + '?text=' + encodeURIComponent(
    `Bonjour ${c.name}, il reste ${plainMoney(b)} FCFA à régler à ${S.shop.name}. Merci de passer quand vous pourrez.`), '_blank', 'noopener');
  const ed = $('#st-edit'); if (ed) ed.onclick = () => customerForm(c, () => viewStatement(id));
  document.querySelectorAll('[data-sq]').forEach(x => x.onclick = () => quoteSheet(x.dataset.sq));
  document.querySelectorAll('[data-pc]').forEach(x => x.onclick = () => {
    const isRef = x.dataset.pk === 'refund';
    $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet"><h2>${isRef ? 'Annuler l\'avance rendue' : 'Annuler le dépôt'}</h2>
      <p class="muted" style="margin:0">À faire seulement en cas d'erreur de saisie. ${isRef ? 'L\'argent revient dans la caisse' : 'L\'argent ressort de la caisse'} ; le propriétaire est prévenu.</p>

      <div class="row"><button class="btn danger" type="submit">Annuler</button><button class="btn ghost" type="button" id="cancel">Retour</button></div></form></div>`;
    $('#cancel').onclick = closeSheet;
    $('#sheet').onsubmit = async e2 => {
      e2.preventDefault();
      const { error: e3 } = await sb.rpc('cancel_customer_payment', { p_payment: x.dataset.pc, p_reason: $('#pc-why').value });
      if (e3) return toast(cleanErr(e3), true);
      closeSheet(); toast('Annulé.'); S.customers = null; viewStatement(id);
    };
  });
}

  };

  $('#cancel').onclick = closeSheet;

}

// Reçu (dépôt ou avance rendue) : à l'écran, en PDF ou par WhatsApp.
const balLine = b => b > 0 ? `Reste à payer : ${plainMoney(b)} FCFA` : b < 0 ? `Avance disponible : ${plainMoney(-b)} FCFA` : 'Tout est réglé. Merci !';
function receiptText(r) {
  const ref = r.kind === 'refund';
  return [r.shop.name, `Reçu du ${dtFull(r.date)}`, `Client : ${r.customer.name}`,
    ref ? `Avance rendue au client : ${plainMoney(r.amount)} FCFA (${PAY[r.method] || ''})` : `Montant reçu : ${plainMoney(r.amount)} FCFA (${PAY[r.method] || ''})`,
    ...(!ref && r.toDebt && r.toAdv ? [`Dont dette payée : ${plainMoney(r.toDebt)} FCFA, avance : ${plainMoney(r.toAdv)} FCFA`] : []),
    balLine(r.balance), ...(r.shop.footer ? ['', r.shop.footer] : [])].join('\n');
}
function receiptPdf(r) {
  const pdf = newPdf(), L = 40, R = 555, ref = r.kind === 'refund';
  pdf.page();
  pdf.text(L, 62, r.shop.name, { size: 20, bold: true, color: GREEN });
  let y = 80;
  if (r.shop.address) { pdf.text(L, y, r.shop.address, { size: 10, color: GREY }); y += 14; }
  if (r.shop.phone) { pdf.text(L, y, 'Tél. : ' + r.shop.phone, { size: 10, color: GREY }); y += 14; }
  pdf.text(R, 62, 'REÇU', { size: 20, bold: true, align: 'right' });
  pdf.text(R, 80, dtFull(r.date), { size: 10, align: 'right', color: GREY });
  y = Math.max(y, 100) + 4; pdf.line(L, R, y, GREEN, 1.2); y += 26;
  pdf.text(L, y, 'Client : ' + r.customer.name + (r.customer.phone ? '  (' + r.customer.phone + ')' : ''), { size: 11, bold: true }); y += 30;
  pdf.text(L, y, ref ? 'Avance rendue au client' : 'Montant reçu', { size: 12 }); pdf.text(R, y, plainMoney(r.amount) + ' FCFA', { size: 14, bold: true, align: 'right' }); y += 20;
  pdf.text(L, y, 'Paiement : ' + (PAY[r.method] || ''), { size: 10, color: GREY }); y += 20;
  if (!ref && r.toDebt && r.toAdv) {
    pdf.text(L, y, 'Dette payée : ' + plainMoney(r.toDebt) + ' FCFA · Avance : ' + plainMoney(r.toAdv) + ' FCFA', { size: 10 }); y += 20;
  }
  y += 6;
  const owes = r.balance > 0, col = owes ? RED : GREEN;
  pdf.text(L, y, owes ? 'Reste à payer' : r.balance < 0 ? 'Avance disponible' : 'Solde', { size: 12, bold: true, color: col });
  pdf.text(R, y, r.balance ? plainMoney(Math.abs(r.balance)) + ' FCFA' : 'Tout est réglé', { size: 12, bold: true, align: 'right', color: col }); y += 30;
  pdf.text(L, y, (ref ? 'Rendu par : ' : 'Reçu par : ') + (r.who || ''), { size: 10 });
  if (r.shop.footer) pdf.text(pdf.W / 2, 790, r.shop.footer, { size: 10, align: 'center', color: GREY });
  pdf.text(pdf.W / 2, 815, 'Établi avec Bara Gestion', { size: 7.5, align: 'center', color: [0.6, 0.64, 0.61] });
  return pdf.build('Reçu ' + r.customer.name);
}
function receiptSheet(r) {
  const ref = r.kind === 'refund';
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-label="Reçu">
    <h2>${ref ? 'Avance rendue' : 'Dépôt enregistré'}</h2>
    <div class="card" style="display:grid;gap:4px"><div><b>${esc(r.customer.name)}</b></div>
      <div>${ref ? 'Rendu' : 'Reçu'} : <b>${esc(money(r.amount))}</b> (${esc(PAY[r.method] || '')})</div>
      ${!ref && r.toDebt && r.toAdv ? `<div class="muted">Dette payée ${esc(money(r.toDebt))} · avance ${esc(money(r.toAdv))}</div>` : ''}
      <div style="color:${r.balance > 0 ? 'var(--bad)' : r.balance < 0 ? 'var(--accent)' : 'inherit'};font-weight:600">${r.balance > 0 ? 'Reste à payer : ' + esc(money(r.balance)) : r.balance < 0 ? 'Avance disponible : ' + esc(money(-r.balance)) : 'Tout est réglé ✓'}</div></div>
    <div class="row"><button class="btn" id="rc-wa">Envoyer par WhatsApp</button><button class="btn ghost" id="rc-dl">Télécharger le PDF</button></div>
    <button class="btn ghost" id="rc-close">Fermer</button></div></div>`;
  const name = 'Recu-' + r.customer.name.replace(/[^A-Za-z0-9]+/g, '-') + '.pdf';
  $('#rc-close').onclick = () => { closeSheet(); viewStatement(r.customer.id); };
  $('#rc-dl').onclick = () => {
    const url = URL.createObjectURL(new Blob([receiptPdf(r)], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  };
  $('#rc-wa').onclick = async () => {
    try {
      const file = new File([receiptPdf(r)], name, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Reçu' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    window.open('https://wa.me/' + waNumber(r.customer.phone) + '?text=' + encodeURIComponent(receiptText(r)), '_blank', 'noopener');
  };
}

/* ===== Devis =====
   Proposition de prix numérotée (D-0001). Ne touche ni au stock ni à la caisse. Valable 15 jours.
   Transformé en vente (en une ou plusieurs fois) : prix du devis s'il est encore valable. En ligne uniquement. */
const quoteNo = n => 'D-' + String(n).padStart(4, '0');
const dDay = s => { const [y, m, d] = String(s).slice(0, 10).split('-'); return `${d}/${m}/${y}`; };

async function saveQuote(qid) {
  if (S.busy) return;
  if (!S.cart.size) return toast('Ajoutez des produits.', true);
  const sub = cartTotal(), disc = S.disc || 0;
  const dErr = discError(sub, disc); if (dErr) return toast(dErr, true);
  S.busy = true;
  const { data, error } = await sb.rpc('save_quote', { p_shop: S.shop.id,
    p_items: [...S.cart].map(([product_id, quantity]) => ({ product_id, quantity })), p_discount: disc,
    p_customer_id: S.custSel ? S.custSel.id : null, p_quote: qid });
  S.busy = false;
  if (error) return toast(cleanErr(error), true);
  resetSale(); S.editQuote = null; S.quotes = null;
  if (S.tab === 'sale') viewSale();
  toast(`Devis ${quoteNo(data.quote_no)} enregistré : ${money(data.total)}.`);
  quoteSheet(data.id);
}

async function viewQuotes() {
  $('#view').innerHTML = '<p class="empty">Chargement…</p>';
  if (!S.quotes) {
    const { data, error } = await sb.rpc('quote_list', { p_shop: S.shop.id });
    if (error) { $('#view').innerHTML = ''; return toast(cleanErr(error), true); }
    S.quotes = data || [];
  }
  const tag = q => q.status === 'converted' ? '<span class="tag">Livré</span>' : q.status === 'cancelled' ? '<span class="tag bad">Annulé</span>'
    : q.expired ? '<span class="tag warn">Expiré</span>' : q.partial ? '<span class="tag warn">En partie livré</span>' : '<span class="tag">Valable</span>';
  $('#view').innerHTML = `${histSeg()}<section class="stack">
    <p class="muted" style="margin:0;font-size:13.5px">Pour faire un devis : remplissez le panier dans « Vendre », puis « Faire un devis ».</p>
    ${S.quotes.map(q => `<button class="prod" data-q="${esc(q.id)}" style="${q.status !== 'open' ? 'opacity:.65' : ''}">
      <span><span class="nm">${esc(quoteNo(q.quote_no))} · ${esc(q.customer_name || 'sans client')}</span><br>
      <span class="sub">${q.status === 'open' ? 'jusqu\'au ' + dDay(q.valid_until) : dt(q.created_at)} ${tag(q)}</span></span>
      <span class="pr">${money(q.total)}</span></button>`).join('') || '<p class="empty">Aucun devis pour le moment.</p>'}</section>`;
  bindHistSeg();
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => quoteSheet(b.dataset.q));
}

function histSeg() {
  return `<div class="seg" style="margin-bottom:10px"><button class="btn small ${S.histMode === 'quotes' ? 'ghost' : ''}" id="hs-s">Ventes</button>
    <button class="btn small ${S.histMode === 'quotes' ? '' : 'ghost'}" id="hs-q">Devis</button></div>`;
}
function bindHistSeg() {
  const a = $('#hs-s'), b = $('#hs-q');
  if (a) a.onclick = () => { S.histMode = 'sales'; viewHistory(); };
  if (b) b.onclick = () => { S.histMode = 'quotes'; viewQuotes(); };
}

async function quoteSheet(id) {
  const { data: g, error } = await sb.rpc('quote_get', { p_quote: id });
  if (error) return toast(cleanErr(error), true);
  const q = g.quote, open = q.status === 'open', partial = g.lines.some(l => Number(l.qty_taken) > 0);
  const mine = q.created_by === S.user.id || isManager();
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-label="Devis">
    <h2>Devis ${esc(quoteNo(q.quote_no))}</h2>
    ${open && q.expired ? '<div class="banner">Devis expiré : à la vente, les prix du jour seront appliqués.</div>' : ''}
    ${q.status === 'cancelled' ? '<div class="banner bad">Devis annulé.</div>' : q.status === 'converted' ? '<div class="banner ok">Devis entièrement livré.</div>' : ''}
    <div class="card" style="display:grid;gap:4px">
      <div class="muted">${esc(dtFull(q.created_at))}${open ? ' · valable jusqu\'au <b>' + dDay(q.valid_until) + '</b>' : ''}</div>
      ${q.customer_name ? `<div>Client : <b>${esc(q.customer_name)}</b>${q.phone ? ' <span class="muted">' + esc(q.phone) + '</span>' : ''}</div>` : ''}
      <ul style="margin:6px 0 0;padding-left:18px">${g.lines.map(l => `<li>${esc(plainQty(l.quantity))} ${esc(UNITS[l.unit] || '')} ${esc(l.name)} · ${esc(money(l.line_total))}
        ${Number(l.qty_taken) > 0 ? `<span class="muted"> (déjà livré ${esc(plainQty(l.qty_taken))})</span>` : ''}
        ${open && !q.expired && Number(l.current_price) !== Number(l.unit_price) ? `<span class="muted"> · prix du jour ${esc(money(l.current_price))}</span>` : ''}</li>`).join('')}</ul>
      ${q.discount > 0 ? `<div class="muted">Remise : − ${esc(money(q.discount))}</div>` : ''}
      <div class="total" style="margin-top:6px"><span>Total</span><span class="num">${esc(money(q.total))}</span></div>
      ${g.sales.length ? `<div class="muted" style="font-size:13px">Ventes : ${g.sales.map(x => esc(invNo(x.invoice_no))).join(', ')}</div>` : ''}
    </div>
    <div class="row"><button class="btn ghost" id="qt-wa">Envoyer par WhatsApp</button><button class="btn ghost" id="qt-dl">PDF</button></div>
    ${open ? `<button class="btn" id="qt-sell" ${canWrite() ? '' : 'disabled'}>Transformer en vente</button>` : ''}
    ${open && mine ? `<div class="row">${partial ? '' : `<button class="btn ghost small" id="qt-edit" ${canWrite() ? '' : 'disabled'}>Modifier</button>`}
      <button class="btn ghost small" id="qt-cancel" ${canWrite() ? '' : 'disabled'}>Annuler le devis</button></div>` : ''}
    <button class="btn ghost" id="qt-close">Fermer</button></div></div>`;
  const doc = quoteDoc(g);
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#qt-close').onclick = closeSheet;
  $('#qt-dl').onclick = () => downloadInvoice(doc);
  $('#qt-wa').onclick = () => shareInvoice(doc, q.phone);
  const se = $('#qt-sell'); if (se) se.onclick = () => convertSheet(g);
  const ed = $('#qt-edit'); if (ed) ed.onclick = async () => {
    const missing = g.lines.filter(l => !l.active || !S.products.find(p => p.id === l.product_id));
    if (missing.length) return toast('Produit retiré : ' + missing.map(l => l.name).join(', ') + '. Faites un nouveau devis.', true);
    S.cart = new Map(g.lines.map(l => [l.product_id, Number(l.quantity)]));
    S.disc = q.discount || 0;
    S.custSel = null;
    if (q.customer_id) { const c = (await loadCustomers()).find(x => x.id === q.customer_id); if (c) S.custSel = { id: c.id, name: c.name, phone: c.phone, balance: c.balance }; }
    S.editQuote = { id: q.id, no: q.quote_no }; S.payOpen = true;
    closeSheet(); S.tab = 'sale'; draw();
    toast(q.expired ? 'Devis expiré : les prix du jour seront repris et il sera valable 15 jours de plus.' : 'Les prix du devis sont gardés. Modifiez puis enregistrez.');
  };
  const ca = $('#qt-cancel'); if (ca) ca.onclick = async () => {
    if (!ca.dataset.sure) { ca.dataset.sure = '1'; ca.textContent = 'Confirmer l\'annulation'; return; }
    const { error: e2 } = await sb.rpc('cancel_quote', { p_quote: q.id });
    if (e2) return toast(cleanErr(e2), true);
    closeSheet(); toast('Devis annulé.'); S.quotes = null; if (S.tab === 'history') viewQuotes();
  };
}

// Document du devis : même mise en page que la facture.
function quoteDoc(g) {
  const q = g.quote;
  return { kind: 'quote', shop: { name: S.shop.name, phone: S.shop.phone || '', address: S.shop.address || '', footer: S.shop.footer || '' },
    num: quoteNo(q.quote_no), date: q.created_at, valid: q.valid_until, customer: q.customer_name || '', seller: '', pay: '', ref2: '',
    lines: g.lines.map(l => ({ name: l.name, unit: UNITS[l.unit] || '', qty: l.quantity, price: l.unit_price, total: l.line_total })),
    total: q.total, paid: q.total, discount: q.discount || 0, advance: 0 };
}

// Transformer en vente : tout ce qui reste, ou une partie (livraison en plusieurs fois).
async function convertSheet(g) {
  const q = g.quote, ref = uuid();
  const rest = g.lines.filter(l => Number(l.quantity) > Number(l.qty_taken));
  let cust = null;
  if (q.customer_id) cust = (await loadCustomers(true)).find(x => x.id === q.customer_id) || null;
  const adv = advOf(cust);
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="Transformer en vente">
    <h2>Vente du devis ${esc(quoteNo(q.quote_no))}</h2>
    <p class="muted" style="margin:0;font-size:13.5px">${q.expired ? 'Devis expiré : prix du jour.' : 'Prix du devis.'} Le client peut prendre une partie maintenant et le reste plus tard.</p>
    ${rest.map(l => `<label>${esc(l.name)} (reste ${esc(plainQty(Number(l.quantity) - Number(l.qty_taken)))} ${esc(UNITS[l.unit] || '')})
      <input type="number" inputmode="decimal" min="0" step="${WHOLE.includes(l.unit) ? 1 : 0.001}" max="${esc(Number(l.quantity) - Number(l.qty_taken))}"
        value="${esc(Number(l.quantity) - Number(l.qty_taken))}" data-cq="${esc(l.product_id)}"></label>`).join('')}
    <div class="total"><span>Total estimé</span><span class="num" id="cq-total"></span></div>
    ${adv ? `<label style="display:flex;align-items:center;gap:10px;font-size:14.5px"><input id="cq-adv" type="checkbox" checked style="width:22px;height:22px;margin:0">
      Prendre sur l'avance de ${esc(cust.name)} (${money(adv)})</label>` : ''}
    <div class="row"><label>Montant encaissé (FCFA)<input id="cq-paid" type="number" inputmode="numeric" min="0" step="1"></label>
      <label>Paiement<select id="cq-pay">${Object.entries(PAY).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label></div>
    <div class="row"><button class="btn" type="submit">Valider la vente</button><button class="btn ghost" type="button" id="cancel">Retour</button></div></form></div>`;
  const price = l => q.expired ? Number((S.products.find(p => p.id === l.product_id) || {}).sell_price || l.current_price) : Number(l.unit_price);
  const pick = () => [...document.querySelectorAll('[data-cq]')].map(i => ({ product_id: i.dataset.cq, quantity: Number(i.value) || 0 })).filter(x => x.quantity > 0);
  const est = () => {
    const items = pick(), all = items.length === rest.length && items.every(x => { const l = rest.find(r => r.product_id === x.product_id); return x.quantity >= Number(l.quantity) - Number(l.qty_taken); });
    let sub = 0, part = 0;
    items.forEach(x => { const l = g.lines.find(r => r.product_id === x.product_id); sub += Math.round(x.quantity * price(l)); part += Math.round(x.quantity * Number(l.unit_price)); });
    const used = q.discount_used || 0, subQ = q.subtotal || 0;
    const d = all ? q.discount - used : (subQ ? Math.min(Math.floor(q.discount * part / subQ), q.discount - used) : 0);
    return Math.max(0, sub - d);
  };
  const upd = () => {
    const t = est(); $('#cq-total').textContent = money(t);
    const useAdv = $('#cq-adv') && $('#cq-adv').checked;
    $('#cq-paid').value = useAdv ? Math.max(0, t - adv) : t;
  };
  upd();
  document.querySelectorAll('[data-cq]').forEach(i => i.oninput = upd);
  const ca = $('#cq-adv'); if (ca) ca.onchange = upd;
  $('#cancel').onclick = () => quoteSheet(q.id);
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const items = pick();
    if (!items.length) return toast('Choisissez au moins une quantité.', true);
    const t = est(), paid = Math.round(Number($('#cq-paid').value));
    if (!(paid >= 0)) return toast('Montant invalide.', true);
    if (paid < t && !canCredit() && t - paid > adv) return toast(adv ? `Avance insuffisante : il manque ${money(t - paid - adv)}.` : 'Vente à crédit non autorisée pour vous.', true);
    const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
    const all = items.length === rest.length && items.every(x => { const l = rest.find(r => r.product_id === x.product_id); return x.quantity >= Number(l.quantity) - Number(l.qty_taken); });
    const { data, error } = await sb.rpc('convert_quote', { p_quote: q.id, p_items: all ? null : items,
      p_paid: paid >= t ? null : paid, p_payment_method: $('#cq-pay').value, p_client_ref: ref });
    if (error) { btn.disabled = false; return toast(cleanErr(error), true); }
    S.quotes = null; S.sales = null; S.summary = null; S.customers = null;
    await loadProducts();
    toast(`Vente enregistrée : ${money(data.total)}${data.advance_used ? ` (dont ${money(data.advance_used)} pris sur l'avance)` : ''}.`);
    openInvoice(data.sale_id);
  };
}

/* ===== Onglet Historique ===== */

      <div class="row" style="align-items:baseline"><b class="num">${money(s.total)}</b><span class="muted" style="flex:0 0 auto">${esc(invNo(s.invoice_no))}</span>
        <span class="muted" style="text-align:right">${dt(s.created_at)} · ${esc(PAY[s.payment_method])}</span></div>
      ${isManager() ? `<div class="muted">Vendu par ${esc((S.names && S.names[s.created_by]) || 'compte supprimé')}</div>` : ''}
      ${s.discount > 0 ? `<div class="muted">Remise ${money(s.discount)} (prix normal ${money(s.total + s.discount)})</div>` : ''}
      ${s.offline ? `<div class="muted"><span class="tag warn">Hors ligne</span> réf. ${esc(s.offline_ref)}${s.client_created_at ? ' · faite à ' + dt(s.client_created_at) : ' · heure du téléphone inconnue'}</div>` : ''}
      <ul>${(s.sale_items || []).map(i => `<li>${qty(i.quantity)} ${esc(UNITS[i.products?.unit] || '')} ${esc(i.products?.name)} · ${money(i.line_total)}</li>`).join('')}</ul>
      <div>${s.status === 'cancelled' ? `<span class="tag bad">Annulée</span> <span class="muted">${esc(s.cancel_reason)}</span>` : ''}
        ${s.advance_used > 0 ? `<span class="tag">Sur l'avance : ${money(s.advance_used)}</span> ` : ''}
        ${s.status !== 'cancelled' && s.paid + (s.advance_used || 0) < s.total ? `<span class="tag warn">Crédit : reste ${money(s.total - s.paid - (s.advance_used || 0))}</span>` : ''}
        ${s.customer_name && (s.paid < s.total) ? ` <span class="muted">${esc(s.customer_name)}</span>` : ''}</div>
      ${s.status !== 'cancelled' ? `<div class="seg"><button class="btn ghost small" data-inv="${esc(s.id)}">Facture</button>${isManager() ? `<button class="btn ghost small" data-cancel="${esc(s.id)}" ${canWrite() ? '' : 'disabled'}>Annuler cette vente</button>` : ''}</div>` : ''}
    </article>`).join('') || '<p class="empty">Aucune vente pour le moment.</p>'}</section>`;

}

function cancelDialog(id) {

async function viewReport() {

  const to = new Date(day.getTime() + 86400000);
  const days = { today: 1, week: 7, month: 30 }[S.range];
  const from = new Date(to.getTime() - days * 86400000);
  if (!S.summary || S.summary.range !== S.range) {

    if (error) { $('#view').innerHTML = ''; return toast(cleanErr(error), true); }
    S.summary = { range: S.range, d: data };
  }
  const d = S.summary.d;
  const M = (label, v, extra) => `<div class="metric"><span>${label}</span><b>${extra ? v : money(v)}</b></div>`;
  $('#view').innerHTML = `
    <section class="stack"><h2>Bilan</h2>

        `<button class="btn ${S.range === k ? '' : 'ghost'} small" data-range="${k}">${l}</button>`).join('')}</div>
      <div class="grid2">
        ${M('Ventes', d.revenue)}${M('Encaissé', d.collected)}
        ${M('Nombre de ventes', d.sales_count, 1)}${M('Marge brute', d.gross_margin)}
        ${M('Dépenses', d.operating_expenses)}${M('Résultat estimé', d.net_estimate)}
        ${d.discounts != null ? M('Remises accordées', d.discounts) : ''}
        ${d.repayments != null ? M('Dépôts des clients', d.repayments) : ''}${d.credit_outstanding != null ? M('Crédits en cours (total)', d.credit_outstanding) : ''}
        ${d.advances_held != null ? M('Avances gardées (argent des clients)', d.advances_held) : ''}${d.advance_refunds ? M('Avances rendues', d.advance_refunds) : ''}
        ${d.open_quotes != null ? M('Devis en cours', d.open_quotes, 1) : ''}
      </div>
      ${d.low_stock_count > 0 ? `<div class="banner">${d.low_stock_count} produit(s) en stock bas.</div>` : ''}
      <p class="muted" style="font-size:13px">Le résultat est une estimation : marge brute moins dépenses et transport des achats. Les dates suivent l'heure du Burkina Faso (UTC).</p>
    </section>
    <section class="card stack"><h3>Ajouter une dépense</h3>
      <form id="exp" class="stack">
        <div class="row"><label>Catégorie<select id="e-cat">${Object.entries(EXP).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
          <label>Montant (FCFA)<input id="e-amt" type="number" inputmode="numeric" min="1" step="1" required></label></div>
        <label>Description<input id="e-desc" maxlength="200"></label>
        <button class="btn" type="submit" ${canWrite() ? '' : 'disabled'}>Enregistrer la dépense</button></form></section>`;
  document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { S.range = b.dataset.range; viewReport(); });

    ev.preventDefault();

      p_amount: Math.round(Number($('#e-amt').value)), p_description: $('#e-desc').value || null });

/* ===== Onglet Équipe (propriétaire uniquement) =====
   Les comptes sont créés par la fonction sécurisée « manage-team » : la clé secrète
   de Supabase ne quitte jamais le serveur. */
async function callTeam(body) {
  const { data, error } = await sb.functions.invoke('manage-team', { body: { shop_id: S.shop.id, ...body } });
  if (error) {
    let msg = cleanErr(error);
    try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (e) {}
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

function randomPassword() {
  const chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // sans caractères ambigus (0/O, 1/l/I)
  const a = new Uint32Array(10); crypto.getRandomValues(a);
  return [...a].map(n => chars[n % chars.length]).join('');
}

const CP1252 = { 0x20AC:0x80, 0x201A:0x82, 0x0192:0x83, 0x201E:0x84, 0x2026:0x85, 0x2020:0x86, 0x2021:0x87, 0x02C6:0x88,
  0x2030:0x89, 0x0160:0x8A, 0x2039:0x8B, 0x0152:0x8C, 0x017D:0x8E, 0x2018:0x91, 0x2019:0x92, 0x201C:0x93, 0x201D:0x94,
  0x2022:0x95, 0x2013:0x96, 0x2014:0x97, 0x02DC:0x98, 0x2122:0x99, 0x0161:0x9A, 0x203A:0x9B, 0x0153:0x9C, 0x017E:0x9E, 0x0178:0x9F };

function pdfBytes(str) {
  const out = [];
  for (const ch of String(str ?? '').normalize('NFC').replace(/[   ]/g, ' ')) {
    const c = ch.codePointAt(0);
    if (c === 9 || c === 10 || c === 13) out.push(32);
    else if (c >= 32 && c <= 126) out.push(c);
    else if (c >= 160 && c <= 255) out.push(c);
    else if (CP1252[c]) out.push(CP1252[c]);
    else out.push(63);                      // caractère non géré : « ? »
  }
  return out;
}
function pdfStr(bytes) {
  return bytes.map(b => (b === 40 || b === 41 || b === 92) ? '\\' + String.fromCharCode(b) : String.fromCharCode(b)).join('');
}
function pdfWidth(str, bold, size) {
  let w = 0; const t = bold ? HW.b : HW.r;
  for (const b of pdfBytes(str)) w += t[b - 32] || 0;
  return w * size / 1000;
}
function pdfWrap(str, bold, size, maxW) {
  const lines = []; let cur = '';
  for (let w of String(str ?? '').split(/\s+/).filter(Boolean)) {
    while (pdfWidth(w, bold, size) > maxW && w.length > 1) {          // mot plus long que la ligne : on le coupe
      let i = w.length - 1;
      while (i > 1 && pdfWidth(w.slice(0, i), bold, size) > maxW) i--;
      if (cur) { lines.push(cur); cur = ''; }
      lines.push(w.slice(0, i)); w = w.slice(i);
    }
    const t = cur ? cur + ' ' + w : w;
    if (pdfWidth(t, bold, size) <= maxW) cur = t; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

function newPdf() {
  const W = 595, H = 842, pages = [];
  let ops = null;
  const f2 = n => String(Math.round(n * 100) / 100);
  return {
    W, H,
    page() { ops = []; pages.push(ops); },
    text(x, top, s, o = {}) {
      const size = o.size || 10, bold = !!o.bold, color = o.color || [0.1, 0.13, 0.11];
      const w = pdfWidth(s, bold, size);
      const xx = o.align === 'right' ? x - w : o.align === 'center' ? x - w / 2 : x;
      ops.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${color.map(f2).join(' ')} rg ${f2(xx)} ${f2(H - top)} Td (${pdfStr(pdfBytes(s))}) Tj ET`);
    },
    rect(x, top, w, h, color) { ops.push(`${color.map(f2).join(' ')} rg ${f2(x)} ${f2(H - top - h)} ${f2(w)} ${f2(h)} re f`); },
    line(x1, x2, top, color, lw) { ops.push(`${lw || 0.7} w ${(color || [0.8, 0.82, 0.8]).map(f2).join(' ')} RG ${f2(x1)} ${f2(H - top)} m ${f2(x2)} ${f2(H - top)} l S`); },
    build(title) {
      const objs = [];
      objs[0] = '<< /Type /Catalog /Pages 2 0 R >>';
      objs[1] = `<< /Type /Pages /Kids [${pages.map((_, i) => `${5 + i * 2} 0 R`).join(' ')}] /Count ${pages.length} >>`;
      objs[2] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
      objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
      pages.forEach((p, i) => {
        const content = p.join('\n');
        objs[4 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >>`;
        objs[5 + i * 2] = `<< /Length ${content.length} >>\nstream\n${content}\nendstream`;
      });
      const infoNo = objs.length + 1;
      objs.push(`<< /Title (${pdfStr(pdfBytes(title))}) /Producer (Bara Gestion) >>`);
      let out = '%PDF-1.4\n%' + String.fromCharCode(226, 227, 207, 211) + '\n';
      const offs = [];
      objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
      const xref = out.length;
      out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
      out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R /Info ${infoNo} 0 R >>\nstartxref\n${xref}\n%%EOF`;
      const bytes = new Uint8Array(out.length);
      for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
      return bytes;
    }
  };
}

/* ===== Factures ===== */
const plainMoney = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');   // espace ordinaire : lisible partout
const plainQty = n => String(Number(n)).replace('.', ',');
const p2 = n => String(n).padStart(2, '0');
const dtFull = s => { const d = new Date(s); return `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const invNo = n => 'F-' + String(n).padStart(4, '0');
const GREEN = [0.12, 0.42, 0.29], GREY = [0.36, 0.4, 0.37], RED = [0.66, 0.2, 0.12];

function invoicePdf(inv) {
  const pdf = newPdf(), L = 40, R = 555, X_QTY = 372, X_PU = 462, X_AMT = R - 6;
  let top;
  const header = (first) => {
    pdf.page();
    if (first) {
      pdf.text(L, 62, inv.shop.name, { size: 20, bold: true, color: GREEN });
      let y = 80;
      if (inv.shop.address) { pdf.text(L, y, inv.shop.address, { size: 10, color: GREY }); y += 14; }
      if (inv.shop.phone) { pdf.text(L, y, 'Tél. : ' + inv.shop.phone, { size: 10, color: GREY }); y += 14; }
      pdf.text(R, 62, inv.kind === 'quote' ? 'DEVIS' : 'FACTURE', { size: 20, bold: true, align: 'right' });
      pdf.text(R, 80, 'N° ' + inv.num, { size: 11, bold: true, align: 'right' });
      pdf.text(R, 94, dtFull(inv.date), { size: 10, align: 'right', color: GREY });
      if (inv.ref2) pdf.text(R, 108, 'Réf. hors ligne : ' + inv.ref2, { size: 9, align: 'right', color: GREY });
      const ly = Math.max(y, 108) + 4;
      pdf.line(L, R, ly, GREEN, 1.2);
      let iy = ly + 22;
      if (inv.seller) { pdf.text(L, iy, 'Vendeur : ' + inv.seller, { size: 10 }); iy += 15; }
      if (inv.customer) { pdf.text(L, iy, 'Client : ' + inv.customer, { size: 10, bold: true }); iy += 15; }
      if (inv.kind === 'quote') pdf.text(L, iy, 'Valable jusqu\'au ' + dDay(inv.valid) + ' (prix garantis jusqu\'à cette date)', { size: 10, bold: true });
      else pdf.text(L, iy, 'Paiement : ' + inv.pay, { size: 10 });
      top = iy + 26;
    } else {
      pdf.text(L, 50, inv.shop.name + (inv.kind === 'quote' ? ' : devis ' : ' : facture ') + inv.num + ' (suite)', { size: 10, bold: true, color: GREY });
      top = 80;
    }
    pdf.rect(L, top, R - L, 22, [0.92, 0.95, 0.93]);
    pdf.text(L + 8, top + 15, 'Désignation', { size: 9.5, bold: true });
    pdf.text(X_QTY, top + 15, 'Quantité', { size: 9.5, bold: true, align: 'right' });
    pdf.text(X_PU, top + 15, 'Prix unitaire', { size: 9.5, bold: true, align: 'right' });
    pdf.text(X_AMT, top + 15, 'Montant', { size: 9.5, bold: true, align: 'right' });
    top += 22;
  };
  header(true);
  for (const l of inv.lines) {
    const wrapped = pdfWrap(l.name, false, 10, X_QTY - L - 8 - 70);
    const h = wrapped.length * 13 + 9;
    if (top + h > 740) header(false);
    wrapped.forEach((t, i) => pdf.text(L + 8, top + 15 + i * 13, t, { size: 10 }));
    pdf.text(X_QTY, top + 15, plainQty(l.qty) + (l.unit ? ' ' + l.unit : ''), { size: 10, align: 'right' });
    pdf.text(X_PU, top + 15, plainMoney(l.price), { size: 10, align: 'right' });
    pdf.text(X_AMT, top + 15, plainMoney(l.total), { size: 10, align: 'right' });
    top += h;
    pdf.line(L, R, top, [0.86, 0.88, 0.86], 0.6);
  }
  if (top > 660) { header(false); }
  top += 24;
  const credit = inv.paid + (inv.advance || 0) < inv.total;
  if (inv.discount > 0) {
    pdf.text(X_QTY - 20, top, 'Sous-total', { size: 10.5 });
    pdf.text(X_AMT, top, plainMoney(inv.total + inv.discount) + ' FCFA', { size: 10.5, align: 'right' });
    top += 17;
    pdf.text(X_QTY - 20, top, 'Remise', { size: 10.5 });
    pdf.text(X_AMT, top, '- ' + plainMoney(inv.discount) + ' FCFA', { size: 10.5, align: 'right' });
    top += 21;
  }
  pdf.text(X_QTY - 20, top, 'TOTAL', { size: 13, bold: true });
  pdf.text(X_AMT, top, plainMoney(inv.total) + ' FCFA', { size: 13, bold: true, align: 'right' });
  top += 20;
  if (inv.kind === 'quote') {
    pdf.text(L, top + 10, 'Ce devis n\'est pas une facture. Le stock n\'est pas réservé.', { size: 9.5, color: GREY });
  } else {
    pdf.text(X_QTY - 20, top, 'Payé', { size: 10.5 });
    pdf.text(X_AMT, top, plainMoney(inv.paid) + ' FCFA', { size: 10.5, align: 'right' });
    if (inv.advance > 0) {
      top += 17;
      pdf.text(X_QTY - 20, top, 'Pris sur l\'avance', { size: 10.5 });
      pdf.text(X_AMT, top, plainMoney(inv.advance) + ' FCFA', { size: 10.5, align: 'right' });
    }
    if (credit) {
      top += 18;
      pdf.text(X_QTY - 20, top, 'Reste à payer', { size: 11, bold: true, color: RED });
      pdf.text(X_AMT, top, plainMoney(inv.total - inv.paid - (inv.advance || 0)) + ' FCFA', { size: 11, bold: true, align: 'right', color: RED });
    }
  }
  if (inv.shop.footer) pdf.text(pdf.W / 2, 790, inv.shop.footer, { size: 10, align: 'center', color: GREY });
  pdf.text(pdf.W / 2, 815, 'Établi avec Bara Gestion', { size: 7.5, align: 'center', color: [0.6, 0.64, 0.61] });
  return pdf.build((inv.kind === 'quote' ? 'Devis ' : 'Facture ') + inv.num);
}

function invoiceText(inv) {
  const rows = inv.lines.map(l => `- ${plainQty(l.qty)}${l.unit ? ' ' + l.unit : ''} ${l.name} : ${plainMoney(l.total)} FCFA`);
  const q = inv.kind === 'quote', rest = inv.total - inv.paid - (inv.advance || 0);
  return [`${inv.shop.name}`, `${q ? 'Devis' : 'Facture'} ${inv.num} du ${dtFull(inv.date)}`, ...(inv.ref2 ? [`Réf. hors ligne : ${inv.ref2}`] : []), ...rows, ...(inv.discount > 0 ? [`Remise : -${plainMoney(inv.discount)} FCFA`] : []), `Total : ${plainMoney(inv.total)} FCFA`,
    ...(q ? [`Valable jusqu'au ${dDay(inv.valid)}`] : []),
    ...(!q && inv.advance > 0 ? [`Pris sur l'avance : ${plainMoney(inv.advance)} FCFA`] : []),
    ...(!q && rest > 0 ? [`Reste à payer : ${plainMoney(rest)} FCFA`] : []),
    ...(inv.shop.footer ? ['', inv.shop.footer] : [])].join('\n');
}
