<!doctype html>
<!-- Bara Gestion version 2026-10-25g : crédit et clients -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bara Gestion">

<link rel="apple-touch-icon" href="icon-192.png">
<title>Bara Gestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Disposition : application mobile d'abord, en-tête fixe, contenu au centre, barre d'onglets en bas. */
:root{
  --bg:#f1f3f0; --surface:#ffffff; --fg:#1b221e; --muted:#5b665f; --line:#d9dfd8;
  --accent:#1f6b4a; --accent-ink:#ffffff; --accent-soft:#e1efe8;
  --warn:#8a5a00; --warn-soft:#faf0d6; --bad:#a8321f; --bad-soft:#fbe5e0;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a211e; --fg:#e8ece9; --muted:#9aa59e; --line:#2b3530;
  --accent:#4cc38a; --accent-ink:#06281a; --accent-soft:#1b3a2d;
  --warn:#e6b450; --warn-soft:#3a2f12; --bad:#ff8a73; --bad-soft:#3d1d17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a211e; --fg:#e8ece9; --muted:#9aa59e; --line:#2b3530;
  --accent:#4cc38a; --accent-ink:#06281a; --accent-soft:#1b3a2d;
  --warn:#e6b450; --warn-soft:#3a2f12; --bad:#ff8a73; --bad-soft:#3d1d17; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 84px;min-height:100vh}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Connexion */
.login{max-width:380px;margin:0 auto;padding-block:12vh 24px;display:grid;gap:18px}
.brand{font:700 30px/1.1 var(--f-display);letter-spacing:-.01em}
.brand small{display:block;font:400 14px var(--f-body);color:var(--muted);margin-top:6px;letter-spacing:0}

/* Champs et boutons */
label{display:grid;gap:5px;font-weight:500;font-size:13px;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;min-width:0;color:var(--fg)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{padding:7px 11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 140px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stack{display:grid;gap:12px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 6px;border-bottom:1px solid var(--line);margin-inline:-2px;padding-inline:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shopname{font:700 17px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.paying .tabs{display:none}
.who{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{margin-top:8px;border-radius:8px;padding:8px 11px;font-size:13.5px;background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.ok{background:var(--accent-soft);color:var(--accent)}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;min-width:0;background:none;border:0;padding:10px 2px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
.tabs button .ic{font-size:17px;line-height:1}
.tabs.many button{font-size:11px;padding:7px 0;letter-spacing:-.2px}
@media (max-width:375px){.tabs.many button{font-size:10px;letter-spacing:-.3px}}

/* Contenu */
main{padding-block:16px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sectitle{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.plist{display:grid;gap:8px}
.prod{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
button.prod{cursor:pointer}
button.prod:hover{border-color:var(--accent)}
.prod .nm{font-weight:600;overflow-wrap:anywhere}
.prod .sub{font-size:12.5px;color:var(--muted)}
.prod .pr{text-align:right;white-space:nowrap;font-weight:600}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.cartline{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.cartline:last-child{border-bottom:0}
.cartline input{padding:8px}
.total{display:flex;justify-content:space-between;align-items:baseline;font:700 22px var(--f-display)}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.metric b{display:block;font:700 20px var(--f-display);margin-top:2px;font-variant-numeric:tabular-nums}
.metric span{font-size:12.5px;color:var(--muted)}
.sale{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.sale.cancelled{opacity:.65}
.sale ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:0 0 auto}
.empty{text-align:center;color:var(--muted);padding:24px 8px}

/* Fenêtre de saisie */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:90vh;overflow:auto;display:grid;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:92vw;font-weight:500;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

/* Code d'accès */
#lock-host{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto}
#lock-host:focus{outline:none}
.lock{max-width:340px;margin:0 auto;min-height:100%;padding:max(32px,env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:center;text-align:center}
.lock .dots{display:flex;justify-content:center;gap:14px;height:22px}
.lock .dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
.lock .dots span.on{background:var(--accent)}
.lock .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lock .pad button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:700 26px var(--f-display);cursor:pointer}
.lock .pad button:active{background:var(--accent-soft)}
.lock .msg{min-height:22px;font-weight:600}
.lock .msg.bad{color:var(--bad)}

/* Vente simplifiée : tuiles, barre du panier, paiement */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;height:38px;padding:0 15px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;gap:5px;text-align:center;cursor:pointer;min-width:0}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile.in{outline:3px solid var(--accent);outline-offset:-1px}
.tile .ini{height:58px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:800 22px var(--f-display)}
.tile .tn{font-weight:600;font-size:13.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:32px;overflow-wrap:anywhere}
.tile .tp{font:700 16px var(--f-display);font-variant-numeric:tabular-nums}
.tile .tq{position:absolute;top:4px;right:4px;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:800 14px var(--f-body);display:flex;align-items:center;justify-content:center}
.tile .ts{font-size:11.5px;color:var(--bad);font-weight:600}
.cartbar{position:fixed;left:0;right:0;z-index:6;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--bg)}
.cartbar button{width:100%;max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);padding:0 20px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.cartbar .ct{display:grid;text-align:left;line-height:1.15}
.cartbar .ct small{font-size:12.5px;opacity:.85}
.cartbar .ct b{font:800 24px var(--f-display);font-variant-numeric:tabular-nums}
.cartbar .go{font:700 20px var(--f-display)}
.pline{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.pline .nm{font-weight:600;overflow-wrap:anywhere}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:700 22px var(--f-body);cursor:pointer}
.step input{width:64px;text-align:center;padding:8px 4px;font-weight:700;font-size:17px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.modes button{height:76px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:14.5px;cursor:pointer}
.modes button .mi{font-size:24px;line-height:1}
.modes button[aria-pressed="true"]{border:3px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.bigtotal{font:800 38px/1.1 var(--f-display);font-variant-numeric:tabular-nums;text-align:center}
.change{display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:12px 16px;background:var(--warn-soft);color:var(--warn);font-weight:700}
.change b{font:800 26px var(--f-display);font-variant-numeric:tabular-nums}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{flex:1 1 0;min-width:0;height:44px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:pointer}
.btn.huge{height:64px;font:700 21px var(--f-display);border-radius:18px;width:100%}

/* Accueil, Plus, cloche */
.bellb{position:relative;flex:0 0 auto;font-size:18px;padding:6px 12px;margin-right:6px}
.bellb .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font:700 11.5px var(--f-body);display:flex;align-items:center;justify-content:center}
.hero{border-radius:20px;padding:18px;background:var(--accent);color:var(--accent-ink)}
.hero-n{font:800 36px/1.1 var(--f-display);margin-top:2px;font-variant-numeric:tabular-nums}
.hero-s{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.htiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.htile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:6px;text-align:left;cursor:pointer}
.htile .hic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px}
.htile .hl{font:700 19px var(--f-display)}
.htile .hbadge{position:absolute;top:12px;right:12px;border-radius:10px;padding:3px 8px;font-size:12.5px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.htile .hbadge.warn{background:var(--warn-soft);color:var(--warn)}
.htile .hbadge.bad{background:var(--bad-soft);color:var(--bad)}
.arow{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;border:1px solid var(--line);border-left:5px solid var(--line)}
.arow.bad{border-left-color:var(--bad)}
.arow.warn{border-left-color:var(--warn)}
.arow .aic{font-size:22px;line-height:1.2}
</style>

</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast-host"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Connexion à la base (clé publique « publishable » : la sécurité repose sur les règles RLS) ===== */
const SB_URL = 'https://uqnucmgsgkwalxodqmjr.supabase.co';
const SB_KEY = 'sb_publishable_3vrJsQkSN2QlL_MMwBPGgQ_rC-IvhNo';

const mem = {};
const storage = {
  getItem: k => { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
  setItem: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  removeItem: k => { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
};
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { storage, persistSession: true, autoRefreshToken: true } });

/* Sortie fiable : si la connexion a déjà été fermée côté serveur, signOut() peut échouer
   sans rien effacer. On efface donc nous-mêmes la session gardée dans le navigateur. */
const KICK_MSG = 'Votre connexion a été fermée (nouveau mot de passe, ou connexion sur un autre appareil). Reconnectez-vous.';
async function leave(msg) {
  try { await Promise.race([sb.auth.signOut({ scope: 'local' }), new Promise(r => setTimeout(r, 4000))]); } catch (e) {}
  try { Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  Object.keys(mem).filter(k => k.startsWith('sb-')).forEach(k => delete mem[k]);
  clearCache(); dropLock(); S.pwOk = false;
  S.user = null; S.kick = null; S.offline = false;
  drawLogin(msg || null);
}

/* ===== Utilitaires ===== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 3 });
const money = n => fmtNum.format(Number(n) || 0) + ' FCFA';
const qty = n => fmtNum.format(Number(n) || 0);
const UNITS = { piece:'pièce', sac:'sac', kilo:'kilo', litre:'litre', carton:'carton', metre:'mètre', barre:'barre', seau:'seau', paire:'paire' };
const WHOLE = ['piece','sac','carton','barre','seau','paire'];
const PAY = { cash:'Espèces', mobile_money:'Mobile money', other:'Autre' };
const ROLES = { owner:'Propriétaire', manager:'Gérant', seller:'Vendeur' };
const APP_VERSION = '2026-10-26i';   // à changer à chaque nouvelle version déposée sur GitHub
const LOGIN_DOMAIN = 'bg-users.example.com';   // même valeur que dans la fonction « manage-team »
const EXP = { rent:'Loyer', electricity:'Électricité', transport:'Transport', other:'Autre' };
const dt = s => new Date(s).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
const cleanErr = e => {
  const m = (e && e.message) || 'Erreur inconnue';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Pas de connexion. Vérifiez internet puis réessayez.';
  if (/Invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  return m;
};
function toast(msg, err) {
  if (err && /Accès refusé/.test(msg || '')) setTimeout(checkSession, 0);
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.setAttribute('role', 'status');
  el.textContent = msg;
  $('#toast-host').appendChild(el);
  setTimeout(() => el.remove(), err ? 6000 : 3200);
}

/* ===== État ===== */
const S = {
  user: null, memberships: [], shop: null, role: null, sub: null,
  products: [], costs: {}, tab: 'sale',
  q: '', cart: new Map(), ref: uuid(), busy: false,
  sales: null, summary: null, range: 'today', sheet: null, team: null, last: null, names: null, kick: null, checking: false, offline: false, cachedAt: 0, syncing: false, customers: null, custSel: null, creditMap: null, cash: null, count: null, countPending: false, disc: 0, discMap: null, alertCount: 0, alerts: null, devices: null, offAllowed: null
};
const isManager = () => S.role === 'owner' || S.role === 'manager';
const canWrite = () => S.sub && ['trial','active','grace'].includes(S.sub.status);

/* ===== Copie locale du catalogue (hors ligne, étape 2) =====
   Gardée sur le téléphone : produits, prix de vente et stock. JAMAIS les prix d'achat, l'équipe
   ni les ventes. Liée à la personne connectée, effacée à la déconnexion, périmée après 3 jours. */
const CACHE_KEY = 'bg_offline_v1';
const CACHE_MAX_MS = 3 * 24 * 3600 * 1000;
function saveCache() {
  try {
    if (!S.user || !S.shop || S.offline) return;
    storage.setItem(CACHE_KEY, JSON.stringify({
      v: 1, savedAt: Date.now(), userId: S.user.id, role: S.role,
      shop: { id: S.shop.id, name: S.shop.name, type: S.shop.type, who: S.shop.who,
              phone: S.shop.phone, address: S.shop.address, footer: S.shop.footer,
              offAllowed: !!S.shop.offAllowed, maxPending: S.shop.maxPending || 30, discMax: S.shop.discMax || 0,
              creditAllowed: !!S.shop.creditAllowed, lockSec: lockSec(), bioAllowed: bioAllowed() },
      // Clients (nom, téléphone) gardés seulement pour ceux qui peuvent vendre à crédit, pour le crédit hors ligne.
      customers: canCredit() && S.customers ? S.customers.filter(c => c.active !== false && c.phone)
        .map(c => ({ id: c.id, name: c.name, phone: c.phone, balance: c.balance, active: true })) : [],
      products: S.products.map(p => ({ id: p.id, name: p.name, category: p.category, unit: p.unit,
        sell_price: p.sell_price, stock_qty: p.stock_qty, alert_threshold: p.alert_threshold, barcode: p.barcode }))
    }));
  } catch (e) {}
}
function readCache() {
  try {
    const c = JSON.parse(storage.getItem(CACHE_KEY) || 'null');
    if (!c || c.v !== 1 || typeof c.userId !== 'string' || !c.shop || !Array.isArray(c.products)) return null;
    const age = Date.now() - Number(c.savedAt);
    if (!(age >= -300000 && age <= CACHE_MAX_MS)) return null;      // trop ancienne (ou horloge truquée)
    if (!['owner', 'manager', 'seller'].includes(c.role)) return null;
    return c;
  } catch (e) { return null; }
}
function clearCache() { try { storage.removeItem(CACHE_KEY); } catch (e) {} }
function hasStoredSession() {
  try { return Object.keys(localStorage).some(k => k.startsWith('sb-') && k.endsWith('-auth-token')); } catch (e) { return false; }
}
const isNetErr = e => !navigator.onLine || /Failed to fetch|NetworkError|Load failed/i.test((e && e.message) || '');

function startOffline(c) {
  S.offline = true; S.user = { id: c.userId }; S.role = c.role; S.shop = { ...c.shop };
  S.memberships = [{ shop_id: c.shop.id, role: c.role, display_name: c.shop.who, shops: { name: c.shop.name } }];
  S.products = c.products; S.costs = {}; S.sub = { status: 'offline' }; S.cachedAt = c.savedAt;
  S.cart = new Map(); S.ref = uuid(); S.last = null; S.editQuote = null; S.quotes = null; S.sales = null; S.summary = null; S.team = null; S.tab = 'sale';
  gate();
  draw();
  // Le signal « réseau revenu » arrive parfois avant que la connexion soit utilisable : on réessaie.
  clearTimeout(S.retry);
  S.retry = setTimeout(() => { if (S.offline && navigator.onLine) resume(); }, 8000);
}
async function resume() {            // le réseau est revenu
  S.offline = false;
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
  if (session) { S.user = session.user; await loadContext(); return; }
  // Pas de session lisible : réseau pas encore stable, ou connexion vraiment fermée ?
  // Si la session est toujours gardée sur le téléphone, on reste hors ligne et on réessaie.
  const c = readCache();
  if (c && hasStoredSession()) return startOffline(c);
  S.user = null; clearCache(); drawLogin();
}
window.addEventListener('online', () => { if (S.offline) resume(); });

/* ===== Ventes hors ligne (étape 3) =====
   Une vente faite sans réseau est gardée dans le téléphone (file d'attente), avec :
   - une référence unique et permanente (H-<code du téléphone>-<numéro>), celle du reçu du client ;
   - le prix affiché au moment de la vente et l'heure du téléphone.
   Elle n'est retirée de la file qu'APRÈS confirmation par le serveur. Un envoi répété est
   reconnu par le serveur (même référence) : jamais de vente comptée deux fois. */
const QUEUE_KEY = 'bg_queue_v1', DEVICE_KEY = 'bg_device', SEQ_KEY = 'bg_offseq';

function deviceId() {
  try {
    let d = localStorage.getItem(DEVICE_KEY);
    if (!d || !/^[0-9a-f-]{36}$/i.test(d)) { d = uuid(); localStorage.setItem(DEVICE_KEY, d); }
    return d;
  } catch (e) { return null; }                    // mémoire inaccessible : pas de vente hors ligne
}
const deviceCode = d => d.replace(/-/g, '').slice(0, 6).toUpperCase();

function readQueue() {
  try { const q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); return Array.isArray(q) ? q : []; }
  catch (e) { return []; }
}
// Écriture vérifiée : si le téléphone n'a pas pu enregistrer, on le sait (et on le dit).
function writeQueue(q) {
  localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
  if (localStorage.getItem(QUEUE_KEY) !== JSON.stringify(q)) throw new Error('écriture non confirmée');
}
const myQueue = () => S.user && S.shop ? readQueue().filter(r => r.user_id === S.user.id && r.shop_id === S.shop.id) : [];
const pendingMine = () => S.user ? readQueue().filter(r => r.user_id === S.user.id).length : 0;
const offlineRight = () => !!S.shop && (S.role === 'owner' || !!S.shop.offAllowed);
const canSellOffline = () => S.offline && offlineRight();

function nextRef(dev) {
  let n = 0;
  try { n = Number(localStorage.getItem(SEQ_KEY)) || 0; } catch (e) {}
  n += 1;
  localStorage.setItem(SEQ_KEY, String(n));       // gardé AVANT la vente : une référence n'est jamais réutilisée
  return `H-${deviceCode(dev)}-${String(n).padStart(4, '0')}`;
}

function queueSale(total, paid, pay, customer, disc = 0) {
  const dev = deviceId();
  if (!dev) { toast('Ce téléphone ne permet pas de garder des ventes hors ligne (mémoire bloquée).', true); return drawCart(); }
  if (pendingMine() >= (S.shop.maxPending || 30)) {
    toast(`Plafond atteint : ${S.shop.maxPending || 30} ventes attendent déjà. Retrouvez du réseau pour les envoyer.`, true);
    return drawCart();
  }
  for (const [id, q] of S.cart) {
    const p = S.products.find(x => x.id === id);
    if (!p || !(q > 0) || q > 1000000 || Math.round(q * 1000) !== q * 1000 || (WHOLE.includes(p.unit) && !Number.isInteger(q))) {
      toast('Quantité invalide' + (p ? ' pour ' + p.name : '') + (p && WHOLE.includes(p.unit) ? ' (nombre entier)' : ''), true);
      return drawCart();
    }
  }

  if (paid < 0 || paid > total || !Number.isFinite(paid)) { toast('Le montant encaissé doit être compris entre 0 et le total.', true); return drawCart(); }
  if (paid < total && !customer) { toast('Vente à crédit : choisissez le client.', true); return drawCart(); }
  const items = [...S.cart].map(([id, q]) => {
    const p = S.products.find(x => x.id === id);
    return { product_id: id, quantity: q, unit_price: Number(p.sell_price), name: p.name, unit: p.unit };
  });
  let rec;
  try {
    rec = { client_ref: S.ref, offline_ref: nextRef(dev), device_id: dev, shop_id: S.shop.id, user_id: S.user.id,
      seller: S.shop.who, created_at: new Date().toISOString(), items, total, paid, discount: disc, payment_method: pay,
      customer: customer ? customer.name : null, customer_id: customer ? customer.id : null };
    const q = readQueue();
    if (!q.some(r => r.client_ref === rec.client_ref)) q.push(rec);
    writeQueue(q);
  } catch (e) {
    toast('Vente NON enregistrée : la mémoire du téléphone est pleine ou bloquée. Notez-la sur papier.', true);
    return drawCart();
  }
  // Stock affiché : on le baisse aussi sur le téléphone (la vraie valeur viendra du serveur).
  items.forEach(i => { const p = S.products.find(x => x.id === i.product_id); if (p) p.stock_qty = Number(p.stock_qty) - i.quantity; });
  try {
    const c = JSON.parse(storage.getItem(CACHE_KEY) || 'null');
    if (c && c.userId === S.user.id) { c.products = S.products.map(p => ({ ...p })); storage.setItem(CACHE_KEY, JSON.stringify(c)); }
  } catch (e) {}
  resetSale(); S.last = { rec, total, change: S.pendingChange || 0 }; S.pendingChange = 0;
  toast('Vente gardée sur le téléphone : ' + money(total) + ' (réf. ' + rec.offline_ref + ')');
  draw();
  syncQueue();
}

// Vente de la file → même forme qu'une vente du serveur (pour le reçu).
function recToSale(r) {
  return { invoice_no: null, offline_ref: r.offline_ref, created_at: r.created_at, client_created_at: r.created_at,
    created_by: r.user_id, customer_name: r.customer, payment_method: r.payment_method, total: r.total, paid: r.paid, discount: r.discount || 0,
    sale_items: r.items.map(i => ({ quantity: i.quantity, unit_price: i.unit_price,
      line_total: Math.round(i.quantity * i.unit_price), products: { name: i.name, unit: i.unit } })) };
}

// Envoi de la file : dans l'ordre, une vente à la fois, retirée seulement après confirmation.
async function syncQueue(manual) {
  if (S.syncing || S.offline || !S.user || !S.shop || !navigator.onLine) return;
  const mine = myQueue();
  if (!mine.length) return;
  S.syncing = true;
  let sent = 0, stop = false, changed = false;
  for (const r of mine) {
    if (stop) break;
    const { data, error } = await sb.rpc('sync_offline_sale', {
      p_shop: r.shop_id, p_device: r.device_id, p_offline_ref: r.offline_ref, p_client_ref: r.client_ref,
      p_created_at: r.created_at, p_items: r.items.map(i => ({ product_id: i.product_id, quantity: i.quantity, unit_price: i.unit_price })),
      p_paid: r.paid, p_payment_method: r.payment_method, p_customer: r.customer_id ? null : r.customer,
      ...(r.discount ? { p_discount: r.discount } : {}), ...(r.customer_id ? { p_customer_id: r.customer_id } : {}) });
    const q = readQueue();
    if (!error && data && data.sale_id) {
      try { writeQueue(q.filter(x => x.client_ref !== r.client_ref)); } catch (e) { stop = true; }
      if (S.last && S.last.rec && S.last.rec.client_ref === r.client_ref) S.last = { id: data.sale_id, total: r.total };
      sent++;
    } else {
      if (isNetErr(error)) { stop = true; break; }    // réseau encore instable : on réessaiera
      const msg = cleanErr(error);
      if (r.error !== msg) { changed = true; try { writeQueue(q.map(x => x.client_ref === r.client_ref ? { ...x, error: msg } : x)); } catch (e) {} }
      if (/Accès refusé|lecture seule|Droits/i.test(msg)) stop = true;   // inutile d'insister pour les autres
    }
  }
  S.syncing = false;
  if (sent) {
    toast(sent === 1 ? '1 vente hors ligne envoyée.' : `${sent} ventes hors ligne envoyées.`);
    S.sales = null; S.summary = null;
    await loadProducts();
  } else if (manual) {
    toast(myQueue().length ? 'Envoi impossible pour le moment.' : 'Rien à envoyer.', !!myQueue().length);
  }
  registerDevice();
  // On rafraîchit l'écran seulement si quelque chose a changé, et jamais au milieu d'une vente.
  if ((sent || changed) && !S.offline && $('#view') && !(S.tab === 'sale' && S.cart.size)) draw();
}

// Le téléphone se présente au serveur (identité + nombre de ventes en attente).
async function registerDevice() {
  const dev = deviceId();
  if (!dev || S.offline || !S.shop) return;
  try {
    const { error } = await sb.rpc('register_device', { p_shop: S.shop.id, p_device: dev, p_pending: pendingMine() });
    if (error && /en double/.test(error.message || '')) toast(error.message, true);
  } catch (e) {}
}

// Propriétaire : nouvelles alertes vérifiées toutes les 30 s (le nombre s'affiche sur l'onglet Équipe).
async function refreshAlerts() {
  if (S.role !== 'owner' || S.offline || !S.shop) return;

  await loadAlertCount();
  if (S.alertCount !== before) {

    const b = document.getElementById('bell');
    if (b) b.innerHTML = '🔔' + (S.alertCount ? `<span class="badge">${S.alertCount > 99 ? '99+' : S.alertCount}</span>` : '');
    if (S.alertCount > before) toast('🔔 Nouvelle alerte : touchez la cloche en haut.');
  }
}
async function loadAlertCount() {

  try {
    const { count } = await sb.from('alerts').select('id', { count: 'exact', head: true }).eq('shop_id', S.shop.id).is('seen_at', null);

function pendingBanner() {
  const n = myQueue().length;
  const others = S.user ? readQueue().filter(r => r.user_id !== S.user.id).length : 0;

    const err = myQueue().find(r => r.error);
    h += `<div class="banner ${err ? 'bad' : ''}">${n} vente(s) en attente d'envoi sur ce téléphone.${err ? ' Dernier refus : ' + esc(err.error) : ''}</div>`;
  }
  if (others) h += `<div class="banner">${others} vente(s) d'un autre compte attendent sur ce téléphone : cette personne doit se reconnecter ici pour les envoyer.</div>`;

}

/* ===== Code d'accès (PIN) et empreinte digitale =====
   - Code de 4 à 6 chiffres, OBLIGATOIRE, demandé à chaque ouverture de l'application et après
     1 minute sans utilisation (ou 30 secondes, au choix du propriétaire).
   - Le code ne quitte jamais le téléphone : on n'y garde que son empreinte brouillée (PBKDF2,
     150 000 tours, sel au hasard). Il marche donc aussi hors ligne.
   - 5 codes faux de suite : déconnexion complète (le mot de passe sera demandé). Les ventes
     hors ligne non envoyées restent dans le téléphone.
   - Code oublié : « Se reconnecter avec le mot de passe », puis on choisit un nouveau code.
   - Chaque compte garde SON code sur ce téléphone, même après « Quitter » : en se reconnectant
     avec le mot de passe, on retrouve son code et son empreinte. Le code n'est effacé qu'après
     « code oublié » ou 5 codes faux.
   - Empreinte digitale : en option, si le propriétaire la permet. Elle passe par le lecteur du
     téléphone (WebAuthn) : l'empreinte elle-même ne quitte jamais le téléphone. Elle est demandée
     dès que l'écran de verrouillage s'affiche ; une fois par semaine, c'est le code qui est demandé.
   Limite honnête : c'est un verrou d'écran contre une personne qui prend le téléphone ; il ne
   remplace pas le mot de passe ni les contrôles faits par la base. */
const PIN_KEY = 'bg_pin_v2', PIN_ITER = 150000, PIN_MAX_FAILS = 5, PIN_WEEK_MS = 7 * 24 * 3600 * 1000;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
// Un code par compte : { idDuCompte: { salt, hash, it, fails, bio } }.
function pinAll() {
  try {
    const m = JSON.parse(storage.getItem(PIN_KEY) || 'null');
    if (m && typeof m === 'object' && !Array.isArray(m)) return m;
    const old = JSON.parse(storage.getItem('bg_pin_v1') || 'null');      // ancienne version : un seul code
    return old && old.u ? { [old.u]: old } : {};
  } catch (e) { return {}; }
}
function pinRec() {
  if (!S.user) return null;
  const r = pinAll()[S.user.id];
  return r && r.salt && r.hash ? { ...r, u: S.user.id } : null;
}
const savePinRec = r => { const m = pinAll(); m[r.u] = r; storage.setItem(PIN_KEY, JSON.stringify(m)); storage.removeItem('bg_pin_v1'); };
const clearPin = () => { if (!S.user) return; const m = pinAll(); delete m[S.user.id]; storage.setItem(PIN_KEY, JSON.stringify(m)); storage.removeItem('bg_pin_v1'); };
async function pinHash(pin, salt, iter) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(salt), iterations: iter }, key, 256));
}
// Codes trop faciles à deviner : tous les chiffres pareils, ou une suite (1234, 9876…).
function weakPin(p) {
  if (/^(\d)\1+$/.test(p)) return true;
  const up = '01234567890', down = '09876543210';
  return up.includes(p) || down.includes(p);
}
// Verrouillage : 30 secondes ou 1 minute (jamais plus, décidé avec le propriétaire du projet).
const lockSec = () => (S.shop && Number(S.shop.lockSec) === 30 ? 30 : 60);
const lockLabel = () => lockSec() === 30 ? '30 secondes' : '1 minute';
const bioAllowed = () => !(S.shop && S.shop.bioAllowed === false);
async function bioAvailable() {
  try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
  catch (e) { return false; }
}

// Appelé quand l'application est prête (ouverture, connexion, hors ligne) : rien n'est visible
// tant que le code n'a pas été donné ou créé.
function gate() {
  if (S.unlocked) return;
  if (pinRec()) return lock();
  // Pas encore de code pour ce compte sur ce téléphone : on ne le crée JAMAIS sans le mot de passe
  // (sinon quelqu'un qui prend un téléphone déjà connecté pourrait choisir son propre code).
  if (S.pwOk) return pinSetup(false);
  lockHost(); leave('Pour votre sécurité, reconnectez-vous avec votre mot de passe, puis créez votre code d\'accès.');
}
function lockHost() {
  let h = document.getElementById('lock-host');
  if (!h) { h = document.createElement('div'); h.id = 'lock-host'; h.setAttribute('role', 'dialog'); h.setAttribute('aria-modal', 'true'); document.body.appendChild(h); }
  $('#app').inert = true; $('#app').setAttribute('aria-hidden', 'true');
  return h;
}
function unlockDone() {
  S.unlocked = true; S.lastAct = Date.now();
  const h = document.getElementById('lock-host'); if (h) h.remove();
  $('#app').inert = false; $('#app').removeAttribute('aria-hidden');
}
function dropLock() {          // à la déconnexion
  S.unlocked = false;
  const h = document.getElementById('lock-host'); if (h) h.remove();
  if ($('#app')) { $('#app').inert = false; $('#app').removeAttribute('aria-hidden'); }
}

// Pavé numérique commun à l'écran de verrouillage et à la création du code.
function pinPad(h, { title, sub, max, onDone, extra }) {
  let v = '';
  h.innerHTML = `<div class="lock">
    <div><div class="brand" style="font-size:22px">${esc(S.shop ? S.shop.name : 'Bara Gestion')}</div>
      <div class="muted" style="margin-top:4px">${esc(S.shop ? S.shop.who : '')}</div></div>
    <h2 style="font-size:20px">${esc(title)}</h2>
    ${sub ? `<div class="muted" style="font-size:13.5px">${sub}</div>` : ''}
    <div class="dots" aria-hidden="true">${Array.from({ length: max }, () => '<span></span>').join('')}</div>
    <div class="msg" id="pin-msg" role="alert"></div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" data-k="${n}" aria-label="${n}">${n}</button>`).join('')}
      <button type="button" data-k="del" aria-label="Effacer">⌫</button><button type="button" data-k="0" aria-label="0">0</button>
      <button type="button" data-k="ok" aria-label="Valider">✓</button></div>
    ${extra || ''}</div>`;
  const dots = () => h.querySelectorAll('.dots span').forEach((d, i) => d.classList.toggle('on', i < v.length));
  const msg = (t, bad) => { const m = h.querySelector('#pin-msg'); m.textContent = t || ''; m.className = 'msg' + (bad ? ' bad' : ''); };
  const press = async k => {
    if (h.dataset.busy) return;
    if (k === 'del') v = v.slice(0, -1);
    else if (k === 'ok') { if (v.length < 4) return msg('Au moins 4 chiffres.', true); h.dataset.busy = '1'; const r = await onDone(v, msg); h.dataset.busy = ''; if (r !== 'keep') { v = ''; } }
    else if (v.length < max) { v += k; msg(''); }
    dots();
    // 6 chiffres tapés : validation automatique.
    if (k !== 'ok' && k !== 'del' && v.length === max) press('ok');
  };
  h.querySelectorAll('[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
  h.onkeydown = ev => { if (/^\d$/.test(ev.key)) press(ev.key); else if (ev.key === 'Backspace') press('del'); else if (ev.key === 'Enter') press('ok'); };
  h.tabIndex = -1; h.focus();
  return { msg };
}

// Création (ou changement) du code : tapé deux fois.
function pinSetup(change) {
  stopScan();
  const h = lockHost();
  let first = null;
  const step = () => { pinPad(h, {
    title: first ? 'Retapez le même code' : (change ? 'Nouveau code d\'accès' : 'Créez votre code d\'accès'),
    sub: first ? '' : 'De 4 à 6 chiffres, facile à retenir pour vous, difficile à deviner. Il sera demandé à chaque ouverture.',
    max: 6,
    extra: change ? '<button class="btn ghost" type="button" id="pin-cancel">Annuler</button>' : '',
    onDone: async (v, msg) => {
      if (!first) {
        if (weakPin(v)) { msg('Code trop facile (ex. 1234 ou 0000). Choisissez-en un autre.', true); return; }
        first = v; step(); return;
      }
      if (v !== first) { first = null; step(); setTimeout(() => toast('Les deux codes sont différents. Recommencez.', true), 0); return; }
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      const old = pinRec();
      savePinRec({ u: S.user.id, salt, it: PIN_ITER, hash: await pinHash(v, salt, PIN_ITER), fails: 0, bio: old ? old.bio || null : null, lastPin: Date.now() });
      unlockDone();
      toast(change ? 'Code d\'accès changé.' : 'Code d\'accès créé. Il sera demandé à chaque ouverture.');
    }
  }); const x = $('#pin-cancel'); if (x) x.onclick = () => unlockDone(); };
  step();
}

// Écran de verrouillage.
async function lock() {
  if (!S.user) return;
  const rec = pinRec();
  if (!rec) { S.unlocked = false; return gate(); }
  S.unlocked = false; stopScan();
  const h = lockHost(); h.innerHTML = '<div class="lock"></div>';
  // Une fois par semaine, le code est demandé même avec l'empreinte, pour ne pas l'oublier.
  if (!rec.lastPin) { rec.lastPin = Date.now(); savePinRec(rec); }
  const weekly = Date.now() - rec.lastPin > PIN_WEEK_MS;
  const bio = rec.bio && !weekly && bioAllowed() && await bioAvailable();
  if (S.unlocked || !S.user) return;
  pinPad(h, {
    title: 'Tapez votre code', max: 6,
    sub: rec.bio && weekly && bioAllowed() ? 'Une fois par semaine, l\'application demande votre code pour que vous ne l\'oubliiez pas. Ensuite, l\'empreinte revient.' : '',
    extra: `${bio ? '<button class="btn" type="button" id="pin-bio">👆 Ouvrir avec l\'empreinte</button>' : ''}
      <button class="btn ghost small" type="button" id="pin-forgot">Code oublié ? Se reconnecter avec le mot de passe</button>`,
    onDone: async (v, msg) => {
      const r = pinRec(); if (!r) { S.unlocked = false; return gate(); }
      if (await pinHash(v, r.salt, r.it || PIN_ITER) === r.hash) { r.fails = 0; r.lastPin = Date.now(); savePinRec(r); unlockDone(); return; }
      r.fails = (r.fails || 0) + 1; savePinRec(r);
      if (r.fails >= PIN_MAX_FAILS) { clearPin(); dropLock(); return leave('5 codes faux : par sécurité, reconnectez-vous avec votre mot de passe.'); }
      msg(`Code faux. Encore ${PIN_MAX_FAILS - r.fails} essai(s) avant la déconnexion.`, true);
    }
  });
  const fg = $('#pin-forgot');
  if (fg) fg.onclick = () => {
    if (!fg.dataset.sure) { fg.dataset.sure = '1'; fg.textContent = myQueue().length ? 'Confirmer (les ventes non envoyées restent gardées)' : 'Confirmer : se déconnecter'; return; }
    clearPin(); dropLock(); leave();
  };
  const bb = $('#pin-bio');
  if (bb) {
    bb.onclick = () => bioUnlock(false);
    // L'empreinte est demandée tout de suite ; si elle échoue ou si on annule, le pavé reste là.
    const auto = () => { if (!S.unlocked && document.getElementById('pin-bio')) bioUnlock(true); };
    if (document.visibilityState === 'visible') setTimeout(auto, 250);
    else document.addEventListener('visibilitychange', function v() { if (document.visibilityState === 'visible') { document.removeEventListener('visibilitychange', v); setTimeout(auto, 250); } });
  }
}

async function bioUnlock(auto) {
  const r = pinRec(); if (!r || !r.bio || S.bioBusy) return;
  S.bioBusy = true;
  try {
    const cred = await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), timeout: 60000, userVerification: 'required',
      allowCredentials: [{ type: 'public-key', id: unb64(r.bio) }] } });
    const flags = new Uint8Array(cred.response.authenticatorData)[32];
    if (!(flags & 4)) throw new Error('uv');                 // le téléphone doit avoir vérifié l'empreinte (ou son propre code)
    r.fails = 0; savePinRec(r); unlockDone();
  } catch (e) {
    if (e && e.name === 'NotAllowedError') { if (!auto) toast('Empreinte annulée : tapez votre code.'); return; }   // annulé ou non reconnu
    toast('Empreinte non reconnue : tapez votre code.', true);
  } finally { S.bioBusy = false; }
}

async function bioEnroll() {
  const r = pinRec(); if (!r) return;
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'Bara Gestion' },
      user: { id: new TextEncoder().encode(S.user.id), name: S.shop.who || 'utilisateur', displayName: S.shop.who || 'utilisateur' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000, attestation: 'none' } });
    r.bio = b64(cred.rawId); savePinRec(r);
    toast('Empreinte activée.');
  } catch (e) {
    if (e && e.name === 'NotAllowedError') return;
    toast('Impossible d\'activer l\'empreinte sur ce téléphone.', true);
  }
}

// « Mon code » : verrouiller, changer le code, empreinte.
async function myLockSheet() {
  const r = pinRec(), can = bioAllowed() && await bioAvailable();
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-label="Mon compte">
    <h2>Mon compte</h2>
    <div class="muted">${esc(whoLine())} · ${esc(S.shop.name)}</div>
    <p class="muted" style="margin:0;font-size:13.5px">L'application se verrouille après ${lockLabel()} sans utilisation, et à chaque ouverture.</p>
    <button class="btn" id="lk-now">🔒 Verrouiller maintenant</button>
    <button class="btn ghost" id="lk-change">Changer mon code</button>
    ${!bioAllowed() ? '<p class="muted" style="margin:0;font-size:13px">Empreinte digitale : désactivée par le propriétaire.</p>'
      : !can ? '<p class="muted" style="margin:0;font-size:13px">Empreinte digitale : pas disponible sur ce téléphone ou ce navigateur.</p>'
      : r && r.bio ? '<button class="btn ghost" id="lk-bio-off">Ne plus utiliser l\'empreinte</button>'
      : `<div class="banner">Attention : <b>toutes</b> les empreintes enregistrées dans ce téléphone pourront ouvrir l'application (par exemple celles de votre famille). N'activez que si vous êtes seul à avoir mis vos empreintes dans ce téléphone.</div>
         <button class="btn ghost" id="lk-bio-on">Activer l'empreinte</button>`}
    <button class="btn ghost" id="lk-quit">Quitter (se déconnecter)</button>
    <button class="btn ghost" id="cancel">Fermer</button></div></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#lk-quit').onclick = () => { closeSheet(); askLeave(); };
  $('#lk-now').onclick = () => { closeSheet(); lock(); };
  $('#lk-change').onclick = () => { closeSheet(); pinSetup(true); };
  const on = $('#lk-bio-on'); if (on) on.onclick = async () => { await bioEnroll(); myLockSheet(); };
  const off = $('#lk-bio-off'); if (off) off.onclick = () => { const x = pinRec(); if (x) { x.bio = null; savePinRec(x); } toast('Empreinte désactivée.'); myLockSheet(); };
}

// Verrouillage automatique après inactivité (et au retour dans l'application).
S.lastAct = Date.now();
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { if (S.unlocked) S.lastAct = Date.now(); }, { passive: true, capture: true }));
function idleCheck() {
  if (S.user && S.unlocked && Date.now() - S.lastAct > lockSec() * 1000) lock();
}
setInterval(idleCheck, 3000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') idleCheck(); });

/* ===== Démarrage ===== */
async function boot() {
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch (e) {}
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { clearCache(); dropLock(); S.pwOk = false; S.user = null; const m = S.kick; S.kick = null; drawLogin(m); } });
  if (session) { S.user = session.user; await loadContext(); }
  else {
    // Pas de session lisible : sans réseau, on rouvre la copie locale si elle est valide et récente.
    const c = readCache();
    if (c && !navigator.onLine && hasStoredSession()) startOffline(c);
    else { if (navigator.onLine) clearCache(); drawLogin(); }
  }
  startGuard();
}

/* Session fermée à distance (nouveau mot de passe, connexion sur un autre appareil) :
   on le détecte vite et on renvoie vers l'écran de connexion. */
async function checkSession() {
  if (!S.user || S.checking || S.offline) return;
  S.checking = true;
  try {
    const { data, error } = await sb.rpc('session_valid');
    if (!error && data === false) {
      S.checking = false;
      return leave(KICK_MSG);
    }
  } catch (e) { /* hors ligne : on réessaiera */ }
  S.checking = false;
}
function startGuard() {
  setInterval(() => { checkSession(); syncQueue(); refreshAlerts(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkSession(); });
}

function drawLogin(msg) {
  $('#app').innerHTML = `
    <form class="login" id="login-form" autocomplete="on">
      <div class="brand">Bara Gestion<small>Stock, ventes et dépenses de votre boutique</small></div>
      <label>Identifiant ou adresse e-mail<input id="email" type="text" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" required></label>
      <label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label>
      ${msg ? `<div class="banner bad" role="alert">${esc(msg)}</div>` : ''}
      <button class="btn" id="login-btn" type="submit">Se connecter</button>
      <p class="muted" style="text-align:center;font-size:12px;margin:0">Version ${APP_VERSION}</p>
    </form>`;
  $('#login-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const b = $('#login-btn'); b.disabled = true; b.textContent = 'Connexion…';
    let login = $('#email').value.trim().toLowerCase();
    if (!login.includes('@')) login += '@' + LOGIN_DOMAIN;   // identifiant court des employés
    const { data, error } = await sb.auth.signInWithPassword({ email: login, password: $('#password').value });
    if (error) return drawLogin(cleanErr(error));
    S.user = data.user;
    // Mot de passe juste : si ce compte a déjà son code sur ce téléphone, on le garde (pas besoin de le
    // retaper tout de suite) ; sinon on le crée.
    { const r = pinRec(); if (r) { r.fails = 0; savePinRec(r); } S.unlocked = !!r; S.pwOk = true; }
    try { await sb.rpc('claim_single_session'); } catch (e) {}   // vendeurs et gérants : un seul appareil à la fois
    await loadContext();
  });
}

async function loadContext() {
  $('#app').innerHTML = '<p class="empty">Chargement…</p>';
  const { data, error } = await sb.from('shop_members')
    .select('shop_id, role, display_name, offline_allowed, discount_max_pct, credit_allowed, shops(name, shop_type, phone, address, invoice_footer, offline_max_pending)')
    .eq('user_id', S.user.id).eq('active', true);
  if (error) {
    const c = readCache();
    if (isNetErr(error) && c && c.userId === S.user.id) return startOffline(c);
    return fatal(error);
  }
  // Connexion fermée à distance mais jeton encore en mémoire : la base cache les boutiques.
  // On renvoie alors proprement vers l'écran de connexion au lieu d'afficher une erreur.
  if ((data || []).some(m => !m.shops)) {
    let valid = true;
    try { const r = await sb.rpc('session_valid'); if (!r.error && r.data === false) valid = false; } catch (e) {}
    if (!valid) {
      return leave(KICK_MSG);
    }
  }
  S.memberships = (data || []).filter(m => m.shops);
  if (!S.memberships.length) {
    $('#app').innerHTML = `<div class="login"><div class="brand">Bara Gestion</div>
      <div class="banner">Ce compte n'est rattaché à aucune boutique. Demandez au propriétaire de vous ajouter.</div>
      <button class="btn ghost" id="out">Se déconnecter</button></div>`;
    $('#out').onclick = () => leave();
    return;
  }
  let pick = S.memberships[0];
  try { const saved = storage.getItem('bg_shop'); pick = S.memberships.find(m => m.shop_id === saved) || pick; } catch (e) {}
  await selectShop(pick.shop_id);
}

async function selectShop(id) {
  const m = S.memberships.find(x => x.shop_id === id);
  S.shop = { id, name: m.shops.name, type: m.shops.shop_type, who: m.display_name,
    phone: m.shops.phone || '', address: m.shops.address || '', footer: m.shops.invoice_footer || '',
    offAllowed: !!m.offline_allowed, maxPending: Number(m.shops.offline_max_pending) || 30,
    discMax: Number(m.discount_max_pct) || 0, creditAllowed: !!m.credit_allowed };
  S.role = m.role;
  storage.setItem('bg_shop', id);
  S.cart = new Map(); S.ref = uuid(); S.disc = 0; S.custSel = null; S.editQuote = null; S.quotes = null; S.customers = null; S.sales = null; S.summary = null; S.team = null; S.names = null; S.last = null; S.tab = (m.role === 'owner' || m.role === 'manager') ? 'home' : 'sale';
  S.alerts = null; S.devices = null; S.offAllowed = null; S.alertCount = 0;
  await Promise.all([loadProducts().then(() => canCredit() ? loadCustomers(true) : null), loadSub(), loadAlertCount(), loadCountState(), loadCash(), loadLockSettings()]);
  saveCache();
  gate();
  draw();
  registerDevice();
  syncQueue();
}

// Réglages du verrouillage (propriétaire). Avant la migration 013 : 1 minute par défaut.
async function loadLockSettings() {
  try {
    const { data, error } = await sb.from('shops').select('lock_seconds, biometric_allowed').eq('id', S.shop.id).maybeSingle();
    if (!error && data) { S.shop.lockSec = Number(data.lock_seconds) || 60; S.shop.bioAllowed = data.biometric_allowed !== false; }
  } catch (e) {}
}

async function loadSub() {
  const { data, error } = await sb.rpc('subscription_state', { p_shop: S.shop.id });
  S.sub = error ? { status: 'read_only' } : data;
}

async function loadProducts() {
  const { data, error } = await sb.from('products')
    .select('id,name,category,unit,sell_price,stock_qty,alert_threshold,barcode')
    .eq('shop_id', S.shop.id).eq('active', true).order('name');
  if (error) return toast(cleanErr(error), true);
  S.products = data || [];
  saveCache();
  if (isManager()) {
    const c = await sb.from('product_costs').select('product_id,buy_price').eq('shop_id', S.shop.id);
    S.costs = {};
    (c.data || []).forEach(r => S.costs[r.product_id] = r.buy_price);

}

function fatal(e) {
  $('#app').innerHTML = `<div class="login"><div class="banner bad" role="alert">${esc(cleanErr(e))}</div>
    <button class="btn" id="retry">Réessayer</button></div>`;
  $('#retry').onclick = () => loadContext();
}

/* ===== Structure générale ===== */
function banner() {
  return pendingBanner() + subBanner();
}
function subBanner() {
  if (S.offline) {
    const d = new Date(S.cachedAt).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    return offlineRight()
      ? `<div class="banner">Hors ligne. Les ventes sont gardées sur ce téléphone et partiront toutes seules au retour du réseau. Catalogue du ${esc(d)} : le stock peut avoir changé.</div>`
      : `<div class="banner">Hors ligne. Catalogue enregistré le ${esc(d)} : consultation seulement, le stock peut avoir changé. Les ventes reviendront avec la connexion.</div>`;
  }
  const s = S.sub || {};
  // Les dates de l'abonnement ne concernent que le propriétaire. Les employés voient seulement
  // un message si la boutique ne peut plus vendre.
  if (S.role !== 'owner') {
    return (s.status === 'read_only' || s.status === 'suspended')
      ? `<div class="banner bad">Les ventes sont bloquées pour le moment. Contactez le propriétaire de la boutique.</div>` : '';
  }
  if (s.status === 'trial') return `<div class="banner ok">Essai gratuit : ${esc(s.days_left)} jour(s) restant(s).</div>`;
  if (s.status === 'grace') return `<div class="banner">Abonnement expiré. Payez avant la fin du délai pour ne pas passer en lecture seule.</div>`;
  if (s.status === 'read_only') return `<div class="banner bad">Abonnement expiré : lecture seule. Les ventes et le stock sont bloqués.</div>`;
  if (s.status === 'suspended') return `<div class="banner bad">Boutique suspendue. Contactez Bara Gestion.</div>`;
  if (s.status === 'active' && s.days_left <= 5) return `<div class="banner">Votre abonnement se termine dans ${esc(s.days_left)} jour(s).</div>`;
  return '';
}

const TAB_IC = { home: '🏠', sale: '🛒', products: '📦', history: '🧾', clients: '👥', cash: '💰', report: '📊', team: '⚙️', more: '☰' };
const MORE_TABS = ['history', 'cash', 'report', 'team', 'more'];
function draw() {
  if (S.tab === 'count' && !isManager()) S.tab = 'products';
  let tabs;
  if (S.offline) { tabs = [['sale', 'Vendre'], ['products', 'Produits']]; if (!['sale', 'products'].includes(S.tab)) S.tab = 'sale'; }   // le reste demande internet
  else if (isManager()) tabs = [['home', 'Accueil'], ['sale', 'Vendre'], ['products', 'Produits'], ['clients', 'Clients'], ['more', 'Plus']];
  else tabs = [['sale', 'Vendre'], ['products', 'Produits'], ['history', 'Ventes'], ['clients', 'Clients'], ['cash', 'Caisse']];

function cartTotal() {
  let t = 0;
  S.cart.forEach((q, id) => { const p = S.products.find(x => x.id === id); if (p) t += Math.round(q * p.sell_price); });
  return t;
}

  if (S.payOpen && S.cart.size) return viewPay();
  S.payOpen = false; document.body.classList.remove('paying');
  const cats = [...new Set(S.products.map(p => p.category).filter(Boolean))].sort((x, y) => x.localeCompare(y, 'fr'));

  $('#view').innerHTML = `${!S.offline && S.cash && !S.cash.open ? '<div class="banner">Caisse non ouverte. <button class="btn small" id="go-cash" style="margin-left:6px">Ouvrir la caisse</button></div>' : ''}
    ${S.last ? `<section class="card" style="display:grid;gap:8px;border-color:var(--accent)">
      <div style="display:flex;align-items:center;gap:10px"><span style="font-size:26px" aria-hidden="true">✅</span>

      ${canScan() ? '<button class="btn" type="button" id="scan" style="flex:0 0 auto;width:58px;height:50px;font-size:22px;padding:0" aria-label="Scanner un code-barres">📷</button>' : ''}</div>
    ${cats.length > 1 ? `<div class="chips" role="group" aria-label="Catégories"><button aria-pressed="${!S.cat}" data-cat="">Tout</button>${cats.map(c => `<button aria-pressed="${S.cat === c}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}

  const gc = $('#go-cash'); if (gc) gc.onclick = () => { S.tab = 'cash'; draw(); };
  q.oninput = () => { S.q = q.value; drawProducts(); };
  q.onkeydown = ev => {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    const code = q.value.trim().toUpperCase();
    const hit = S.products.find(p => p.barcode && p.barcode.toUpperCase() === code);
    if (hit) { addToCart(hit.id); S.q = ''; q.value = ''; drawProducts(); }
    else toast('Aucun produit avec ce code.', true);

  const lx = $('#last-x'); if (lx) lx.onclick = () => { S.last = null; viewSale(); };
  drawProducts(); drawCart();
}

}

function artFor(name) { const a = ART.find(([re]) => re.test(name || '')); return a ? `<svg viewBox="0 0 64 64" width="46" height="46" aria-hidden="true">${a[1]}</svg>` : ''; }

// Couleur et lettres de la tuile : même couleur pour une même catégorie.
const TILE_COLORS = [['#E3F1E8', '#1f6b4a'], ['#E8EEF8', '#2F5DA8'], ['#FBF1D6', '#8A6100'], ['#F7E6E3', '#B42318'], ['#EEE8F6', '#6941C6'], ['#E2F2F4', '#0E6874'], ['#F6E8DA', '#8A4B12']];
function tileColor(key) {
  let h = 0; for (const ch of String(key || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return TILE_COLORS[h % TILE_COLORS.length];
}
const initials = n => { const w = String(n).replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).filter(Boolean);
  return ((w[0] || '?').slice(0, w.length > 1 ? 1 : 2) + (w.length > 1 ? (/\d/.test(w[1]) ? w[1].slice(0, 2) : w[1][0]) : '')).toUpperCase(); };

function drawProducts() {
  const t = S.q.trim().toLowerCase();
  const list = S.products.filter(p => (!S.cat || p.category === S.cat) && (!t || p.name.toLowerCase().includes(t) || (p.barcode || '').toLowerCase() === t)).slice(0, 90);
  $('#plist').innerHTML = list.length ? list.map(p => {
    const [bg, fg] = tileColor(p.category || p.name), inCart = S.cart.get(p.id), out = Number(p.stock_qty) <= 0;
    return `<button class="tile${inCart ? ' in' : ''}" data-add="${esc(p.id)}" ${out && !S.offline ? 'disabled' : ''} aria-label="${esc(p.name)}, ${esc(money(p.sell_price))}${inCart ? ', ' + esc(qty(inCart)) + ' dans le panier' : ''}">
      ${artFor(p.name) ? `<span class="ini" style="background:#F6F4EE" aria-hidden="true">${artFor(p.name)}</span>` : `<span class="ini" style="background:${bg};color:${fg}" aria-hidden="true">${esc(initials(p.name))}</span>`}
      <span class="tn">${esc(p.name)}</span>
      ${out ? '<span class="ts">Épuisé</span>' : `<span class="tp">${esc(fmtNum.format(p.sell_price))}</span>`}
      ${inCart ? `<span class="tq" aria-hidden="true">${esc(qty(inCart))}</span>` : ''}</button>`;
  }).join('') : '<p class="empty" style="grid-column:1/-1">Aucun produit trouvé.</p>';
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => addToCart(b.dataset.add));
}

function addToCart(id) {
  const p = S.products.find(x => x.id === id); if (!p) return;
  const cur = S.cart.get(id) || 0;
  if (cur + 1 > Number(p.stock_qty)) {
    if (!S.offline) return toast('Stock insuffisant : ' + p.name, true);
    toast('Attention : stock peut-être insuffisant pour ' + p.name + ' (à vérifier).', true);
  }
  S.cart.set(id, cur + 1);
  try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
  if ($('#plist') && !S.payOpen) drawProducts();
  drawCart();
}

function advText(t, adv) {
  return t > adv ? `Pris sur l'avance : <b>${money(adv)}</b>. À encaisser : <b>${money(t - adv)}</b>.`
                 : `Tout est pris sur l'avance : <b>rien à encaisser</b>. Il restera ${money(adv - t)} d'avance.`;
}

// Remise : texte d'aide et contrôle (le vrai contrôle est fait par la base).
function discInfo(sub) {
  const d = S.disc || 0, pct = sub ? Math.round(d * 10000 / sub) / 100 : 0;
  const lim = S.role === 'owner' ? '' : ` · maximum ${String(S.shop.discMax || 0).replace('.', ',')} %`;
  return d ? `${String(pct).replace('.', ',')} % du sous-total ${esc(money(sub))}${lim}` : (lim ? lim.slice(3) : '');
}
function discError(sub, d) {
  if (!d) return '';
  if (d < 0 || !Number.isInteger(d)) return 'Remise invalide.';
  if (d > sub) return 'La remise ne peut pas dépasser le total de la vente.';
  if (S.role !== 'owner' && d * 100 > sub * (S.shop.discMax || 0)) {
    return `Remise trop élevée : votre maximum est ${String(S.shop.discMax || 0).replace('.', ',')} % (${money(Math.floor(sub * (S.shop.discMax || 0) / 100))} sur cette vente).`;
  }
  return '';
}

// Montants du paiement, calculés à partir de l'état (rien n'est perdu quand l'écran se redessine).
// paid = argent réellement reçu maintenant ; la base prend d'abord l'avance du client pour le reste.
function payFigures() {
  const sub = cartTotal();
  if (S.disc > sub) S.disc = 0;
  const total = sub - (S.disc || 0);
  const adv = S.offline ? 0 : advOf(S.custSel);
  const useAdv = adv > 0 && !S.custSel.noAdv && !S.editQuote;
  const advPart = useAdv ? Math.min(adv, total) : 0, due = total - advPart;
  const mode = S.payMode || 'cash';
  let paid = due, change = 0, recv = null;
  if (mode === 'cash') {
    recv = S.recv === '' || S.recv == null ? due : Math.max(0, Math.round(Number(S.recv) || 0));
    paid = Math.min(recv, due); change = Math.max(0, recv - due);
  } else if (mode === 'credit') {
    paid = Math.min(due, Math.max(0, Math.round(Number(S.paidNow) || 0)));
  }
  return { sub, total, adv, useAdv, advPart, due, mode, paid, change, recv, method: mode === 'mobile_money' ? 'mobile_money' : 'cash' };
}

// Écran Vendre : barre fixe en bas (articles + total + « Payer »).
function drawCart() {
  if (S.payOpen) return S.cart.size ? viewPay() : (S.payOpen = false, viewSale());
  let bar = document.getElementById('cartbar');
  if (!S.cart.size || !$('#plist')) { if (bar) bar.remove(); const sp = $('#bar-space'); if (sp) sp.style.height = '0'; return; }
  if (!bar) { bar = document.createElement('div'); bar.id = 'cartbar'; bar.className = 'cartbar'; $('#view').appendChild(bar); }
  const f = payFigures(), n = [...S.cart.values()].reduce((a, q) => a + (Number.isInteger(q) ? q : 1), 0);
  bar.innerHTML = `<button type="button" id="open-pay"><span class="ct"><small>${n} article${n > 1 ? 's' : ''}${S.editQuote ? ' · devis ' + esc(quoteNo(S.editQuote.no)) : ''}</small><b>${esc(money(f.total))}</b></span>
    <span class="go">${S.editQuote ? 'Devis ›' : 'Payer ›'}</span></button>`;
  const tabs = document.querySelector('.tabs');
  bar.style.bottom = (tabs ? tabs.offsetHeight : 0) + 'px';
  const sp = $('#bar-space'); if (sp) sp.style.height = '84px';
  $('#open-pay').onclick = () => { S.payOpen = true; window.scrollTo(0, 0); viewPay(); };
}

function setQty(id, v) {
  const p = S.products.find(x => x.id === id);
  if (p && v > Number(p.stock_qty) && !S.offline) { toast('Stock insuffisant : ' + p.name + ' (' + qty(p.stock_qty) + ' en stock)', true); v = Math.max(0, Number(p.stock_qty)); }
  if (v > 0) S.cart.set(id, v); else S.cart.delete(id);
}
function resetSale() {
  S.cart.clear(); S.ref = uuid(); S.disc = 0; S.custSel = null; S.payOpen = false; S.payMode = 'cash'; S.recv = ''; S.paidNow = ''; S.showDisc = false;
  const bar = document.getElementById('cartbar'); if (bar) bar.remove();
}
// Texte sous le montant : monnaie à rendre, ou ce qui reste en crédit.
function payInfo(f) {
  if (f.mode === 'cash' && f.change > 0) return `<div class="change"><span>À rendre</span><b>${esc(money(f.change))}</b></div>`;
  if (f.paid < f.due && f.mode === 'credit') return `<div class="banner" style="margin:0">Crédit : <b>${esc(money(f.due - f.paid))}</b>${S.custSel ? ' pour ' + esc(S.custSel.name) : ' (choisissez le client)'}.</div>`;
  if (f.paid < f.due) return `<div class="banner bad" style="margin:0">Pas assez : il manque <b>${esc(money(f.due - f.paid))}</b>${S.custSel ? ' (crédit pour ' + esc(S.custSel.name) + ')' : ''}.</div>`;
  return f.mode === 'cash' ? '<div class="banner ok" style="margin:0">Compte juste ✓</div>' : '';
}
function syncPay() {
  const f = payFigures();
  if ($('#paid')) $('#paid').value = f.paid;
  if ($('#pay')) $('#pay').value = f.method;
  if ($('#pay-info')) $('#pay-info').innerHTML = payInfo(f);
}

async function submitSale() {
  if (S.busy) return;
  S.busy = true; const b = $('#validate'); b.disabled = true; b.textContent = 'Enregistrement…';
  const F = payFigures(), sub = F.sub, disc = S.disc || 0, total = F.total;
  const paid = F.paid, pay = F.method, customer = S.custSel, change = F.change;
  if (paid < total) {
    if (!customer) { S.busy = false; toast('Vente à crédit : choisissez le client (avec son téléphone).', true); return drawCart(); }
    const adv = S.offline ? 0 : advOf(customer);
    if (!canCredit() && total - paid > adv) {
      S.busy = false;
      toast(adv ? `Avance insuffisante : ${customer.name} a ${money(adv)} d'avance, il manque ${money(total - paid - adv)}.` : 'Vente à crédit non autorisée pour vous : demandez au propriétaire.', true);
      return drawCart();
    }
  }
  const dErr = discError(sub, disc);
  if (dErr) { S.busy = false; toast(dErr, true); return drawCart(); }
  S.pendingChange = change;
  if (S.offline) { S.busy = false; return queueSale(total, paid, pay, customer, disc); }
  // Le propriétaire a peut-être changé un prix depuis l'ouverture de l'écran : on vérifie AVANT
  // d'encaisser, pour que le total affiché soit toujours le vrai total.
  try {
    const { data: fresh, error: fe } = await sb.from('products').select('id,name,sell_price')
      .eq('shop_id', S.shop.id).in('id', [...S.cart.keys()]);
    if (!fe && fresh) {
      const changed = fresh.filter(f => { const p = S.products.find(x => x.id === f.id); return p && Number(p.sell_price) !== Number(f.sell_price); });
      if (changed.length) {
        changed.forEach(f => { S.products.find(x => x.id === f.id).sell_price = f.sell_price; });
        S.busy = false; drawCart(); saveCache();
        return toast('Prix modifié par le propriétaire : ' + changed.map(f => f.name + ' = ' + money(f.sell_price)).join(', ') +
          '. Vérifiez le nouveau total puis validez à nouveau.', true);
      }
    }
  } catch (e) { /* réseau coupé : la suite s'en occupe */ }
  const items = [...S.cart].map(([product_id, quantity]) => ({ product_id, quantity }));
  const { data: newSale, error } = await sb.rpc('create_sale', {
    p_shop: S.shop.id, p_items: items, p_paid: paid,
    p_payment_method: pay, p_customer: null, p_client_ref: S.ref, ...(disc ? { p_discount: disc } : {}),
    ...(customer ? { p_customer_id: customer.id } : {})
  });
  S.busy = false;
  // Réseau coupé pendant l'envoi : si la vente hors ligne est permise, elle part dans la file
  // avec la MÊME référence. Si le serveur l'avait déjà reçue, il ne la comptera pas deux fois.
  if (error && isNetErr(error) && offlineRight()) return queueSale(total, paid, pay, customer, disc);
  if (error) { toast(cleanErr(error), true); return drawCart(); }
  resetSale(); S.customers = null; S.sales = null; S.summary = null; S.last = newSale ? { id: newSale, total, change } : null;
  toast('Vente enregistrée : ' + money(total));
  await loadProducts();
  viewSale();
}
