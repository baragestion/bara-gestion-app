<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bara Gestion">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bara Gestion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Disposition : application mobile d'abord, en-tête fixe, contenu au centre, barre d'onglets en bas. */
:root{
  --bg:#f1f3f0; --surface:#ffffff; --fg:#1b221e; --muted:#5b665f; --line:#d9dfd8;
  --accent:#1f6b4a; --accent-ink:#ffffff; --accent-soft:#e1efe8;
  --warn:#8a5a00; --warn-soft:#faf0d6; --bad:#a8321f; --bad-soft:#fbe5e0;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a211e; --fg:#e8ece9; --muted:#9aa59e; --line:#2b3530;
  --accent:#4cc38a; --accent-ink:#06281a; --accent-soft:#1b3a2d;
  --warn:#e6b450; --warn-soft:#3a2f12; --bad:#ff8a73; --bad-soft:#3d1d17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a211e; --fg:#e8ece9; --muted:#9aa59e; --line:#2b3530;
  --accent:#4cc38a; --accent-ink:#06281a; --accent-soft:#1b3a2d;
  --warn:#e6b450; --warn-soft:#3a2f12; --bad:#ff8a73; --bad-soft:#3d1d17; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 84px;min-height:100vh}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Connexion */
.login{max-width:380px;margin:0 auto;padding-block:12vh 24px;display:grid;gap:18px}
.brand{font:700 30px/1.1 var(--f-display);letter-spacing:-.01em}
.brand small{display:block;font:400 14px var(--f-body);color:var(--muted);margin-top:6px;letter-spacing:0}

/* Champs et boutons */
label{display:grid;gap:5px;font-weight:500;font-size:13px;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;min-width:0;color:var(--fg)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{padding:7px 11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 140px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stack{display:grid;gap:12px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line);margin-inline:-2px;padding-inline:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shopname{font:700 19px/1.2 var(--f-display)}
.who{font-size:12.5px;color:var(--muted)}
.banner{margin-top:8px;border-radius:8px;padding:8px 11px;font-size:13.5px;background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.ok{background:var(--accent-soft);color:var(--accent)}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;background:none;border:0;padding:10px 4px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* Contenu */
main{padding-block:16px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.sectitle{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.plist{display:grid;gap:8px}
.prod{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;width:100%}
button.prod{cursor:pointer}
button.prod:hover{border-color:var(--accent)}
.prod .nm{font-weight:600;overflow-wrap:anywhere}
.prod .sub{font-size:12.5px;color:var(--muted)}
.prod .pr{text-align:right;white-space:nowrap;font-weight:600}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.cartline{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.cartline:last-child{border-bottom:0}
.cartline input{padding:8px}
.total{display:flex;justify-content:space-between;align-items:baseline;font:700 22px var(--f-display)}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.metric b{display:block;font:700 20px var(--f-display);margin-top:2px;font-variant-numeric:tabular-nums}
.metric span{font-size:12.5px;color:var(--muted)}
.sale{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.sale.cancelled{opacity:.65}
.sale ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:0 0 auto}
.empty{text-align:center;color:var(--muted);padding:24px 8px}

/* Fenêtre de saisie */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:90vh;overflow:auto;display:grid;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:92vw;font-weight:500;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast-host"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Connexion à la base (clé publique « publishable » : la sécurité repose sur les règles RLS) ===== */
const SB_URL = 'https://uqnucmgsgkwalxodqmjr.supabase.co';
const SB_KEY = 'sb_publishable_3vrJsQkSN2QlL_MMwBPGgQ_rC-IvhNo';

const mem = {};
const storage = {
  getItem: k => { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
  setItem: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  removeItem: k => { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
};
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { storage, persistSession: true, autoRefreshToken: true } });

/* ===== Utilitaires ===== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 3 });
const money = n => fmtNum.format(Number(n) || 0) + ' FCFA';
const qty = n => fmtNum.format(Number(n) || 0);
const UNITS = { piece:'pièce', sac:'sac', kilo:'kilo', litre:'litre', carton:'carton', metre:'mètre', barre:'barre', seau:'seau', paire:'paire' };
const WHOLE = ['piece','sac','carton','barre','seau','paire'];
const PAY = { cash:'Espèces', mobile_money:'Mobile money', other:'Autre' };
const ROLES = { owner:'Propriétaire', manager:'Gérant', seller:'Vendeur' };
const EXP = { rent:'Loyer', electricity:'Électricité', transport:'Transport', other:'Autre' };
const dt = s => new Date(s).toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
const cleanErr = e => {
  const m = (e && e.message) || 'Erreur inconnue';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Pas de connexion. Vérifiez internet puis réessayez.';
  if (/Invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  return m;
};
function toast(msg, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.setAttribute('role', 'status');
  el.textContent = msg;
  $('#toast-host').appendChild(el);
  setTimeout(() => el.remove(), err ? 6000 : 3200);
}

/* ===== État ===== */
const S = {
  user: null, memberships: [], shop: null, role: null, sub: null,
  products: [], costs: {}, tab: 'sale',
  q: '', cart: new Map(), ref: uuid(), busy: false,
  sales: null, summary: null, range: 'today', sheet: null
};
const isManager = () => S.role === 'owner' || S.role === 'manager';
const canWrite = () => S.sub && ['trial','active','grace'].includes(S.sub.status);

/* ===== Démarrage ===== */
async function boot() {
  const { data } = await sb.auth.getSession();
  if (data.session) { S.user = data.session.user; await loadContext(); } else drawLogin();
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { S.user = null; drawLogin(); } });
}

function drawLogin(msg) {
  $('#app').innerHTML = `
    <form class="login" id="login-form" autocomplete="on">
      <div class="brand">Bara Gestion<small>Stock, ventes et dépenses de votre boutique</small></div>
      <label>Adresse e-mail<input id="email" type="email" autocomplete="username" required></label>
      <label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label>
      ${msg ? `<div class="banner bad" role="alert">${esc(msg)}</div>` : ''}
      <button class="btn" id="login-btn" type="submit">Se connecter</button>
    </form>`;
  $('#login-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const b = $('#login-btn'); b.disabled = true; b.textContent = 'Connexion…';
    const { data, error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#password').value });
    if (error) return drawLogin(cleanErr(error));
    S.user = data.user; await loadContext();
  });
}

async function loadContext() {
  $('#app').innerHTML = '<p class="empty">Chargement…</p>';
  const { data, error } = await sb.from('shop_members')
    .select('shop_id, role, display_name, shops(name, shop_type)')
    .eq('user_id', S.user.id).eq('active', true);
  if (error) return fatal(error);
  S.memberships = data || [];
  if (!S.memberships.length) {
    $('#app').innerHTML = `<div class="login"><div class="brand">Bara Gestion</div>
      <div class="banner">Ce compte n'est rattaché à aucune boutique. Demandez au propriétaire de vous ajouter.</div>
      <button class="btn ghost" id="out">Se déconnecter</button></div>`;
    $('#out').onclick = () => sb.auth.signOut();
    return;
  }
  let pick = S.memberships[0];
  try { const saved = storage.getItem('bg_shop'); pick = S.memberships.find(m => m.shop_id === saved) || pick; } catch (e) {}
  await selectShop(pick.shop_id);
}

async function selectShop(id) {
  const m = S.memberships.find(x => x.shop_id === id);
  S.shop = { id, name: m.shops.name, type: m.shops.shop_type, who: m.display_name };
  S.role = m.role;
  storage.setItem('bg_shop', id);
  S.cart = new Map(); S.ref = uuid(); S.sales = null; S.summary = null; S.tab = 'sale';
  await Promise.all([loadProducts(), loadSub()]);
  draw();
}

async function loadSub() {
  const { data, error } = await sb.rpc('subscription_state', { p_shop: S.shop.id });
  S.sub = error ? { status: 'read_only' } : data;
}

async function loadProducts() {
  const { data, error } = await sb.from('products')
    .select('id,name,category,unit,sell_price,stock_qty,alert_threshold,barcode')
    .eq('shop_id', S.shop.id).eq('active', true).order('name');
  if (error) return toast(cleanErr(error), true);
  S.products = data || [];
  if (isManager()) {
    const c = await sb.from('product_costs').select('product_id,buy_price').eq('shop_id', S.shop.id);
    S.costs = {};
    (c.data || []).forEach(r => S.costs[r.product_id] = r.buy_price);
  }
}

function fatal(e) {
  $('#app').innerHTML = `<div class="login"><div class="banner bad" role="alert">${esc(cleanErr(e))}</div>
    <button class="btn" id="retry">Réessayer</button></div>`;
  $('#retry').onclick = () => loadContext();
}

/* ===== Structure générale ===== */
function banner() {
  const s = S.sub || {};
  if (s.status === 'trial') return `<div class="banner ok">Essai gratuit : ${esc(s.days_left)} jour(s) restant(s).</div>`;
  if (s.status === 'grace') return `<div class="banner">Abonnement expiré. Payez avant la fin du délai pour ne pas passer en lecture seule.</div>`;
  if (s.status === 'read_only') return `<div class="banner bad">Abonnement expiré : lecture seule. Les ventes et le stock sont bloqués.</div>`;
  if (s.status === 'suspended') return `<div class="banner bad">Boutique suspendue. Contactez Bara Gestion.</div>`;
  if (s.status === 'active' && s.days_left <= 5) return `<div class="banner">Votre abonnement se termine dans ${esc(s.days_left)} jour(s).</div>`;
  return '';
}

function draw() {
  const tabs = [['sale','Vente'], ['products','Produits'], ['history','Historique']];
  if (isManager()) tabs.push(['report','Bilan']);
  const multi = S.memberships.length > 1;
  $('#app').innerHTML = `
    <header class="top">
      <div class="top-row">
        <div style="min-width:0">
          ${multi ? `<select id="shop-pick" aria-label="Boutique">${S.memberships.map(m => `<option value="${esc(m.shop_id)}" ${m.shop_id===S.shop.id?'selected':''}>${esc(m.shops.name)}</option>`).join('')}</select>`
                  : `<div class="shopname">${esc(S.shop.name)}</div>`}
          <div class="who">${esc(S.shop.who)} · ${esc(ROLES[S.role])}</div>
        </div>
        <button class="btn ghost small" id="logout">Quitter</button>
      </div>
      ${banner()}
    </header>
    <main id="view"></main>
    <nav class="tabs" aria-label="Sections">${tabs.map(([k,l]) => `<button data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav>
    <div id="sheet-host"></div>`;
  $('#logout').onclick = () => sb.auth.signOut();
  const sp = $('#shop-pick'); if (sp) sp.onchange = () => selectShop(sp.value);
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; draw(); });
  ({ sale: viewSale, products: viewProducts, history: viewHistory, report: viewReport })[S.tab]();
}

/* ===== Onglet Vente ===== */
function cartTotal() {
  let t = 0;
  S.cart.forEach((q, id) => { const p = S.products.find(x => x.id === id); if (p) t += Math.round(q * p.sell_price); });
  return t;
}

function viewSale() {
  $('#view').innerHTML = `
    <section class="card stack">
      <h2>Nouvelle vente</h2>
      <label>Chercher un produit ou scanner un code<input id="q" type="search" placeholder="Nom, ou code-barres puis Entrée" value="${esc(S.q)}" autocomplete="off"></label>
      <div class="plist" id="plist"></div>
    </section>
    <section class="card stack" id="cart"></section>`;
  const q = $('#q');
  q.oninput = () => { S.q = q.value; drawProducts(); };
  q.onkeydown = ev => {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    const code = q.value.trim().toUpperCase();
    const hit = S.products.find(p => p.barcode && p.barcode.toUpperCase() === code);
    if (hit) { addToCart(hit.id); S.q = ''; q.value = ''; drawProducts(); }
    else toast('Aucun produit avec ce code.', true);
  };
  drawProducts(); drawCart();
}

function drawProducts() {
  const t = S.q.trim().toLowerCase();
  const list = S.products.filter(p => !t || p.name.toLowerCase().includes(t) || (p.barcode || '').toLowerCase() === t).slice(0, 60);
  $('#plist').innerHTML = list.length ? list.map(p => `
    <button class="prod" data-add="${esc(p.id)}" ${Number(p.stock_qty) <= 0 ? 'disabled' : ''}>
      <span><span class="nm">${esc(p.name)}</span><br><span class="sub">${qty(p.stock_qty)} ${esc(UNITS[p.unit])} en stock</span></span>
      <span class="pr">${money(p.sell_price)}</span>
    </button>`).join('') : '<p class="empty">Aucun produit trouvé.</p>';
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => addToCart(b.dataset.add));
}

function addToCart(id) {
  const p = S.products.find(x => x.id === id); if (!p) return;
  const cur = S.cart.get(id) || 0;
  if (cur + 1 > Number(p.stock_qty)) return toast('Stock insuffisant : ' + p.name, true);
  S.cart.set(id, cur + 1);
  drawCart();
}

function drawCart() {
  const el = $('#cart'); if (!el) return;
  if (!S.cart.size) { el.innerHTML = '<h2>Panier</h2><p class="empty">Touchez un produit pour l\'ajouter.</p>'; return; }
  const total = cartTotal();
  const lines = [...S.cart].map(([id, q]) => {
    const p = S.products.find(x => x.id === id);
    return `<div class="cartline">
      <div><div class="nm" style="font-weight:600;overflow-wrap:anywhere">${esc(p.name)}</div><div class="sub muted num">${money(p.sell_price)} / ${esc(UNITS[p.unit])}</div></div>
      <input type="number" inputmode="decimal" min="0" step="${WHOLE.includes(p.unit) ? 1 : 0.001}" value="${esc(q)}" data-qty="${esc(id)}" aria-label="Quantité ${esc(p.name)}">
      <button class="btn ghost small" data-rm="${esc(id)}" aria-label="Retirer ${esc(p.name)}">Retirer</button>
    </div>`;
  }).join('');
  el.innerHTML = `<h2>Panier</h2>${lines}
    <div class="total"><span>Total</span><span class="num" id="total">${money(total)}</span></div>
    <div class="row">
      <label>Montant encaissé (FCFA)<input id="paid" type="number" inputmode="numeric" min="0" step="1" value="${total}"></label>
      <label>Paiement<select id="pay">${Object.entries(PAY).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
    </div>
    <label>Nom du client (obligatoire si paiement partiel)<input id="cust" maxlength="100" autocomplete="off"></label>
    <div class="row"><button class="btn" id="validate" ${canWrite() ? '' : 'disabled'}>Valider la vente</button>
      <button class="btn ghost" id="clear">Vider</button></div>`;
  el.querySelectorAll('[data-qty]').forEach(i => i.onchange = () => {
    const v = Number(i.value);
    if (!(v > 0)) S.cart.delete(i.dataset.qty); else S.cart.set(i.dataset.qty, v);
    drawCart();
  });
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { S.cart.delete(b.dataset.rm); drawCart(); });
  $('#clear').onclick = () => { S.cart.clear(); S.ref = uuid(); drawCart(); };
  $('#validate').onclick = submitSale;
}

async function submitSale() {
  if (S.busy) return;
  S.busy = true; const b = $('#validate'); b.disabled = true; b.textContent = 'Enregistrement…';
  const total = cartTotal();
  const paidRaw = $('#paid').value.trim();
  const paid = paidRaw === '' ? total : Math.round(Number(paidRaw));
  const items = [...S.cart].map(([product_id, quantity]) => ({ product_id, quantity }));
  const { error } = await sb.rpc('create_sale', {
    p_shop: S.shop.id, p_items: items, p_paid: paid,
    p_payment_method: $('#pay').value, p_customer: $('#cust').value.trim() || null, p_client_ref: S.ref
  });
  S.busy = false;
  if (error) { toast(cleanErr(error), true); return drawCart(); }
  S.cart.clear(); S.ref = uuid(); S.sales = null; S.summary = null;
  toast('Vente enregistrée : ' + money(total));
  await loadProducts();
  viewSale();
}

/* ===== Onglet Produits ===== */
function viewProducts() {
  $('#view').innerHTML = `
    <section class="card stack">
      <div class="row"><h2 style="flex:1 1 auto">Produits (${S.products.length})</h2>
        ${isManager() ? `<button class="btn small" id="newp" style="flex:0 0 auto" ${canWrite() ? '' : 'disabled'}>Nouveau produit</button>` : ''}</div>
      <div class="plist">${S.products.map(p => {
        const low = Number(p.stock_qty) <= Number(p.alert_threshold);
        return `<div class="prod">
          <div style="min-width:0"><div class="nm">${esc(p.name)}</div>
            <div class="sub">${esc(p.category)} · ${qty(p.stock_qty)} ${esc(UNITS[p.unit])} ${low ? '<span class="tag warn">Stock bas</span>' : ''}</div>
            ${isManager() && S.costs[p.id] != null ? `<div class="sub">Achat ${money(S.costs[p.id])}</div>` : ''}
            ${isManager() ? `<div class="seg" style="margin-top:6px"><button class="btn ghost small" data-recv="${esc(p.id)}" ${canWrite() ? '' : 'disabled'}>Réception</button><button class="btn ghost small" data-adj="${esc(p.id)}" ${canWrite() ? '' : 'disabled'}>Ajuster</button></div>` : ''}</div>
          <div class="pr num">${money(p.sell_price)}</div></div>`;
      }).join('') || '<p class="empty">Aucun produit.</p>'}</div>
    </section>`;
  const n = $('#newp'); if (n) n.onclick = () => openSheet('new');
  document.querySelectorAll('[data-recv]').forEach(b => b.onclick = () => openSheet('recv', b.dataset.recv));
  document.querySelectorAll('[data-adj]').forEach(b => b.onclick = () => openSheet('adj', b.dataset.adj));
}

function openSheet(kind, pid) {
  const p = pid ? S.products.find(x => x.id === pid) : null;
  let title = '', body = '';
  if (kind === 'new') {
    title = 'Nouveau produit';
    body = `<label>Nom<input id="f-name" maxlength="120" required></label>
      <div class="row"><label>Catégorie<input id="f-cat" maxlength="60" placeholder="Divers"></label>
        <label>Unité<select id="f-unit">${Object.entries(UNITS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select></label></div>
      <div class="row"><label>Prix d'achat (FCFA)<input id="f-buy" type="number" inputmode="numeric" min="0" step="1" required></label>
        <label>Prix de vente (FCFA)<input id="f-sell" type="number" inputmode="numeric" min="0" step="1" required></label></div>
      <div class="row"><label>Quantité en stock<input id="f-qty" type="number" inputmode="decimal" min="0" step="any" value="0"></label>
        <label>Alerte stock bas<input id="f-alert" type="number" inputmode="decimal" min="0" step="any" value="0"></label></div>
      <label>Code-barres (facultatif)<input id="f-code" maxlength="32" autocomplete="off"></label>`;
  } else if (kind === 'recv') {
    title = 'Réception : ' + p.name;
    body = `<div class="row"><label>Quantité reçue<input id="f-qty" type="number" inputmode="decimal" min="0" step="any" required></label>
      <label>Prix d'achat unitaire (FCFA)<input id="f-cost" type="number" inputmode="numeric" min="0" step="1" value="${esc(S.costs[p.id] ?? 0)}" required></label></div>
      <div class="row"><label>Transport (FCFA)<input id="f-tr" type="number" inputmode="numeric" min="0" step="1" value="0"></label>
        <label>Fournisseur<input id="f-sup" maxlength="100"></label></div>`;
  } else {
    title = 'Ajuster le stock : ' + p.name;
    body = `<label>Type<select id="f-kind"><option value="loss">Perte (retire du stock)</option><option value="return">Retour (ajoute au stock)</option><option value="correction">Correction d'inventaire (+ ou −)</option></select></label>
      <label>Quantité<input id="f-qty" type="number" inputmode="decimal" step="any" required></label>
      <label>Motif (obligatoire)<input id="f-reason" maxlength="200" required></label>`;
  }
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2>${body}
    <div class="row"><button class="btn" type="submit">Enregistrer</button><button class="btn ghost" type="button" id="cancel">Annuler</button></div></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
    const num = id => Number($('#' + id).value);
    let res;
    if (kind === 'new') {
      res = await sb.rpc('create_product', {
        p_shop: S.shop.id, p_name: $('#f-name').value, p_category: $('#f-cat').value, p_unit: $('#f-unit').value,
        p_buy_price: Math.round(num('f-buy')), p_sell_price: Math.round(num('f-sell')),
        p_initial_qty: num('f-qty'), p_alert: num('f-alert'), p_barcode: $('#f-code').value.trim() || null });
    } else if (kind === 'recv') {
      res = await sb.rpc('receive_stock', {
        p_shop: S.shop.id, p_product: pid, p_qty: num('f-qty'), p_unit_cost: Math.round(num('f-cost')),
        p_transport: Math.round(num('f-tr')), p_supplier: $('#f-sup').value });
    } else {
      res = await sb.rpc('adjust_stock', {
        p_shop: S.shop.id, p_product: pid, p_kind: $('#f-kind').value, p_qty: num('f-qty'), p_reason: $('#f-reason').value });
    }
    if (res.error) { btn.disabled = false; return toast(cleanErr(res.error), true); }
    closeSheet(); toast('Enregistré.');
    await loadProducts(); S.summary = null; draw();
  };
  const first = $('#sheet input'); if (first) first.focus();
}
function closeSheet() { $('#sheet-host').innerHTML = ''; }

/* ===== Onglet Historique ===== */
async function viewHistory() {
  $('#view').innerHTML = '<p class="empty">Chargement…</p>';
  if (!S.sales) {
    const { data, error } = await sb.from('sales')
      .select('id,created_at,total,paid,status,customer_name,payment_method,cancel_reason,sale_items(quantity,unit_price,line_total,products(name,unit))')
      .eq('shop_id', S.shop.id).order('created_at', { ascending: false }).limit(50);
    if (error) { $('#view').innerHTML = ''; return toast(cleanErr(error), true); }
    S.sales = data || [];
  }
  $('#view').innerHTML = `<section class="stack"><h2>${isManager() ? 'Dernières ventes' : 'Mes dernières ventes'}</h2>
    ${S.sales.map(s => `<article class="sale ${s.status === 'cancelled' ? 'cancelled' : ''}">
      <div class="row" style="align-items:baseline"><b class="num">${money(s.total)}</b>
        <span class="muted" style="text-align:right">${dt(s.created_at)} · ${esc(PAY[s.payment_method])}</span></div>
      <ul>${(s.sale_items || []).map(i => `<li>${qty(i.quantity)} ${esc(UNITS[i.products?.unit] || '')} ${esc(i.products?.name)} · ${money(i.line_total)}</li>`).join('')}</ul>
      <div>${s.status === 'cancelled' ? `<span class="tag bad">Annulée</span> <span class="muted">${esc(s.cancel_reason)}</span>` : ''}
        ${s.status !== 'cancelled' && s.paid < s.total ? `<span class="tag warn">Crédit : reste ${money(s.total - s.paid)}</span> <span class="muted">${esc(s.customer_name)}</span>` : ''}</div>
      ${isManager() && s.status !== 'cancelled' ? `<div><button class="btn ghost small" data-cancel="${esc(s.id)}" ${canWrite() ? '' : 'disabled'}>Annuler cette vente</button></div>` : ''}
    </article>`).join('') || '<p class="empty">Aucune vente pour le moment.</p>'}</section>`;
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancelDialog(b.dataset.cancel));
}

function cancelDialog(id) {
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="Annuler la vente">
    <h2>Annuler la vente</h2><p class="muted">Le stock est remis. La vente reste visible dans l'historique.</p>
    <label>Motif (obligatoire)<input id="f-reason" maxlength="200" required></label>
    <div class="row"><button class="btn danger" type="submit">Annuler la vente</button><button class="btn ghost" type="button" id="cancel">Retour</button></div></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const { error } = await sb.rpc('cancel_sale', { p_sale: id, p_reason: $('#f-reason').value });
    if (error) return toast(cleanErr(error), true);
    closeSheet(); toast('Vente annulée.'); S.sales = null; S.summary = null;
    await loadProducts(); draw();
  };
  $('#f-reason').focus();
}

/* ===== Onglet Bilan (propriétaire et gérant) ===== */
async function viewReport() {
  $('#view').innerHTML = '<p class="empty">Chargement…</p>';
  const day = new Date(); day.setUTCHours(0, 0, 0, 0);
  const to = new Date(day.getTime() + 86400000);
  const days = { today: 1, week: 7, month: 30 }[S.range];
  const from = new Date(to.getTime() - days * 86400000);
  if (!S.summary || S.summary.range !== S.range) {
    const { data, error } = await sb.rpc('shop_summary', { p_shop: S.shop.id, p_from: from.toISOString(), p_to: to.toISOString() });
    if (error) { $('#view').innerHTML = ''; return toast(cleanErr(error), true); }
    S.summary = { range: S.range, d: data };
  }
  const d = S.summary.d;
  const M = (label, v, extra) => `<div class="metric"><span>${label}</span><b>${extra ? v : money(v)}</b></div>`;
  $('#view').innerHTML = `
    <section class="stack"><h2>Bilan</h2>
      <div class="seg">${[['today','Aujourd\'hui'],['week','7 jours'],['month','30 jours']].map(([k,l]) =>
        `<button class="btn ${S.range === k ? '' : 'ghost'} small" data-range="${k}">${l}</button>`).join('')}</div>
      <div class="grid2">
        ${M('Ventes', d.revenue)}${M('Encaissé', d.collected)}
        ${M('Nombre de ventes', d.sales_count, 1)}${M('Marge brute', d.gross_margin)}
        ${M('Dépenses', d.operating_expenses)}${M('Résultat estimé', d.net_estimate)}
      </div>
      ${d.low_stock_count > 0 ? `<div class="banner">${d.low_stock_count} produit(s) en stock bas.</div>` : ''}
      <p class="muted" style="font-size:13px">Le résultat est une estimation : marge brute moins dépenses et transport des achats. Les dates suivent l'heure du Burkina Faso (UTC).</p>
    </section>
    <section class="card stack"><h3>Ajouter une dépense</h3>
      <form id="exp" class="stack">
        <div class="row"><label>Catégorie<select id="e-cat">${Object.entries(EXP).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
          <label>Montant (FCFA)<input id="e-amt" type="number" inputmode="numeric" min="1" step="1" required></label></div>
        <label>Description<input id="e-desc" maxlength="200"></label>
        <button class="btn" type="submit" ${canWrite() ? '' : 'disabled'}>Enregistrer la dépense</button></form></section>`;
  document.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { S.range = b.dataset.range; viewReport(); });
  $('#exp').onsubmit = async ev => {
    ev.preventDefault();
    const { error } = await sb.rpc('add_expense', { p_shop: S.shop.id, p_category: $('#e-cat').value,
      p_amount: Math.round(Number($('#e-amt').value)), p_description: $('#e-desc').value || null });
    if (error) return toast(cleanErr(error), true);
    toast('Dépense enregistrée.'); S.summary = null; viewReport();
  };
}

boot().catch(e => fatal(e));
</script>
