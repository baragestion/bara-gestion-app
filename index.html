      <button class="btn ghost" id="pa-sell"><span>🛒</span>Vendre<small>ajouter au panier</small></button></div>`
      : '<button class="btn" id="pa-sell">🛒 Ajouter au panier</button>'}
    ${mgr && !isTracked(p) && devType(p.category) && p.unit === 'piece' && canWrite() && !S.offline ? '<button class="btn ghost" id="pa-track">🔢 Suivre chaque appareil par son IMEI</button>' : ''}
    ${mgr && p.barcode ? `<div class="muted" style="font-size:12.5px">Code ${esc(p.barcode)}</div>` : ''}
    <button class="btn ghost" id="cancel">Fermer</button></div></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#pa-sell').onclick = () => { closeSheet(); if (Number(p.stock_qty) <= 0 && !S.offline) return toast('Stock épuisé : ' + p.name, true); if (isTracked(p)) { go('sale'); return unitPicker(p.id); } addToCart(p.id); go('sale'); };
  const pa = $('#pa-arr'); if (pa) pa.onclick = () => arrival({ pid: p.id });
  const pe = $('#pa-exist'); if (pe) pe.onclick = () => arrival({ pid: p.id, existing: true });
  const pf = $('#pa-find'); if (pf) pf.onclick = findUnitSheet;
  const pt = $('#pa-track'); if (pt) pt.onclick = () => trackSheet(p);
  document.querySelectorAll('[data-unit-code]').forEach(b => b.onclick = () => unitSheet(b.dataset.unitCode));
  const r = $('#pa-recv'); if (r) r.onclick = () => openSheet('recv', pid);
  const e = $('#pa-edit'); if (e) e.onclick = () => openSheet('edit', pid);
  const a = $('#pa-adj'); if (a) a.onclick = () => openSheet('adj', pid);
}

// Champ quantité avec de gros boutons − et +.
const qtyField = (id, val, step, label) => `<label>${label}<div class="step" style="gap:8px"><button type="button" data-st="${id}" data-d="-${step}" aria-label="moins">−</button>
  <input id="${id}" type="number" inputmode="decimal" min="0" step="any" value="${esc(val)}" style="flex:1 1 auto;width:0;font-size:22px;height:50px" required>
  <button type="button" data-st="${id}" data-d="${step}" aria-label="plus">+</button></div></label>`;
const MORE = (inner, open) => `<details class="more"${open ? ' open' : ''}><summary>Plus de détails</summary><div class="stack" style="margin-top:10px">${inner}</div></details>`;

function openSheet(kind, pid) {
  const p = pid ? S.products.find(x => x.id === pid) : null;
  const cats = [...new Set(S.products.map(x => x.category).filter(Boolean))];
  const unitChips = sel => `<div class="chips" style="flex-wrap:wrap" role="radiogroup" aria-label="Unité">${Object.entries(UNITS).map(([k, v]) => `<button type="button" role="radio" aria-pressed="${k === sel}" aria-checked="${k === sel}" data-unit="${k}">${v}</button>`).join('')}</div><input type="hidden" id="f-unit" value="${sel}">`;
  const codeField = val => `<div class="row" style="align-items:flex-end;flex-wrap:nowrap">
      <label style="flex:1 1 auto">Code-barres du fabricant (sinon un code est créé)<input id="f-code" maxlength="32" autocomplete="off" value="${esc(val || '')}"></label>
      ${canScan() ? '<button class="btn ghost small" type="button" id="f-scan" style="flex:0 0 auto;margin-bottom:2px">📷</button>' : ''}</div>`;
  const big = 'style="font-size:20px;height:52px;font-weight:700"';
  let title = '', body = '';
  if (kind === 'new') {
    title = 'Nouveau produit';
    body = `<label>Nom du produit<input id="f-name" maxlength="120" required placeholder="ex. Ciment 50 kg" ${big}></label>
      <div class="muted" style="font-size:13px;font-weight:500">Vendu au (à la)</div>${unitChips('piece')}
      <div class="row"><label>Prix de vente (FCFA)<input id="f-sell" type="number" inputmode="numeric" min="0" step="1" required ${big}></label>
        <label>Prix d'achat (facultatif)<input id="f-buy" type="number" inputmode="numeric" min="0" step="1" placeholder="si vous savez" ${big}></label></div>
      ${qtyField('f-qty', 0, 1, 'Combien en avez-vous maintenant ?')}
      ${rayonField('f-cat', '')}
      ${MORE(`<label>Prévenir quand il reste moins de<input id="f-alert" type="number" inputmode="decimal" min="0" step="any" value="0"></label>${codeField('')}`)}
      <datalist id="cat-list">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`;
  } else if (kind === 'edit') {
    title = 'Modifier : ' + p.name;
    body = `<div class="row"><label>Prix de vente (FCFA)<input id="f-sell" type="number" inputmode="numeric" min="0" step="1" required value="${esc(p.sell_price)}" ${big}></label>
        <label>Prix d'achat (facultatif)<input id="f-buy" type="number" inputmode="numeric" min="0" step="1" value="${esc(S.costs[p.id] ?? '')}" placeholder="inconnu" ${big}></label></div>
      <label>Nom du produit<input id="f-name" maxlength="120" required value="${esc(p.name)}"></label>
      ${rayonField('f-cat', p.category)}
      ${kindField('f-kind', p.category, p.kind || (kindOf(p) === 'Autres' ? '' : kindOf(p)))}
      ${brandField('f-brand', p.brand || '')}
      ${famList(p).length > 1 ? `<div style="display:flex;align-items:center;gap:10px"><input id="f-catall" type="checkbox" checked style="width:22px;height:22px;flex:0 0 auto;margin:0"><label for="f-catall" style="font-size:14px;color:var(--fg);display:inline">Même rayon, type et marque pour toutes les tailles / variantes (${famList(p).length})</label></div>` : ''}
      ${MORE(`<label>Prévenir quand il reste moins de<input id="f-alert" type="number" inputmode="decimal" min="0" step="any" value="${esc(p.alert_threshold)}"></label>${codeField(p.barcode)}
        <div style="display:flex;align-items:center;gap:10px"><input id="f-off" type="checkbox" style="width:22px;height:22px;flex:0 0 auto;margin:0"><label for="f-off" style="font-size:14px;color:var(--fg);display:inline">Retirer ce produit de la vente (il reste dans l'historique)</label></div>`)}
      <datalist id="cat-list">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <p class="muted" style="margin:0;font-size:12.5px">Le nouveau prix vaut pour les prochaines ventes. Pour la quantité : « Arrivage » ou « Perte ou correction ».</p>`;
  } else if (kind === 'recv') {
    title = '📥 Arrivage : ' + p.name;
    body = `${qtyField('f-qty', '', 1, `Combien avez-vous reçu ? (${UNITS[p.unit]})`)}
      <label>Prix d'achat de chaque ${esc(UNITS[p.unit])} (facultatif)<input id="f-cost" type="number" inputmode="numeric" min="0" step="1" value="${esc(S.costs[p.id] ?? '')}" placeholder="si vous savez" ${big}></label>
      ${MORE(`<label>Transport payé (FCFA)<input id="f-tr" type="number" inputmode="numeric" min="0" step="1" value="0"></label>
        <label>Fournisseur<input id="f-sup" maxlength="100"></label>`)}
      <div class="muted" id="recv-info" style="font-size:13.5px"></div>`;
  } else {
    title = '➖ ' + p.name;
    body = `<div class="modes" role="radiogroup" aria-label="Type">
        <button type="button" data-k="loss" aria-pressed="true"><span class="mi">🗑️</span>Perte</button>
        <button type="button" data-k="return" aria-pressed="false"><span class="mi">↩️</span>Retour</button>
        <button type="button" data-k="correction" aria-pressed="false"><span class="mi">🔢</span>Correction</button></div>
      <input type="hidden" id="f-kind" value="loss">
      <div class="muted" id="adj-help" style="font-size:13px"></div>
      ${qtyField('f-qty', '', 1, 'Quantité')}
      <label>Pourquoi ?<input id="f-reason" maxlength="200" required placeholder="Touchez un choix ou écrivez"></label>
      <div class="quick" id="why-chips"></div>`;
  }
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2>${body}
    <div class="row"><button class="btn huge" type="submit">✓ Enregistrer</button></div><button class="btn ghost" type="button" id="cancel">Annuler</button></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  bindRayon('f-cat'); bindChips('f-kind'); bindChips('f-brand');
  if ($('#f-kind') && $('#f-cat')) $('#f-cat').addEventListener('input', () => { const k = $('#f-kind').value; const w = $('#f-kind-wrap'); if (w) { w.outerHTML = kindField('f-kind', $('#f-cat').value.trim(), k); bindChips('f-kind'); } });
  if (kind === 'new') $('#f-name').addEventListener('change', () => { if (!$('#f-cat').value.trim()) { const g = guessRayon($('#f-name').value); if (g) { $('#f-cat').value = g; $('#f-cat').dispatchEvent(new Event('input')); } } });
  document.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => { $('#f-unit').value = b.dataset.unit;
    document.querySelectorAll('[data-unit]').forEach(x => { x.setAttribute('aria-pressed', x === b); x.setAttribute('aria-checked', x === b); }); });
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { const i = $('#' + b.dataset.st);
    const v = Math.round(((Number(i.value) || 0) + Number(b.dataset.d)) * 1000) / 1000; i.value = kind === 'adj' && $('#f-kind').value === 'correction' ? v : Math.max(0, v); i.dispatchEvent(new Event('input', { bubbles: true })); });
  if (kind === 'recv') {
    const upd = () => { const q = Number($('#f-qty').value) || 0, c = Math.round(Number($('#f-cost').value) || 0);
      $('#recv-info').innerHTML = q > 0 ? `Nouveau stock : <b>${esc(qty(Number(p.stock_qty) + q))} ${esc(UNITS[p.unit])}</b>${$('#f-cost').value !== '' ? ' · coût total ' + esc(money(Math.round(q * c))) : ''}` : ''; };
    $('#sheet').addEventListener('input', upd); upd();
  }
  if (kind === 'adj') {
    $('#f-qty').removeAttribute('min');
    const WHY = { loss: ['Cassé', 'Abîmé', 'Périmé', 'Volé', 'Perdu'], return: ['Retour client', 'Erreur de vente'], correction: ['Comptage', 'Erreur de saisie'] };
    const HELP = { loss: 'Retire du stock (marchandise perdue).', return: 'Remet dans le stock (le client a rapporté).', correction: 'Corrige le stock : nombre positif pour ajouter, négatif (avec −) pour retirer.' };
    const setK = k => { $('#f-kind').value = k; document.querySelectorAll('[data-k]').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === k));
      $('#adj-help').textContent = HELP[k];
      $('#why-chips').innerHTML = WHY[k].map(w => `<button type="button" data-why="${esc(w)}">${esc(w)}</button>`).join('');
      document.querySelectorAll('[data-why]').forEach(x => x.onclick = () => { $('#f-reason').value = x.dataset.why; }); };
    document.querySelectorAll('[data-k]').forEach(x => x.onclick = () => setK(x.dataset.k));
    setK('loss');
  }
  let lossOk = false;
  // Prix de vente sous le prix d'achat (ou à 0) : souvent une erreur de saisie. On avertit sans interdire.
  if (kind === 'new' || kind === 'edit') {
    $('#sheet').addEventListener('input', ev => {
      if (!lossOk || !['f-buy', 'f-sell'].includes(ev.target.id)) return;
      lossOk = false; const w = $('#loss-warn'); if (w) w.remove();
      $('#sheet [type=submit]').textContent = '✓ Enregistrer';
    });
  }
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
    const num = id => Number($('#' + id).value);
    const optNum = id => $('#' + id).value === '' ? null : Math.round(Number($('#' + id).value));
    if ((kind === 'new' || kind === 'edit') && !lossOk) {
      const buy = optNum('f-buy'), sell = Math.round(num('f-sell'));
      if ($('#f-sell').value === '') { btn.disabled = false; return toast('Tapez le prix de vente.', true); }
      if ((buy != null && sell < buy) || sell === 0) {
        lossOk = true; btn.disabled = false; btn.textContent = 'Confirmer quand même';
        btn.closest('.row').insertAdjacentHTML('beforebegin', `<div class="banner bad" id="loss-warn">${sell === 0
          ? 'Attention : le prix de vente est à 0 FCFA. Le produit serait donné gratuitement.'
          : `Attention : vous vendrez à perte (vente ${esc(money(sell))} &lt; achat ${esc(money(buy))}). Vérifiez que les deux prix ne sont pas inversés.`}
          Corrigez les prix, ou touchez « Confirmer quand même ».</div>`);
        return;
      }
    }
    let res;
    if (kind === 'new') {
      res = await sb.rpc('create_product', {
        p_shop: S.shop.id, p_name: $('#f-name').value, p_category: $('#f-cat').value || 'Divers', p_unit: $('#f-unit').value,
        p_buy_price: optNum('f-buy'), p_sell_price: Math.round(num('f-sell')),
        p_initial_qty: num('f-qty'), p_alert: num('f-alert'), p_barcode: $('#f-code').value.trim() || null });
    } else if (kind === 'edit') {
      const sell = Math.round(num('f-sell')), buy = optNum('f-buy');
      if (!($('#f-sell').value !== '' && sell >= 0) || (buy != null && !(buy >= 0))) {
        btn.disabled = false; return toast('Prix invalide.', true);
      }
      res = await sb.rpc('update_product', {
        p_product: pid, p_name: $('#f-name').value.trim(), p_category: $('#f-cat').value, p_sell_price: sell,
        p_buy_price: buy, p_alert: num('f-alert'), p_active: $('#f-off').checked ? false : null,
        p_barcode: $('#f-code').value.trim() || null });
      // Même rayon, type et marque pour toutes les variantes de ce produit (« … · 40 », « … · 41 »…).
      const fam = $('#f-catall') && $('#f-catall').checked ? famList(p) : [p];
      if (!res.error && $('#f-catall') && $('#f-catall').checked && $('#f-cat').value.trim()) {
        for (const q of fam.filter(q => q.id !== pid && q.category !== $('#f-cat').value.trim())) {
          const r2 = await sb.rpc('update_product', { p_product: q.id, p_category: $('#f-cat').value.trim() });
          if (r2.error) { res = r2; break; }
        }
      }
      if (!res.error && $('#f-kind')) {
        const r3 = await sb.rpc('set_product_tags', { p_products: fam.map(q => q.id), p_kind: $('#f-kind').value.trim(), p_brand: $('#f-brand').value.trim() });
        if (r3.error) toast(/set_product_tags/.test(r3.error.message || '') ? 'Type et marque : installez d\'abord la mise à jour 018 dans Supabase.' : cleanErr(r3.error), true);
      }
    } else if (kind === 'recv') {
      if (!(num('f-qty') > 0)) { btn.disabled = false; return toast('Tapez la quantité reçue.', true); }
      res = await sb.rpc('receive_stock', {
        p_shop: S.shop.id, p_product: pid, p_qty: num('f-qty'), p_unit_cost: optNum('f-cost'),
        p_transport: Math.round(num('f-tr')), p_supplier: $('#f-sup').value });
    } else {
      res = await sb.rpc('adjust_stock', {
        p_shop: S.shop.id, p_product: pid, p_kind: $('#f-kind').value, p_qty: num('f-qty'), p_reason: $('#f-reason').value });
    }
    if (res.error) { btn.disabled = false; return toast(cleanErr(res.error), true); }
    closeSheet(); toast('Enregistré ✓');
    await loadProducts(); S.summary = null; draw();
  };
  const fs = $('#f-scan');
  if (fs) fs.onclick = () => openScanner('Scanner le code du fabricant', code => {
    const other = findByCode(code);
    if (other && other.id !== pid) { toast('Ce code est déjà utilisé par : ' + other.name, true); return true; }
    $('#f-code').value = code; toast('Code lu : ' + code); return false;
  });
  const first = $('#sheet input:not([type=hidden])'); if (first && kind !== 'adj') first.focus();
}
function closeSheet() { $('#sheet-host').innerHTML = ''; stopScan(); }

/* ===== Comptage de stock (propriétaire et gérant, en ligne uniquement) =====
   Chaque quantité saisie est enregistrée tout de suite dans la base, avec le stock attendu à
   ce moment-là. Le gérant ne voit pas la quantité attendue (comptage « à l'aveugle ») et
   envoie son comptage au propriétaire, qui valide. */
async function loadCountState() {
  S.countPending = false;
  if (!isManager() || S.offline) return;
  try {
    const { data } = await sb.from('stock_counts').select('id,status').eq('shop_id', S.shop.id).in('status', ['open', 'submitted']).limit(1);
    S.countPending = !!(data && data[0] && (data[0].status === 'submitted' ? S.role === 'owner' : true)) && data[0].status;
  } catch (e) {}
}

async function viewCount() {
  stopScan();
  if (S.offline) { $('#view').innerHTML = '<div class="banner bad">Le comptage demande une connexion internet.</div>'; return; }
  $('#view').innerHTML = '<p class="empty">Chargement…</p>';
  const [act, past] = await Promise.all([
    sb.from('stock_counts').select('*').eq('shop_id', S.shop.id).in('status', ['open', 'submitted']).limit(1),
    sb.from('stock_counts').select('*').eq('shop_id', S.shop.id).in('status', ['applied', 'cancelled']).order('created_at', { ascending: false }).limit(8)]);
  if (act.error || past.error) { $('#view').innerHTML = ''; return toast(cleanErr(act.error || past.error), true); }
  await ensureNames();
  const c = (act.data || [])[0];
  if (!c) return countStartScreen(past.data || []);
  const { data: lines, error } = await sb.from('stock_count_lines').select('product_id,expected,counted').eq('count_id', c.id);
  if (error) { $('#view').innerHTML = ''; return toast(cleanErr(error), true); }
  S.count = { c, lines: {} };
  (lines || []).forEach(l => { S.count.lines[l.product_id] = { counted: Number(l.counted), expected: Number(l.expected) }; });
  if (c.status === 'submitted') return S.role === 'owner' ? countReview() : countWaiting();
  countEntryScreen();
}

function countStartScreen(past) {
  const cats = [...new Set(S.products.map(p => p.category))].sort();
  const who = id => esc((S.names && S.names[id]) || '');
  $('#view').innerHTML = `
    <section class="card stack">
      <h2>Comptage de stock</h2>
      <p class="muted" style="margin:0;font-size:13.5px">Comptez ce qu'il y a vraiment en rayon. L'application compare avec son stock et montre les écarts. ${S.role === 'owner' ? '' : 'Votre comptage sera validé par le propriétaire.'}</p>
      <label>Que compter ?<select id="ct-cat"><option value="">Toute la boutique (${S.products.length} produits)</option>
        ${cats.map(k => `<option value="${esc(k)}">${esc(k)} (${S.products.filter(p => p.category === k).length})</option>`).join('')}</select></label>
      <button class="btn" id="ct-start" ${canWrite() ? '' : 'disabled'}>Démarrer le comptage</button>
      <button class="btn ghost" id="ct-back">Retour aux produits</button>
    </section>
    ${S.role === 'owner' ? `<section class="card stack"><h3 style="margin:0">Alerte de grand écart</h3>
      <form id="ct-thr" class="row" style="align-items:flex-end"><label>Prévenir si un écart dépasse (FCFA)<input id="ct-thr-v" type="number" min="0" step="500" value="10000"></label>
      <button class="btn ghost small" type="submit" style="flex:0 0 auto">Enregistrer</button></form></section>` : ''}
    <section class="card stack"><h3 style="margin:0">Comptages précédents</h3>
      ${past.length ? past.map(x => `<div class="row muted" style="font-size:13.5px"><span>${dt(x.created_at)} · ${esc(x.category || 'toute la boutique')} · ${who(x.created_by)}</span>
        <span style="text-align:right">${x.status === 'cancelled' ? 'annulé' : `${x.loss_value ? `<b style="color:var(--bad)">−${money(x.loss_value)}</b>` : ''} ${x.gain_value ? `+${money(x.gain_value)}` : ''}${!x.loss_value && !x.gain_value ? 'aucun écart' : ''}`}</span></div>`).join('')
        : '<p class="muted" style="margin:0">Aucun comptage pour le moment.</p>'}</section>`;
  $('#ct-back').onclick = () => { S.tab = 'products'; draw(); };
  $('#ct-start').onclick = async () => {
    const { error } = await sb.rpc('start_stock_count', { p_shop: S.shop.id, p_category: $('#ct-cat').value || null });
    if (error) return toast(cleanErr(error), true);
    viewCount();
  };
  const thr = $('#ct-thr');
  if (thr) thr.onsubmit = async ev => {
    ev.preventDefault();
    const { error } = await sb.rpc('set_count_alert_threshold', { p_shop: S.shop.id, p_amount: Math.round(Number($('#ct-thr-v').value) || 0) });
    if (error) return toast(cleanErr(error), true);
    toast('Seuil enregistré.');
  };
}

function countProducts() {
  const cat = S.count.c.category;
  return S.products.filter(p => (!cat || p.category === cat) && !isTracked(p));   // appareils : contrôlés par scan
}

function countEntryScreen() {
  const c = S.count.c, list = countProducts();
  const done = list.filter(p => S.count.lines[p.id]).length;
  const owner = S.role === 'owner';
  $('#view').innerHTML = `
    <section class="card stack">
      <h2>Comptage en cours</h2>
      <div class="muted" style="font-size:13.5px">${esc(c.category || 'Toute la boutique')} · démarré le ${dt(c.created_at)} · <b id="ct-done">${done}</b> / ${list.length} produits comptés</div>
      ${owner ? '' : '<div class="muted" style="font-size:13px">Comptez sans regarder l\'écran du stock : tapez seulement ce que vous voyez.</div>'}
      <div class="row" style="align-items:flex-end;flex-wrap:nowrap">
        <label style="flex:1 1 auto">Chercher un produit<input id="ct-q" type="search" autocomplete="off" placeholder="Nom ou code"></label>
        ${canScan() ? '<button class="btn small" type="button" id="ct-scan" style="flex:0 0 auto;margin-bottom:2px">📷 Scanner</button>' : ''}</div>
    </section>
    <section class="card stack"><div class="plist" id="ct-list"></div></section>
    <section class="card stack">
      ${owner ? `<button class="btn" id="ct-review">Voir les écarts et valider</button>` : `<button class="btn" id="ct-submit">Terminer et envoyer au propriétaire</button>`}
      <div class="row"><button class="btn ghost" id="ct-back">Retour aux produits</button>
        <button class="btn ghost" id="ct-cancel" style="color:var(--bad)">Annuler le comptage</button></div>
    </section>`;
  const drawList = () => {
    const t = ($('#ct-q').value || '').trim().toLowerCase();
    const rows = list.filter(p => !t || p.name.toLowerCase().includes(t) || (p.barcode || '').toLowerCase() === t);
    $('#ct-list').innerHTML = rows.map(p => {
      const l = S.count.lines[p.id];
      return `<div class="row" style="align-items:center;flex-wrap:nowrap" id="ct-row-${esc(p.id)}">
        <div style="flex:1 1 auto;min-width:0"><div class="nm" style="overflow-wrap:anywhere">${esc(p.name)}</div>
          <div class="sub muted">${esc(UNITS[p.unit])}${owner ? ` · attendu ${qty(p.stock_qty)}` : ''} <span data-st="${esc(p.id)}">${l ? '✓ compté' : ''}</span></div></div>
        <input type="number" inputmode="decimal" min="0" step="${WHOLE.includes(p.unit) ? 1 : 0.001}" data-ct="${esc(p.id)}"
          value="${l ? esc(l.counted) : ''}" placeholder="?" style="width:90px;flex:0 0 auto" aria-label="Quantité comptée ${esc(p.name)}"></div>`;
    }).join('') || '<p class="empty">Aucun produit.</p>';
    document.querySelectorAll('[data-ct]').forEach(i => i.onchange = () => saveCountLine(i));
  };
  drawList();
  $('#ct-q').oninput = drawList;
  const sc = $('#ct-scan');
  if (sc) sc.onclick = () => openScanner('Scanner un produit à compter', code => {
    const p = findByCode(code);
    if (!p) { toast('Aucun produit avec le code ' + code + '.', true); return true; }
    if (!list.includes(p)) { toast(p.name + ' ne fait pas partie de ce comptage (' + (c.category || '') + ').', true); return true; }
    $('#ct-q').value = ''; drawList();
    setTimeout(() => { const i = document.querySelector(`[data-ct="${p.id}"]`); if (i) { i.scrollIntoView({ block: 'center' }); i.focus(); } }, 50);
    toast(p.name + ' : tapez la quantité comptée.');
    return false;
  });
  $('#ct-back').onclick = () => { S.tab = 'products'; draw(); };
  $('#ct-cancel').onclick = cancelCount;
  const rv = $('#ct-review'); if (rv) rv.onclick = countReview;
  const sb2 = $('#ct-submit');
  if (sb2) sb2.onclick = async () => {
    if (!Object.keys(S.count.lines).length) return toast('Aucun produit compté.', true);
    const left = list.length - list.filter(p => S.count.lines[p.id]).length;
    if (left && !sb2.dataset.sure) { sb2.dataset.sure = '1'; sb2.textContent = `Envoyer quand même (${left} non comptés)`; return; }
    const { error } = await sb.rpc('submit_stock_count', { p_count: c.id });
    if (error) return toast(cleanErr(error), true);
    toast('Comptage envoyé au propriétaire pour validation.'); await loadCountState(); viewCount();
  };
}

async function saveCountLine(i) {
  const pid = i.dataset.ct, st = document.querySelector(`[data-st="${pid}"]`);
  if (i.value.trim() === '') return;
  const v = Number(i.value);
  if (st) st.textContent = 'enregistrement…';
  const { error } = await sb.rpc('record_count_line', { p_count: S.count.c.id, p_product: pid, p_counted: v });
  if (error) {
    if (st) st.innerHTML = '<b style="color:var(--bad)">✗ non enregistré</b>';
    return toast(cleanErr(error), true);
  }
  const p = S.products.find(x => x.id === pid);
  S.count.lines[pid] = { counted: v, expected: p ? Number(p.stock_qty) : 0 };
  if (st) st.textContent = '✓ compté';
  const d = $('#ct-done'); if (d) d.textContent = countProducts().filter(x => S.count.lines[x.id]).length;
}

async function cancelCount() {
  const b = $('#ct-cancel');
  if (b && !b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Confirmer l\'annulation'; return; }
  const { error } = await sb.rpc('cancel_stock_count', { p_count: S.count.c.id });
  if (error) return toast(cleanErr(error), true);
  toast('Comptage annulé : le stock n\'a pas été modifié.'); await loadCountState(); viewCount();
}

function countWaiting() {
  $('#view').innerHTML = `<section class="card stack"><h2>Comptage envoyé</h2>
    <p>Votre comptage du ${dt(S.count.c.created_at)} attend la validation du propriétaire. Le stock sera corrigé quand il l'aura validé.</p>
    <button class="btn ghost" id="ct-back">Retour aux produits</button></section>`;
  $('#ct-back').onclick = () => { S.tab = 'products'; draw(); };
}

// Propriétaire : écarts (stock attendu au moment de la saisie, valeur au prix d'achat), puis validation.
async function countReview() {
  const { data, error } = await sb.from('stock_count_lines').select('product_id,expected,counted,counted_by').eq('count_id', S.count.c.id);
  if (error) return toast(cleanErr(error), true);
  const c = S.count.c, list = countProducts();
  const rows = (data || []).map(l => {
    const p = S.products.find(x => x.id === l.product_id) || { name: 'Produit retiré', unit: 'piece' };
    const diff = Number(l.counted) - Number(l.expected), cost = Number(S.costs[l.product_id] ?? p.sell_price ?? 0);   // prix d'achat inconnu : prix de vente (comme la base)
    return { p, exp: Number(l.expected), cnt: Number(l.counted), diff, val: Math.round(diff * cost) };
  }).sort((a, b) => Math.abs(b.val) - Math.abs(a.val));
  const loss = rows.filter(r => r.val < 0).reduce((s, r) => s - r.val, 0), gain = rows.filter(r => r.val > 0).reduce((s, r) => s + r.val, 0);
  const left = list.length - list.filter(p => rows.some(r => r.p.id === p.id)).length;
  const gaps = rows.filter(r => r.diff !== 0);
  $('#view').innerHTML = `
    <section class="card stack">
      <h2>Écarts du comptage</h2>
      <div class="muted" style="font-size:13.5px">${esc(c.category || 'Toute la boutique')} · ${dt(c.created_at)} · par ${esc((S.names && S.names[c.created_by]) || '')}${c.status === 'submitted' ? ' · envoyé pour validation' : ''}</div>
      <div class="grid2"><div class="metric"><span>Manquants (valeur d'achat)</span><b style="color:var(--bad)">${money(loss)}</b></div>
        <div class="metric"><span>En trop (valeur d'achat)</span><b>${money(gain)}</b></div></div>
      ${left ? `<div class="banner">${left} produit(s) non compté(s) : leur stock ne sera pas modifié.</div>` : ''}
      ${gaps.length ? gaps.map(r => `<div class="row" style="font-size:14px;align-items:baseline">
          <span style="flex:1 1 auto"><b>${esc(r.p.name)}</b><br><span class="muted">attendu ${qty(r.exp)} · compté ${qty(r.cnt)}</span></span>
          <span style="text-align:right;flex:0 0 auto"><b style="color:${r.diff < 0 ? 'var(--bad)' : 'inherit'}">${r.diff > 0 ? '+' : ''}${qty(r.diff)} ${esc(UNITS[r.p.unit] || '')}</b><br>
          <span class="muted">${r.val > 0 ? '+' : ''}${money(r.val)}</span></span></div>`).join('')
        : '<div class="banner ok">Aucun écart : le stock de l\'application correspond au comptage.</div>'}
      <p class="muted" style="margin:0;font-size:12.5px">Les écarts sont calculés avec le stock au moment où chaque produit a été compté : les ventes faites pendant le comptage sont prises en compte.</p>
      <button class="btn" id="ct-apply" ${canWrite() && rows.length ? '' : 'disabled'}>Valider et corriger le stock</button>
      <div class="row">${c.status === 'open' ? '<button class="btn ghost" id="ct-edit">Revenir à la saisie</button>' : ''}
        <button class="btn ghost" id="ct-cancel" style="color:var(--bad)">Annuler le comptage</button></div>
    </section>`;
  const ed = $('#ct-edit'); if (ed) ed.onclick = countEntryScreen;
  $('#ct-cancel').onclick = cancelCount;
  $('#ct-apply').onclick = async () => {
    const b = $('#ct-apply'); b.disabled = true; b.textContent = 'Correction du stock…';
    const { data: res, error: e2 } = await sb.rpc('apply_stock_count', { p_count: c.id });
    if (e2) { b.disabled = false; b.textContent = 'Valider et corriger le stock'; return toast(cleanErr(e2), true); }
    toast(`Stock corrigé : ${res.corrections} produit(s). Manquants ${money(res.loss_value)}, en trop ${money(res.gain_value)}.`);
    await Promise.all([loadProducts(), loadCountState(), loadAlertCount()]);
    S.summary = null; draw();
  };
}

/* ===== Caisse (ouverture, opérations, fermeture) =====
   Fermeture « à l'aveugle » : le vendeur tape ce qu'il compte ; seuls le propriétaire et le
   gérant voient le montant attendu et l'écart. Les calculs sont faits par la base. */
const DENOMS = [10000, 5000, 2000, 1000, 500, 250, 200, 100, 50, 25, 10, 5];

async function loadCash() {
  S.cash = null;
  if (S.offline) return;
  try { const { data, error } = await sb.rpc('cash_status', { p_shop: S.shop.id }); if (!error) S.cash = data; } catch (e) {}
  // Pastille de l'en-tête mise à jour tout de suite (caisse ouverte / fermée).
  const c = document.getElementById('cashb');
  if (c && S.cash) { c.className = 'cashpill ' + (S.cash.open ? 'on' : 'off'); c.textContent = '💰 ' + (S.cash.open ? 'Ouverte' : 'Fermée'); }
}

async function viewCash() {
  $('#view').innerHTML = '<p class="empty">Chargement…</p>';
  await loadCash();
  if (!S.cash) { $('#view').innerHTML = '<div class="banner bad">La caisse demande une connexion internet.</div>'; return; }
  await ensureNames();
  const mgr = isManager(), who = id => esc((S.names && S.names[id]) || '');
  let cur = null, past = [];
  if (mgr) {
    const [c, p] = await Promise.all([sb.rpc('cash_current', { p_shop: S.shop.id }),
      sb.from('cash_sessions').select('*').eq('shop_id', S.shop.id).eq('status', 'closed').order('closed_at', { ascending: false }).limit(10)]);
    cur = c.data || null; past = p.data || [];
  }
  const L = (label, v, strong, neg) => `<div class="row" style="font-size:14.5px"><span>${label}</span><span class="num" style="text-align:right${strong ? ';font-weight:700' : ''}">${neg && v ? '− ' : ''}${money(v)}</span></div>`;
  const hist = mgr ? `<section class="card stack"><h3 style="margin:0">Dernières fermetures</h3>
    ${past.length ? past.map(x => `<div class="row" style="font-size:13.5px;align-items:baseline">
      <span class="muted">${dt(x.closed_at)} · ${who(x.closed_by)}</span>
      <span style="text-align:right">compté ${money(x.counted)}<br><b style="color:${x.gap < 0 ? 'var(--bad)' : x.gap > 0 ? 'inherit' : 'var(--ok, inherit)'}">${x.gap === 0 ? '✓ juste' : (x.gap > 0 ? '+' : '−') + ' ' + money(Math.abs(x.gap))}</b>${x.mobile_money ? `<br><span class="muted">Mobile Money ${money(x.mobile_money)}</span>` : ''}</span></div>`).join('')
      : '<p class="muted" style="margin:0">Aucune fermeture pour le moment.</p>'}</section>` : '';
  if (!S.cash.open) {
    $('#view').innerHTML = `<section class="card stack"><h2>Caisse fermée</h2>
      <p class="muted" style="margin:0">Le matin, comptez la monnaie de départ dans le tiroir, puis ouvrez la caisse.</p>
      <label>Monnaie dans le tiroir ce matin (FCFA)<input id="cs-float" type="number" inputmode="numeric" min="0" step="5" value="${esc(S.cash.suggested_float || 0)}" style="font-size:22px;height:56px;font-weight:700"></label>
      <button class="btn huge" id="cs-open" ${canWrite() ? '' : 'disabled'}>🔓 Ouvrir la caisse</button></section>${hist}`;
    $('#cs-open').onclick = async () => {
      const v = Math.round(Number($('#cs-float').value));
      if (!(v >= 0)) return toast('Fonds de caisse invalide.', true);
      const { error } = await sb.rpc('open_cash', { p_shop: S.shop.id, p_float: v });
      if (error) return toast(cleanErr(error), true);
      toast('Caisse ouverte.'); draw();
    };
    return;
  }
  $('#view').innerHTML = `<section class="card stack"><h2>Caisse ouverte</h2>
      <div class="muted" style="font-size:13.5px">Depuis ${dt(S.cash.opened_at)} · ouverte par ${who(S.cash.opened_by)}</div>
      ${cur ? `<div class="stack" style="gap:4px">${L('Fonds de caisse', cur.opening_float)}${L('Ventes en espèces', cur.cash_sales)}
        ${cur.repayments ? L('Dépôts des clients (dettes et avances)', cur.repayments) : ''}${cur.advance_refunds ? L('Avances rendues', cur.advance_refunds, false, true) : ''}
        ${cur.cash_refunds ? L('Ventes annulées (argent rendu)', cur.cash_refunds, false, true) : ''}${cur.deposits ? L('Dépôts', cur.deposits) : ''}
        ${cur.expenses_cash ? L('Dépenses payées en caisse', cur.expenses_cash, false, true) : ''}${cur.withdrawals ? L('Retraits', cur.withdrawals, false, true) : ''}
        <div class="total"><span>Attendu dans la caisse</span><span class="num">${money(cur.expected)}</span></div>
        ${L('Mobile Money (à vérifier sur le compte)', cur.mobile_money)}</div>` : ''}
      <div class="bigacts">
        <button class="btn ghost" id="cs-exp" ${canWrite() ? '' : 'disabled'}><span>🧾</span>Dépense<small>payée avec la caisse</small></button>
        ${mgr ? `<button class="btn ghost" id="cs-wd" ${canWrite() ? '' : 'disabled'}><span>📤</span>Retrait<small>argent sorti</small></button>
        <button class="btn ghost" id="cs-dep" ${canWrite() ? '' : 'disabled'}><span>📥</span>Dépôt<small>monnaie ajoutée</small></button>` : ''}</div>
      <button class="btn huge" id="cs-close" ${canWrite() ? '' : 'disabled'}>🔒 Fermer la caisse (le soir)</button></section>${hist}`;
  $('#cs-exp').onclick = () => cashMoveSheet('expense');
  const wd = $('#cs-wd'); if (wd) wd.onclick = () => cashMoveSheet('withdrawal');
  const dp = $('#cs-dep'); if (dp) dp.onclick = () => cashMoveSheet('deposit');
  $('#cs-close').onclick = cashCloseSheet;
}

function cashMoveSheet(kind) {
  const T = { expense: 'Dépense payée en caisse', withdrawal: 'Retrait d\'argent', deposit: 'Dépôt d\'argent (monnaie ajoutée)' }[kind];
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="${esc(T)}">
    <h2>${esc(T)}</h2>
    <label>Montant (FCFA)<input id="m-amt" type="number" inputmode="numeric" min="1" step="1" required></label>
    ${kind === 'expense' ? `<label>Catégorie<select id="m-cat">${Object.entries(EXP).map(([k, v]) => `<option value="${k}" ${k === 'other' ? 'selected' : ''}>${v}</option>`).join('')}</select></label>` : ''}
    <label>Motif (obligatoire)<input id="m-why" maxlength="200" required placeholder="${kind === 'withdrawal' ? 'ex. versé à la banque' : kind === 'deposit' ? 'ex. monnaie apportée' : 'ex. achat de sachets'}"></label>
    <div class="row"><button class="btn" type="submit">Enregistrer</button><button class="btn ghost" type="button" id="cancel">Annuler</button></div></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
    const { error } = await sb.rpc('cash_movement', { p_shop: S.shop.id, p_kind: kind, p_amount: Math.round(Number($('#m-amt').value)),
      p_reason: $('#m-why').value, p_category: kind === 'expense' ? $('#m-cat').value : 'other' });
    if (error) { btn.disabled = false; return toast(cleanErr(error), true); }
    closeSheet(); toast('Enregistré.'); S.summary = null; viewCash();
  };
}

// Couleurs proches des billets et pièces de franc CFA, pour les reconnaître d'un coup d'œil.
const DENOM_LOOK = { 10000: ['#D9E7F7', '#1D4F91'], 5000: ['#F6E3D3', '#8A4B12'], 2000: ['#E5EED8', '#4D6B1F'], 1000: ['#EDE3F3', '#6941C6'],
  500: ['#F0E2B6', '#7A5600'], 250: ['#E2E4E2', '#3F4A43'], 200: ['#F0E2B6', '#7A5600'], 100: ['#E2E4E2', '#3F4A43'], 50: ['#E2E4E2', '#3F4A43'], 25: ['#F0E2B6', '#7A5600'], 10: ['#F0E2B6', '#7A5600'], 5: ['#E2E4E2', '#3F4A43'] };
function cashCloseSheet() {
  const cnt = {};
  const piece = d => { const [bg, fg] = DENOM_LOOK[d] || ['#eee', '#333'];          // billets en rectangle, pièces en rond
    return `<span class="${d >= 1000 ? 'bill' : 'coin'}" style="background:${bg};color:${fg}">${plainMoney(d)}</span>`; };
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="Fermer la caisse">
    <h2>💰 Compter l'argent</h2>
    <p class="muted" style="margin:0;font-size:13.5px">Pour chaque billet et pièce, touchez + autant de fois que vous en avez.</p>
    <div>${DENOMS.map(d => `<div class="denom">${piece(d)}
      <div class="step"><button type="button" data-dm="${d}" aria-label="un billet de ${d} en moins">−</button>
        <input type="number" inputmode="numeric" min="0" step="1" data-dn="${d}" placeholder="0" aria-label="Nombre de ${d}" style="width:58px">
        <button type="button" data-dp="${d}" aria-label="un billet de ${d} en plus">+</button></div></div>`).join('')}</div>
    <div class="metric" style="text-align:center"><span>Total compté</span><b id="c-show" style="font-size:30px">0 FCFA</b></div>
    ${MORE(`<label>Ou tapez seulement le total (FCFA)<input id="c-total" type="number" inputmode="numeric" min="0" step="5"></label>
      <label>Remarque (facultatif)<input id="c-note" maxlength="300"></label>`)}
    <div class="banner" style="margin:0">Vous emportez l'argent du soir ? Faites d'abord un <b>Retrait</b>.</div>
    <button class="btn huge" type="submit">🔒 Fermer la caisse</button><button class="btn ghost" type="button" id="cancel">Annuler</button></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  let byDenoms = false;
  const total = () => { const t = $('#c-total').value; return byDenoms || t === '' ? DENOMS.reduce((a, d) => a + (cnt[d] || 0) * d, 0) : Math.round(Number(t)); };
  const show = () => { $('#c-show').textContent = money(total()); };
  const setD = (d, n) => { cnt[d] = Math.max(0, Math.round(n) || 0); const i = document.querySelector(`[data-dn="${d}"]`); i.value = cnt[d] || '';
    byDenoms = DENOMS.some(x => cnt[x]); if (byDenoms) $('#c-total').value = ''; show(); };
  document.querySelectorAll('[data-dp]').forEach(b => b.onclick = () => setD(b.dataset.dp, (cnt[b.dataset.dp] || 0) + 1));
  document.querySelectorAll('[data-dm]').forEach(b => b.onclick = () => setD(b.dataset.dm, (cnt[b.dataset.dm] || 0) - 1));
  document.querySelectorAll('[data-dn]').forEach(i => i.oninput = () => setD(i.dataset.dn, Number(i.value)));
  $('#c-total').oninput = () => { if ($('#c-total').value !== '') { DENOMS.forEach(d => { cnt[d] = 0; document.querySelector(`[data-dn="${d}"]`).value = ''; }); byDenoms = false; } show(); };
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('[type=submit]');
    const t = total();
    if (!(t >= 0)) return toast('Total invalide.', true);
    if (!btn.dataset.sure) { btn.dataset.sure = '1'; btn.textContent = `Confirmer : ${plainMoney(t)} FCFA`; return; }
    btn.disabled = true;
    let denoms = null;
    if (byDenoms) { denoms = {}; DENOMS.forEach(d => { if (cnt[d]) denoms[d] = cnt[d]; }); }
    const { data, error } = await sb.rpc('close_cash', { p_shop: S.shop.id, p_counted: t, p_denoms: denoms, p_note: $('#c-note').value || null });
    if (error) { btn.disabled = false; btn.dataset.sure = ''; btn.textContent = '🔒 Fermer la caisse'; return toast(cleanErr(error), true); }
    closeSheet();
    if (data && data.gap !== undefined) {
      toast(data.gap === 0 ? 'Caisse fermée : le compte est juste ✓' : `Caisse fermée. Écart : ${data.gap > 0 ? '+' : '−'} ${money(Math.abs(data.gap))} (attendu ${money(data.expected)}).`, data.gap < 0);
    } else toast('Caisse fermée. Merci, le propriétaire verra le résultat.');
    await loadAlertCount(); draw();
  };
}

/* ===== Clients, crédit et remboursements =====
   Une vente à crédit exige une fiche client (avec téléphone). Les soldes sont calculés par la base.
   Remboursement : tout membre ; en espèces, il entre dans la caisse du jour. */
const canCredit = () => S.role === 'owner' || S.role === 'manager' || !!(S.shop && S.shop.creditAllowed);

async function loadCustomers(force) {
  if (S.offline) { if (!S.customers) S.customers = (readCache() || {}).customers || []; return S.customers; }
  if (S.customers && !force) return S.customers;
  const { data, error } = await sb.rpc('customer_list', { p_shop: S.shop.id });
  if (error) { toast(cleanErr(error), true); return S.customers || []; }
  S.customers = data || [];
  if (canCredit()) saveCache();      // gardés sur le téléphone pour le crédit hors ligne (clients connus seulement)
  return S.customers;
}

// Lien WhatsApp vers le client : numéro à 8 chiffres = Burkina Faso (+226).
function waNumber(phone) {
  const d = String(phone || '').replace(/[^0-9]/g, '');
  if (!d) return '';
  return String(phone).trim().startsWith('+') ? d : (d.length === 8 ? '226' + d : d);
}

// Choix du client dans le panier (vente à crédit ou client nommé).
async function pickCustomer() {
  const list = await loadCustomers();
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-label="Choisir le client">
    <h2>Choisir le client</h2>
    <input id="pk-q" type="search" placeholder="Nom ou téléphone" autocomplete="off">
    <div class="plist" id="pk-list" style="max-height:45vh;overflow:auto"></div>
    ${!S.offline ? '<button class="btn ghost" id="pk-new">+ Nouveau client</button>' : ''}
    ${S.offline ? '<p class="muted" style="margin:0;font-size:13px">Hors ligne : seulement les clients déjà enregistrés.</p>' : ''}
    <div class="row"><button class="btn ghost" id="pk-none">Sans client</button><button class="btn ghost" id="cancel">Fermer</button></div></div></div>`;
  const draw1 = () => {
    const t = ($('#pk-q').value || '').trim().toLowerCase(), td = t.replace(/[^0-9]/g, '');
    const rows = list.filter(c => c.active !== false && (!t || c.name.toLowerCase().includes(t) || (td && (c.phone || '').includes(td)))).slice(0, 50);
    $('#pk-list').innerHTML = rows.map(c => `<button class="prod" data-pk="${esc(c.id)}"><span><span class="nm">${esc(c.name)}</span><br>
      <span class="sub">${esc(c.phone || 'sans téléphone')}</span></span>${balTag(c.balance)}</button>`).join('')
      || '<p class="empty">Aucun client trouvé.</p>';
    document.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => {
      const c = list.find(x => x.id === b.dataset.pk);
      if (!c.phone) return toast('Ajoutez d\'abord le téléphone de ce client (onglet Clients, Modifier).', true);
      S.custSel = { id: c.id, name: c.name, phone: c.phone, balance: c.balance }; closeSheet(); drawCart();
    });
  };
  draw1();
  $('#pk-q').oninput = draw1;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#pk-none').onclick = () => { S.custSel = null; closeSheet(); drawCart(); };
  const nw = $('#pk-new'); if (nw) nw.onclick = () => customerForm(null, c => { S.custSel = { id: c.id, name: c.name, phone: c.phone, balance: c.balance }; drawCart(); });
}

// Pastille ronde avec les initiales : rouge s'il doit, verte s'il a une avance.
function avatar(c, size) {
  const [bg, fg] = c.balance > 0 ? ['var(--bad-soft)', 'var(--bad)'] : c.balance < 0 ? ['var(--accent-soft)', 'var(--accent)'] : ['var(--line)', 'var(--muted)'];
  return `<span class="avatar" style="width:${size}px;height:${size}px;background:${bg};color:${fg}" aria-hidden="true">${esc(initials(c.name))}</span>`;
}
// Solde d'un client : positif = il doit (rouge) ; négatif = avance qu'on garde pour lui (vert).
function balTag(b) {
  if (b > 0) return `<span class="pr" style="color:var(--bad)">doit ${money(b)}</span>`;
  if (b < 0) return `<span class="pr" style="color:var(--accent)">avance ${money(-b)}</span>`;
  return '<span class="pr">✓</span>';
}
const advOf = c => (c && c.balance < 0 ? -c.balance : 0);

// Nouveau client (ou modification par le propriétaire / gérant).
function customerForm(c, after) {
  const mgr = isManager();
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="Client">
    <h2>${c ? 'Modifier le client' : 'Nouveau client'}</h2>
    <label>Nom<input id="cu-name" maxlength="100" required value="${esc(c ? c.name : '')}" style="font-size:18px;height:52px"></label>
    <label>Téléphone<input id="cu-phone" type="tel" inputmode="tel" required placeholder="ex. 70 11 22 33" value="${esc(c ? c.phone || '' : '')}" style="font-size:18px;height:52px"></label>
    ${MORE(`<label>Remarque (facultatif)<input id="cu-note" maxlength="200" value="${esc(c ? c.note || '' : '')}" placeholder="ex. maçon, quartier…"></label>
    ${mgr ? `<label>Plafond de crédit en FCFA (vide = sans plafond)<input id="cu-limit" type="number" inputmode="numeric" min="0" step="500" value="${esc(c && c.credit_limit != null ? c.credit_limit : '')}"></label>` : ''}
    ${c && mgr ? `<div style="display:flex;align-items:center;gap:10px"><input id="cu-off" type="checkbox" ${c.active === false ? 'checked' : ''} style="width:22px;height:22px;flex:0 0 auto;margin:0"><label for="cu-off" style="font-size:14px;color:var(--fg);display:inline">Client retiré (n'apparaît plus dans les choix)</label></div>` : ''}`, !!(c && (c.note || c.credit_limit != null)))}
    <button class="btn huge" type="submit">✓ Enregistrer</button><button class="btn ghost" type="button" id="cancel">Annuler</button></form></div>`;
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
    const lim = mgr && $('#cu-limit') && $('#cu-limit').value !== '' ? Math.round(Number($('#cu-limit').value)) : null;
    const res = c
      ? await sb.rpc('update_customer', { p_customer: c.id, p_name: $('#cu-name').value, p_phone: $('#cu-phone').value,
          p_note: $('#cu-note').value || null, p_limit: lim, p_active: !($('#cu-off') && $('#cu-off').checked) })
      : await sb.rpc('create_customer', { p_shop: S.shop.id, p_name: $('#cu-name').value, p_phone: $('#cu-phone').value,
          p_note: $('#cu-note').value || null, p_limit: lim });
    if (res.error) { btn.disabled = false; return toast(cleanErr(res.error), true); }
    closeSheet(); toast('Client enregistré.');
    const list = await loadCustomers(true);
    const saved = list.find(x => x.id === (c ? c.id : res.data));
    if (after && saved) after(saved);
  };
}

async function viewClients() {
  $('#view').innerHTML = '<p class="empty">Chargement…</p>';
  const list = await loadCustomers(true);
  const debt = list.reduce((a, c) => a + Math.max(0, c.balance), 0);
  const held = list.reduce((a, c) => a + Math.max(0, -c.balance), 0);
  if (!['debt', 'adv', 'all'].includes(S.cFilter)) S.cFilter = 'debt';
  const F = [['debt', 'Ils doivent'], ['adv', 'Avances'], ['all', 'Tous']];
  $('#view').innerHTML = `<section class="card stack">
      <button class="btn huge" id="cl-new" ${canWrite() ? '' : 'disabled'}>＋ Nouveau client</button>
      <div class="grid2"><div class="metric"><span>Ils doivent</span><b style="color:${debt ? 'var(--bad)' : 'inherit'}">${money(debt)}</b></div>
        <div class="metric"><span>Avances gardées</span><b style="color:${held ? 'var(--accent)' : 'inherit'}">${money(held)}</b></div></div>
      <input id="cl-q" type="search" placeholder="🔍 Nom ou téléphone" autocomplete="off" style="height:50px;font-size:16px">
      <div class="chips" role="group" aria-label="Filtre">${F.map(([k, l]) => `<button aria-pressed="${S.cFilter === k}" data-cf="${k}">${l}</button>`).join('')}</div>
      <div class="plist" id="cl-list"></div></section>`;
  const draw1 = () => {
    const t = ($('#cl-q').value || '').trim().toLowerCase(), td = t.replace(/[^0-9]/g, '');
    const keep = c => S.cFilter === 'all' || (S.cFilter === 'debt' ? c.balance > 0 : c.balance < 0);
    const rows = list.filter(c => keep(c) && (!t || c.name.toLowerCase().includes(t) || (td && (c.phone || '').includes(td))));
    $('#cl-list').innerHTML = rows.map(c => `<button class="prow" data-cl="${esc(c.id)}" style="${c.active === false ? 'opacity:.6' : ''}">
      ${avatar(c, 46)}
      <span style="min-width:0;flex:1 1 auto"><span class="nm">${esc(c.name)}</span><br><span class="sub">${esc(c.phone || '⚠ téléphone manquant')}</span></span>
      ${balTag(c.balance)}</button>`).join('')
      || `<p class="empty">${S.cFilter === 'debt' ? 'Personne ne doit d\'argent.' : S.cFilter === 'adv' ? 'Aucune avance.' : 'Aucun client.'}</p>`;
    document.querySelectorAll('[data-cl]').forEach(b => b.onclick = () => viewStatement(b.dataset.cl));
  };
  draw1();
  $('#cl-q').oninput = draw1;
  document.querySelectorAll('[data-cf]').forEach(b => b.onclick = () => { S.cFilter = b.dataset.cf; viewClients(); });
  $('#cl-new').onclick = () => customerForm(null, () => viewClients());
}

      <span style="text-align:right"><b style="color:${p.kind === 'refund' ? 'var(--bad)' : 'var(--accent)'}">${p.kind === 'refund' ? '+' : '−'} ${money(p.amount)}</b>${mgr && !p.cancelled_at ? `<br><button class="btn ghost small" data-pc="${esc(p.id)}" data-pk="${esc(p.kind)}">Annuler</button>` : ''}</span></div>` }))

    <section class="card stack">

        <div style="min-width:0"><h2>${esc(c.name)}</h2><div class="muted">${c.phone ? esc(c.phone) : '⚠ téléphone manquant'}${c.note ? ' · ' + esc(c.note) : ''}</div></div></div>
      <div style="text-align:center;padding:6px 0">
        <div class="muted" style="font-size:13.5px">${b > 0 ? 'Il doit' : b < 0 ? 'Son avance' : 'Solde'}</div>
        <div class="bigtotal" style="color:${b > 0 ? 'var(--bad)' : b < 0 ? 'var(--accent)' : 'inherit'}">${b ? esc(money(Math.abs(b))) : 'Rien ✓'}</div>
        ${c.credit_limit != null ? `<div class="muted" style="font-size:12.5px">Plafond de crédit : ${esc(money(c.credit_limit))}</div>` : ''}</div>
      <div class="bigacts">
        <button class="btn" id="st-pay" ${canWrite() ? '' : 'disabled'}><span>💵</span>Il donne de l'argent<small>paiement ou avance</small></button>
        ${c.phone ? `<a class="btn ghost" href="tel:${esc(c.phone)}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;min-height:92px"><span style="font-size:24px">📞</span>Appeler</a>` : ''}
        ${c.phone ? `<button class="btn ghost" id="st-wa"><span>💬</span>WhatsApp<small>${b > 0 ? 'rappel de la dette' : b < 0 ? 'montant de son avance' : 'message'}</small></button>` : ''}
        ${b < 0 && mgr ? `<button class="btn ghost" id="st-ref" ${canWrite() ? '' : 'disabled'}><span>💸</span>Rendre l'avance<small>motif obligatoire</small></button>` : ''}
        ${mgr ? '<button class="btn ghost" id="st-edit"><span>✏️</span>Modifier<small>nom, téléphone, plafond</small></button>' : ''}
      </div>
      ${openQ.length ? `<div class="stack" style="gap:6px">${openQ.map(q => `<button class="btn ghost small" data-sq="${esc(q.id)}">📄 Devis ${esc(quoteNo(q.quote_no))} · ${money(q.total)} · jusqu'au ${dDay(q.valid_until)}</button>`).join('')}</div>` : ''}
    </section>
    <section class="card stack"><h3 style="margin:0">Historique</h3>${ev.map(e => e.html).join('') || '<p class="muted" style="margin:0">Rien pour le moment.</p>'}</section>`;

    $('#cancel').onclick = closeSheet;

      const { error: e3 } = await sb.rpc('cancel_customer_payment', { p_payment: x.dataset.pc, p_reason: $('#pc-why').value });
      if (e3) return toast(cleanErr(e3), true);
      closeSheet(); toast('Annulé.'); S.customers = null; viewStatement(id);

// Dépôt d'argent : paie d'abord la dette ; le reste devient une avance (tout membre).
function paymentForm(c, balance) {
  const ref = uuid();                  // même référence si on appuie deux fois : compté une seule fois
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="Dépôt d'argent">
    <h2>Dépôt : ${esc(c.name)}</h2>
    <div class="muted">${balance > 0 ? 'Doit actuellement ' + money(balance) : balance < 0 ? 'Avance actuelle ' + money(-balance) : 'Ne doit rien'}</div>
    <p class="muted" style="margin:0;font-size:13px">L'argent paie d'abord la dette. Le reste est gardé comme avance pour ses prochains achats.</p>
    <label>Combien il donne (FCFA)<input id="py-amt" type="number" inputmode="numeric" min="1" step="1" required value="${balance > 0 ? esc(balance) : ''}" style="font-size:22px;height:56px;font-weight:700"></label>
    <div class="quick">${balance > 0 ? `<button type="button" data-pa="${balance}">Toute la dette</button>` : ''}${[5000, 10000, 25000, 50000].filter(v => v !== balance).slice(0, balance > 0 ? 2 : 3).map(v => `<button type="button" data-pa="${v}">${esc(fmtNum.format(v))}</button>`).join('')}</div>
    <div id="py-split"></div>
    <div class="modes" style="grid-template-columns:repeat(2,minmax(0,1fr))" role="radiogroup" aria-label="Paiement">
      <button type="button" data-pm="cash" aria-pressed="true"><span class="mi">💵</span>Espèces</button><button type="button" data-pm="mobile_money" aria-pressed="false"><span class="mi">📱</span>Mobile</button></div>
    <input type="hidden" id="py-m" value="cash">
    ${MORE('<label>Remarque (facultatif)<input id="py-note" maxlength="200" placeholder="ex. pour le chantier"></label>')}
    <button class="btn huge" type="submit">✓ Enregistrer</button><button class="btn ghost" type="button" id="cancel">Annuler</button></form></div>`;
  const split = () => {
    const a = Math.round(Number($('#py-amt').value) || 0), d = Math.min(Math.max(balance, 0), a);
    $('#py-split').innerHTML = a > 0 ? `<div class="banner ok" style="margin:0">${d ? `Paie sa dette : <b>${money(d)}</b>` : ''}${d && a - d ? '<br>' : ''}${a - d ? `Gardé en avance : <b>${money(a - d)}</b>` : ''}</div>` : '';
  };
  split(); $('#py-amt').oninput = split;
  document.querySelectorAll('[data-pa]').forEach(b => b.onclick = () => { $('#py-amt').value = b.dataset.pa; split(); });
  document.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => { $('#py-m').value = b.dataset.pm; document.querySelectorAll('[data-pm]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#cancel').onclick = closeSheet;
  $('#sbg').onclick = ev => { if (ev.target.id === 'sbg') closeSheet(); };
  $('#sheet').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('[type=submit]');
    const amt = Math.round(Number($('#py-amt').value)), m = $('#py-m').value;
    if (!(amt > 0)) return toast('Montant invalide.', true);
    if (!btn.dataset.sure) { btn.dataset.sure = '1'; btn.textContent = `Confirmer : ${plainMoney(amt)} FCFA reçus`; return; }
    btn.disabled = true;
    const { data, error } = await sb.rpc('add_customer_payment', { p_customer: c.id, p_amount: amt, p_method: m,
      p_note: $('#py-note').value || null, p_client_ref: ref });
    if (error) { btn.disabled = false; return toast(cleanErr(error), true); }
    S.customers = null;
    receiptSheet({ kind: 'payment', shop: S.shop, customer: c, amount: amt, method: m, balance: data.balance,
      toDebt: data.to_debt, toAdv: data.to_advance, date: new Date().toISOString(), who: S.shop.who });

}

// Rendre une avance : propriétaire ou gérant, motif obligatoire.
function refundForm(c, adv) {
  const ref = uuid();
  $('#sheet-host').innerHTML = `<div class="sheet-bg" id="sbg"><form class="sheet" id="sheet" role="dialog" aria-label="Rendre l'avance">
    <h2>Rendre l'avance : ${esc(c.name)}</h2>

    <label>Montant rendu (FCFA)<input id="rf-amt" type="number" inputmode="numeric" min="1" max="${esc(adv)}" step="1" required value="${esc(adv)}"></label>
    <label>Paiement<select id="rf-m">${Object.entries(PAY).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
    <label>Motif (obligatoire)<input id="rf-why" maxlength="200" required placeholder="ex. chantier annulé"></label>
    ${S.role !== 'owner' ? '<p class="muted" style="margin:0;font-size:13px">Le propriétaire sera prévenu.</p>' : ''}
    <div class="row"><button class="btn" type="submit">Enregistrer</button><button class="btn ghost" type="button" id="cancel">Annuler</button></div></form></div>`;
  $('#cancel').onclick = closeSheet;

    btn.disabled = true;
